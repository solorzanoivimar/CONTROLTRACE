.in{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fcfbf8;font-size:14px;color:var(--ink)}

.btn-gold{background:var(--gold);color:#3a2c08}.btn-gold:hover{background:var(--gold-d);color:#fff}

.dl{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 20px}

.dl .v.e{color:#b9b2a3;font-weight:400;font-style:italic}
.sect{font-size:12px;font-weight:800;color:var(--steel);text-transform:uppercase;letter-spacing:.1em;margin:18px 0 10px;border-bottom:1px solid var(--line);padding-bottom:6px}
.sect:first-child{margin-top:0}
.tl{border-left:3px solid var(--line);margin-left:6px;padding-left:16px}
.tl .ev{position:relative;padding:0 0 16px}
.tl .ev:before{content:"";position:absolute;left:-23px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--gold);border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}

.fg>div{min-width:0}.fg .in{min-width:0;max-width:100%}
.fg .full{grid-column:1/-1}
.fg .two{grid-column:span 2}
/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(17,29,53,.5);display:none;align-items:center;justify-content:center;z-index:95;padding:16px}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:13px;padding:22px;max-width:540px;width:100%;max-height:92vh;overflow:auto}

.modal h3{margin:0 0 6px;color:var(--navy)}

.fut .big{font-size:44px}

.k-x{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);color:#cdd6e4;border-radius:10px;width:42px;height:42px;font-size:18px;cursor:pointer}

.k-keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:360px}

@media(max-width:820px){.k-body{grid-template-columns:1fr;overflow:auto}.k-clk b{font-size:28px}}

}
</style>

function addDays(f,n){if(!f)return '';const d=new Date(String(f).slice(0,10)+'T00:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

// ══════════════ GRILLA (8 por página, selector y barra de acciones · igual que los otros módulos) ══════════════
const G={};
function grid(cid,key,cols,rows,acts,dbl){
  const st=G[key]||(G[key]={pag:1,sel:null});st.args=[cid,key,cols,rows,acts,dbl];
  const pags=Math.max(1,Math.ceil(rows.length/PP));st.pag=Math.min(Math.max(1,st.pag),pags);
  if(st.sel&&!rows.some(r=>r._k===st.sel))st.sel=null;
  const sel=rows.find(r=>r._k===st.sel);const A=sel?acts(sel):[];window['_ga_'+key]=A;window['_gd_'+key]=dbl;
  const vis=rows.slice((st.pag-1)*PP,st.pag*PP);
  const bar=`<div class="gx-bar"><div class="gx-pager"><button class="btn btn-ghost btn-sm" ${st.pag<=1?'disabled':''} onclick="gridPag('${key}',-1)">◀</button><b>Pág. ${st.pag} de ${pags}</b><button class="btn btn-ghost btn-sm" ${st.pag>=pags?'disabled':''} onclick="gridPag('${key}',1)">▶</button><span class="gx-n">${rows.length} registro${rows.length===1?'':'s'}</span></div>
   <div class="gx-acts">${sel?`<span class="gx-who">${esc(sel._lbl||'')}</span>`+(A.length?A.map((a,i)=>`<button class="btn btn-sm ${a.cls||'btn-ghost'}" ${a.dis?'disabled':''} onclick="gridDo('${key}',${i})">${a.lbl}</button>`).join(''):'<span class="gx-hint">Sin acciones para este registro</span>'):'<span class="gx-hint">☝️ Seleccioná un registro de la lista'+(dbl?' (doble clic para abrir)':'')+'</span>'}</div></div>`;
  const body=vis.map(r=>`<tr class="gx-r${r._k===st.sel?' gx-on':''}" onclick="gridSel('${key}','${esc(r._k)}')" ondblclick="gridDbl('${key}','${esc(r._k)}')"><td class="gx-sel"><input type="radio" name="gx_${key}" ${r._k===st.sel?'checked':''} aria-label="Seleccionar"></td>${cols.map(c=>`<td class="${c.cls||''}">${c.f(r)}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${cols.length+1}" class="empty">Sin registros</td></tr>`;
  $(cid).innerHTML=bar+`<div class="tscroll"><table><thead><tr><th></th>${cols.map(c=>`<th class="${c.cls||''}">${c.h}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div>`;}
function gridRedraw(key){const st=G[key];if(st&&st.args&&$(st.args[0]))grid(...st.args);}
function gridSel(key,k){G[key].sel=k;gridRedraw(key);}
function gridPag(key,d){G[key].pag+=d;G[key].sel=null;gridRedraw(key);}
function gridDo(key,i){const a=(window['_ga_'+key]||[])[i];if(a&&!a.dis)a.fn();}
function gridDbl(key,k){const f=window['_gd_'+key];if(f)f(k);}

const emp=id=>S.emps.find(e=>e.id===id);
function nomE(e){if(!e)return '—';return e.apellido?`${e.apellido}, ${e.nombre}`:(e.nombre||'—');}
function nomCorto(e){return e?[e.nombre,e.apellido].filter(Boolean).join(' '):'—';}
function iniciales(e){const p=[e.nombre,e.apellido].filter(Boolean).join(' ').split(/\s+/).filter(Boolean);return ((p[0]||'?')[0]+((p.length>1?p[p.length-1]:'')[0]||'')).toUpperCase();}
function meses(a,b){const x=new Date(d10(a)+'T00:00:00'),y=new Date(d10(b)+'T00:00:00');let m=(y.getFullYear()-x.getFullYear())*12+(y.getMonth()-x.getMonth());if(y.getDate()<x.getDate())m--;return m;}
function antigM(e){if(!e||!e.fecha_ingreso)return null;const fin=(e.estado==='baja'&&e.fecha_egreso)?e.fecha_egreso:today();const m=meses(e.fecha_ingreso,fin);return m<0?null:m;}
function txtMeses(m){if(m==null)return '';const y=Math.floor(m/12),mm=m%12;if(!y&&!mm)return 'menos de 1 mes';return (y?y+' año'+(y>1?'s':''):'')+(y&&mm?' y ':'')+(mm?mm+' mes'+(mm>1?'es':''):'');}
function edad(e){if(!e||!e.fecha_nacimiento)return null;return Math.floor(meses(e.fecha_nacimiento,today())/12);}
const REQ=[['apellido','Apellido'],['dni','DNI'],['cuil','CUIL'],['fecha_ingreso','Fecha de ingreso'],['sector','Sector'],['puesto','Puesto'],['telefono','Teléfono']];
function faltan(e){return REQ.filter(([k])=>!e[k]).map(r=>r[1]);}
function cuilDig(c){return String(c||'').replace(/\D/g,'');}
function fmtCuil(c){const d=cuilDig(c);return d.length===11?d.slice(0,2)+'-'+d.slice(2,10)+'-'+d.slice(10):String(c||'').trim();}
function cuilOK(c){const d=cuilDig(c);if(d.length!==11)return false;const w=[5,4,3,2,7,6,5,4,3,2];let s=0;for(let i=0;i<10;i++)s+=(+d[i])*w[i];let v=11-(s%11);if(v===11)v=0;if(v===10)v=9;return v===+d[10];}
function nextLegajo(extra){let mx=0;S.emps.forEach(e=>{const m=/(\d+)\s*$/.exec(e.legajo||'');if(m)mx=Math.max(mx,+m[1]);});return 'EMP-'+String(mx+1+(extra||0)).padStart(4,'0');}
function opDe(e){return e&&e.operario_id?S.ops.find(o=>o.id===e.operario_id):null;}
function opsLibres(exceptId){const used=new Set(S.emps.filter(e=>e.operario_id&&e.id!==exceptId).map(e=>e.operario_id));return S.ops.filter(o=>!used.has(o.id));}
function opsSinLegajo(){return opsLibres().filter(o=>o.activo!==false);}
function estadoTag(e){return e.estado==='baja'?`<span class="tag t-mut">Baja${e.fecha_egreso?' '+fmtD(e.fecha_egreso):''}</span>`:'<span class="tag t-ok">Activo</span>';}
// documentos
function aviso(){return (S.L&&S.L.avisoDias)||30;}
function tipoVence(t){const x=(S.L.tiposDoc||[]).find(o=>o.n===t);return !!(x&&x.v);}
function reemplazado(d){return S.docs.some(o=>o.id!==d.id&&o.estado!=='anulado'&&o.empleado_id===d.empleado_id&&o.tipo===d.tipo&&o.vence&&d.vence&&d10(o.vence)>d10(d.vence));}
function docEst(d){if(d.estado==='anulado')return 'anulado';if(!d.vence)return 'sin';if(reemplazado(d))return 'renovado';const n=diasHasta(d.vence);if(n<0)return 'vencido';if(n<=aviso())return 'porvencer';return 'vigente';}
function docTag(d){const e=docEst(d),n=diasHasta(d.vence);return {anulado:'<span class="tag t-mut">Anulado</span>',sin:'<span class="tag t-nav">Sin vencimiento</span>',renovado:'<span class="tag t-mut">Renovado</span>',vencido:`<span class="tag t-out">Vencido hace ${-n} d</span>`,porvencer:`<span class="tag t-warn">Vence en ${n} d</span>`,vigente:'<span class="tag t-ok">Vigente</span>'}[e];}
function docsAlerta(){return S.docs.filter(d=>{const e=emp(d.empleado_id);return e&&e.estado!=='baja'&&['vencido','porvencer'].includes(docEst(d));}).sort((a,b)=>d10(a.vence).localeCompare(d10(b.vence)));}
function docsDe(id){return S.docs.filter(d=>d.empleado_id===id);}
function alertasDe(id){return S.docs.filter(d=>d.empleado_id===id&&['vencido','porvencer'].includes(docEst(d)));}

function pinAuth(v){v=(v||'').trim();if(!v)return null;const master=(((S.empresa&&S.empresa.pin)||'1234')+'').trim();if(v===master)return {nombre:(S.empresa&&S.empresa.pin_nombre)||'Supervisor'};const list=(S.empresa&&S.empresa.autorizadores)||[];const f=list.find(a=>a&&a.activo!==false&&((a.pin||'')+'').trim()===v);return f?{nombre:f.nombre||'Autorizador'}:null;}
async function logNovedad(tipo,ref,detalle,auth){try{const {error}=await sb.from('novedades').insert({empresa_id:S.empresaId,fecha:today(),tipo:tipo,referencia:ref||null,detalle:(detalle||'').slice(0,400)||null,autorizado_por:(auth&&auth.nombre)||null,ejecutado_por:S.nombre||null});if(error)console.warn('[auditoría] no se pudo registrar',error.message);}catch(e){console.warn('[auditoría]',e);}}
async function addHist(empId,tipo,detalle,ant,nue,auth,fecha){const {error}=await sb.from('rrhh_historial').insert({empresa_id:S.empresaId,empleado_id:empId,fecha:fecha||today(),tipo,detalle:detalle||null,valor_anterior:ant||null,valor_nuevo:nue||null,autorizado_por:(auth&&auth.nombre)||null,registrado_por:S.nombre||null});if(error)throw error;}
// o: {titulo, html, btn, tipo, ref, detalle(), validar(), onOK(auth)}
function pinModal(o){
  modal(`<h3>🔒 ${o.titulo}</h3>${o.html||''}<label class="lb">PIN de supervisor *</label><input class="in" type="password" inputmode="numeric" id="pin_v" autocomplete="off" placeholder="PIN o QR de autorización"><p class="hint" style="margin:6px 0 0">Queda registrado en CONTROL TOTAL → Auditoría.</p><div class="row"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-gold" id="pin_ok">${o.btn||'✅ Autorizar'}</button></div>`,o.wide);
  const go_=async()=>{const err=o.validar?o.validar():null;if(err)return banner(err,'warn');const a=pinAuth($('pin_v').value);if(!a){banner('PIN incorrecto','err');$('pin_v').select();return;}
    const b=$('pin_ok');b.disabled=true;b.textContent='⏳ Guardando…';
    try{await o.onOK(a);await logNovedad(o.tipo,o.ref,typeof o.detalle==='function'?o.detalle():o.detalle,a);closeModal();}catch(e){banner('Error: '+errMsg(e),'err');b.disabled=false;b.textContent=o.btn||'✅ Autorizar';}};
  $('pin_ok').onclick=go_;$('pin_v').addEventListener('keydown',ev=>{if(ev.key==='Enter'){ev.preventDefault();go_();}});
}

function proximos(campo,dias,minAnios){const t=today(),out=[];S.emps.filter(e=>e.estado!=='baja'&&e[campo]).forEach(e=>{const f=d10(e[campo]);const y=+t.slice(0,4);for(const yy of [y,y+1]){let md=f.slice(5);if(md==='02-29'&&!((yy%4===0&&yy%100!==0)||yy%400===0))md='02-28';const c=yy+'-'+md;const n=diasHasta(c);if(n>=0&&n<=dias){const an=yy-(+f.slice(0,4));if(an>=(minAnios||0))out.push({e,f:c,n,an});break;}}});return out.sort((a,b)=>a.n-b.n);}
function cuandoTxt(n){return n===0?'<b>Hoy</b>':n===1?'Mañana':'En '+n+' días';}

    ${S.e2ok!==false?`<div class="kpi ck" onclick="F.aTab='parte';F.aFecha=today();go('asis')"><small>Presentes hoy</small><b>${nf(hoyP.filter(x=>['presente','tarde'].includes(x.i.est)).length)}<span style="font-size:14px;color:var(--muted)">/${nf(hoyP.filter(x=>x.i.est!=='franco').length)}</span></b><span>${nf(hoyP.filter(x=>x.i.est==='tarde').length)} tarde · ${nf(hoyP.filter(x=>x.i.est==='ausente').length)} ausentes</span></div>

function viewLegajos(){
  const L=S.L;const opt=(l,v)=>l.map(x=>`<option${x===v?' selected':''}>${esc(x)}</option>`).join('');
  const secs=[...new Set([...L.sectores,...S.emps.map(e=>e.sector).filter(Boolean)])];const mods=[...new Set([...L.modalidades,...S.emps.map(e=>e.modalidad).filter(Boolean)])];
  $('view').innerHTML=`<div class="card"><div class="card-h"><h3>👤 Legajos</h3><div class="seg">
    ${gestiona()?'<button class="btn btn-gold" onclick="editEmp()">＋ Nuevo legajo</button>':''}
    ${gestiona()&&S.opsOk&&opsSinLegajo().length?`<button class="btn btn-ghost" onclick="importarOps()">⤵️ Importar operarios (${opsSinLegajo().length})</button>`:''}
    <button class="btn btn-ghost" onclick="exportLegajos()">📥 Excel</button></div></div>
   <div class="filters">
    <div class="f" style="flex:1;min-width:200px">Buscar<input class="in" id="fq" placeholder="Nombre, legajo, DNI o CUIL" value="${esc(F.q)}" oninput="F.q=this.value;G.leg&&(G.leg.pag=1);drawLegajos()"></div>
    <div class="f">Sector<select class="in" onchange="F.sector=this.value;drawLegajos()"><option value="">Todos</option>${opt(secs,F.sector)}</select></div>
    <div class="f">Modalidad<select class="in" onchange="F.mod=this.value;drawLegajos()"><option value="">Todas</option>${opt(mods,F.mod)}</select></div>
    <div class="f">Estado<select class="in" onchange="F.estado=this.value;drawLegajos()">${[['activos','Activos'],['bajas','De baja'],['incompletos','Incompletos'],['todos','Todos']].map(([k,l])=>`<option value="${k}"${F.estado===k?' selected':''}>${l}</option>`).join('')}</select></div>
   </div><div id="legGrid"></div></div>`;
  drawLegajos();
}
function filtLegajos(){const q=norm(F.q),qd=cuilDig(F.q);return S.emps.filter(e=>{
  if(F.estado==='activos'&&e.estado==='baja')return false;if(F.estado==='bajas'&&e.estado!=='baja')return false;if(F.estado==='incompletos'&&(e.estado==='baja'||!faltan(e).length))return false;
  if(F.sector&&e.sector!==F.sector)return false;if(F.mod&&e.modalidad!==F.mod)return false;
  if(q&&!(norm(nomE(e)).includes(q)||norm(nomCorto(e)).includes(q)||norm(e.legajo).includes(q)||(qd.length>=3&&(cuilDig(e.dni).includes(qd)||cuilDig(e.cuil).includes(qd)))))return false;return true;})
  .sort((a,b)=>norm(nomE(a)).localeCompare(norm(nomE(b))));}
function drawLegajos(){
  const rows=filtLegajos().map(e=>Object.assign({},e,{_k:e.id,_lbl:nomE(e)}));
  grid('legGrid','leg',[
    {h:'Legajo',f:r=>`<b>${esc(r.legajo||'—')}</b>`},
    {h:'Apellido y nombre',f:r=>`<b>${esc(nomE(r))}</b>${r.dni?`<div class="cod">DNI ${esc(r.dni)}</div>`:''}`},
    {h:'Sector · puesto',f:r=>`${esc(r.sector||'—')}<div class="cod">${esc(r.puesto||'')}</div>`},
    {h:'Ingreso',f:r=>r.fecha_ingreso?`${fmtD(r.fecha_ingreso)}<div class="cod">${txtMeses(antigM(r))}</div>`:'<span class="muted">—</span>'},
    {h:'Modalidad',f:r=>esc(r.modalidad||'—')},
    {h:'Estado',f:r=>{const a=alertasDe(r.id),fl=faltan(r);return estadoTag(r)+(r.estado!=='baja'&&a.length?` <span class="tag ${a.some(d=>docEst(d)==='vencido')?'t-out':'t-warn'}" title="${esc(a.map(d=>d.tipo).join(', '))}">📎 ${a.length}</span>`:'')+(r.estado!=='baja'&&fl.length?` <span class="tag t-warn" title="Falta: ${esc(fl.join(', '))}">Incompleto</span>`:'');}},
    {h:'TRACE',f:r=>r.operario_id?'<span title="Vinculado al operario de TRACE">🔗</span>':'<span class="muted">—</span>'}
  ],rows,r=>{const a=[{lbl:'👁️ Ver ficha',cls:'btn-gold',fn:()=>go('ficha',r.id)}];if(gestiona())a.push({lbl:'✏️ Editar',fn:()=>editEmp(r.id)},{lbl:'📎 Documento',fn:()=>upDoc(r.id)});return a;},k=>go('ficha',k));
}

function histCambio(h){const a=h.valor_anterior,n=h.valor_nuevo;if(!a||!n||typeof a!=='object')return '';const L={sector:'Sector',puesto:'Puesto',categoria:'Categoría',convenio:'Convenio',modalidad:'Modalidad',turno:'Turno',jornada:'Jornada'};

async function saveEmp(id){
  const e=id?emp(id):null;const v=k=>{const x=$(k);return x?String(x.value||'').trim():'';};
  const o={apellido:v('e_apellido')||null,nombre:v('e_nombre'),dni:cuilDig(v('e_dni'))||null,cuil:v('e_cuil')?fmtCuil(v('e_cuil')):null,fecha_nacimiento:v('e_nac')||null,telefono:v('e_tel')||null,email:v('e_mail')||null,domicilio:v('e_dom')||null,localidad:v('e_loc')||null,
    emergencia_nombre:v('e_emn')||null,emergencia_vinculo:v('e_emv')||null,emergencia_tel:v('e_emt')||null,fecha_ingreso:v('e_ing')||null,observaciones:v('e_obs')||null};
  if(!e)Object.assign(o,{modalidad:v('e_mod')||null,sector:v('e_sec')||null,puesto:v('e_pue')||null,categoria:v('e_cat')||null,convenio:v('e_con')||null,turno:v('e_tur')||null,jornada:v('e_jor')||null});
  if(!o.apellido||!o.nombre)return banner('Completá apellido y nombre','warn');
  if(!e&&!o.fecha_ingreso)return banner('Indicá la fecha de ingreso','warn');
  if(!e&&(!o.sector||!o.puesto))return banner('Elegí el sector y el puesto','warn');
  if(o.dni&&(o.dni.length<7||o.dni.length>8))return banner('El DNI debe tener 7 u 8 números','warn');
  if(o.cuil&&!cuilOK(o.cuil))return banner('El CUIL no es válido (revisá los 11 números)','warn');
  if(o.cuil&&o.dni&&!cuilDig(o.cuil).slice(2,10).endsWith(o.dni))return banner('El DNI no coincide con el del CUIL','warn');
  if(o.dni&&S.emps.some(x=>x.id!==id&&x.dni===o.dni))return banner('Ya existe un legajo con ese DNI: '+nomE(S.emps.find(x=>x.id!==id&&x.dni===o.dni)),'warn');
  if(o.fecha_nacimiento&&o.fecha_nacimiento>today())return banner('La fecha de nacimiento no puede ser futura','warn');
  const opv=v('e_op');const b=$('e_ok');b.disabled=true;b.textContent='⏳ Guardando…';
  try{
    let row;
    if(e){const {data,error}=await sb.from('rrhh_empleados').update(o).eq('id',e.id).eq('empresa_id',S.empresaId).select().single();if(error)throw error;row=data;
      const camb=Object.keys(o).filter(k=>(e[k]||null)!==(o[k]||null)&&!(d10(e[k])&&d10(e[k])===o[k]));
      if(camb.length)await addHist(e.id,'edicion','Se actualizaron: '+camb.map(k=>({apellido:'apellido',nombre:'nombre',dni:'DNI',cuil:'CUIL',fecha_nacimiento:'fecha de nacimiento',telefono:'teléfono',email:'email',domicilio:'domicilio',localidad:'localidad',emergencia_nombre:'contacto de emergencia',emergencia_vinculo:'vínculo de emergencia',emergencia_tel:'teléfono de emergencia',fecha_ingreso:'fecha de ingreso',observaciones:'observaciones'})[k]||k).join(', '));}
    else{let leg=nextLegajo(),error,data;for(let i=0;i<3;i++){({data,error}=await sb.from('rrhh_empleados').insert(Object.assign({empresa_id:S.empresaId,legajo:leg,estado:'activo',created_by:S.nombre},o)).select().single());if(!error||!/legajo_uq/.test(error.message||''))break;await loadEmps();leg=nextLegajo();}
      if(error)throw error;row=data;await addHist(row.id,'alta',`Ingreso como ${o.puesto} en ${o.sector}`+(o.modalidad?' · '+o.modalidad:''),null,{sector:o.sector,puesto:o.puesto,categoria:o.categoria,convenio:o.convenio,modalidad:o.modalidad,turno:o.turno,jornada:o.jornada},null,o.fecha_ingreso);}
    // vínculo con TRACE
    const prevOp=e?e.operario_id||'':'';
    if(opv==='__new'){const nomOp=[o.nombre,o.apellido].join(' ');const {data:opr,error:eo}=await sb.from('operarios').insert({empresa_id:S.empresaId,nombre:nomOp,area:v('e_opa')||'producción'}).select().single();
      if(eo)banner('El legajo se guardó, pero no se pudo crear el operario en TRACE: '+errMsg(eo),'warn');
      else{const {error:el}=await sb.from('rrhh_empleados').update({operario_id:opr.id}).eq('id',row.id);if(el)throw el;await addHist(row.id,'vinculo_operario','Se creó el operario "'+nomOp+'" en CONTROL TRACE y se vinculó al legajo');}}
    else if(opv!==prevOp){const {error:el}=await sb.from('rrhh_empleados').update({operario_id:opv||null}).eq('id',row.id);if(el)throw el;const op=S.ops.find(x=>x.id===opv);await addHist(row.id,'vinculo_operario',opv?'Vinculado al operario de TRACE "'+(op?op.nombre:'')+'"':'Se quitó el vínculo con el operario de TRACE');}
    closeModal();await Promise.all([loadEmps(),loadHist(),loadOps()]);banner(e?'Legajo actualizado ✓':'Legajo '+row.legajo+' creado ✓');go('ficha',row.id);
  }catch(err){banner('Error: '+errMsg(err),'err');b.disabled=false;b.textContent='💾 '+(e?'Guardar cambios':'Crear legajo');}
}

const TZ='America/Argentina/Buenos_Aires';
const SOL_T={vacaciones:['🏖️','Vacaciones'],enfermedad:['🤒','Licencia por enfermedad'],especial:['📋','Licencia especial'],permiso:['⏱️','Permiso de horas'],cambio_turno:['🔁','Cambio de turno'],adelanto:['💵','Adelanto de sueldo'],constancia:['📄','Constancia laboral'],datos:['✏️','Actualizar mis datos'],consulta:['💬','Consulta a RRHH']};

function horaAR(ts){return new Date(ts).toLocaleTimeString('es-AR',{timeZone:TZ,hour:'2-digit',minute:'2-digit',hour12:false});}
function minDia(hhmm){const m=/^(\d{1,2}):(\d{2})/.exec(hhmm||'');return m?(+m[1])*60+(+m[2]):null;}
function ahoraMin(){return minDia(horaAR(new Date()));}
function hm(min){if(min==null||isNaN(min))return '—';min=Math.round(min);const h=Math.floor(min/60),m=min%60;return (h?h+' h':'')+(h&&m?' ':'')+(m||!h?m+' min':'');}
function hmc(min){min=Math.round(min||0);return Math.floor(min/60)+':'+String(min%60).padStart(2,'0');}
function horarioDe(e){const h=(S.L.horarios||{})[e&&e.turno];return h&&minDia(h.ini)!=null&&minDia(h.fin)!=null?h:null;}
function durTurno(h){let d=minDia(h.fin)-minDia(h.ini);if(d<=0)d+=1440;return d;}
function tol(){const t=+S.L.tolerancia;return isNaN(t)?10:Math.max(0,t);}
function diaSem(f){return new Date(d10(f)+'T00:00:00').getDay();}
function laborable(f){return (S.L.diasLab||[1,2,3,4,5,6]).includes(diaSem(f));}
function e8(){return String(S.empresaId||'').slice(0,8);}
function appURL(codigo){const u=new URL('empleado.html',location.href);u.search='?e='+e8();u.hash=codigo?'f='+codigo:'';return u.toString();}

  if(error){let m=error.message||'';try{const t=await error.context.json();if(t&&t.error)m=t.error;}catch(x){}if(/Failed to send|FunctionsFetchError|404|not found|NOT_FOUND/i.test(m)||/Fetch/i.test(error.name||''))throw new Error('FN_NO');throw new Error(m);}
  if(data&&data.error)throw new Error(data.error);return data||{};}

// ── cálculo de la jornada ──
function jorInfo(e,f){const fs=(S.fIdx[e.id+'|'+f]||[]).slice().sort((a,b)=>String(a.ts).localeCompare(String(b.ts)));
  let trab=0,ab=null,ent=null,sal=null;fs.forEach(x=>{if(x.tipo==='entrada'){if(!ent)ent=x;ab=x;}else{sal=x;if(ab){trab+=(new Date(x.ts)-new Date(ab.ts))/6e4;ab=null;}}});
  const h=horarioDe(e);let tarde=null;if(ent&&h){let d=minDia(horaAR(ent.ts))-minDia(h.ini);if(d>720)d-=1440;if(d<-720)d+=1440;tarde=d>tol()&&d<=240?d:null;}
  const lic=(S.sol||[]).find(s=>s.empleado_id===e.id&&s.estado==='aprobada'&&LIC_T.includes(s.tipo)&&s.desde&&d10(s.desde)<=f&&d10(s.hasta||s.desde)>=f);
  const per=(S.sol||[]).find(s=>s.empleado_id===e.id&&s.estado==='aprobada'&&s.tipo==='permiso'&&d10(s.desde)===f);
  const extra=h&&trab>durTurno(h)+29?trab-durTurno(h):0;const t=today();let est;
  if((e.fecha_ingreso&&d10(e.fecha_ingreso)>f)||(e.estado==='baja'&&e.fecha_egreso&&d10(e.fecha_egreso)<f))est='na';
  else if(fs.length)est=tarde!=null?'tarde':'presente';
  else if(lic)est='licencia';else if(!laborable(f))est='franco';else if(f>t)est='futuro';else if(f<t)est='ausente';
  else est=h?(ahoraMin()>minDia(h.ini)+tol()?'ausente':'espera'):'sinfichar';
  return {fs,ent,sal,trab,abierta:!!ab,tarde,lic,per,extra,est,h};}
function estTag(i,f){const sinSal=i.abierta&&f<today()?' <span class="tag t-warn">Sin salida</span>':'';
  return ({presente:'<span class="tag t-ok">Presente</span>',tarde:`<span class="tag t-warn">Tarde ${i.tarde}′</span>`,licencia:`<span class="tag t-nav">${esc(SOL_T[i.lic&&i.lic.tipo]?SOL_T[i.lic.tipo][1]:'Licencia')}</span>`,franco:'<span class="tag t-mut">Franco</span>',ausente:'<span class="tag t-out">Ausente</span>',espera:'<span class="tag t-mut">Todavía no fichó</span>',sinfichar:'<span class="tag t-mut">Sin fichar</span>',futuro:''}[i.est]||'')+(i.per?' <span class="tag t-gold">Permiso</span>':'')+sinSal;}

function drawParte(){const f=F.aFecha,q=norm(F.aQ||'');const ests=(F.aEst||'').split(',').filter(Boolean);
  const rows=(window._parte||[]).filter(x=>(!F.aSec||x.e.sector===F.aSec)&&(!ests.length||ests.includes(x.i.est))&&(!q||norm(nomE(x.e)).includes(q)||norm(x.e.legajo).includes(q)))
   .sort((a,b)=>norm(nomE(a.e)).localeCompare(norm(nomE(b.e)))).map(x=>Object.assign({},x,{_k:x.e.id,_lbl:nomE(x.e)}));

   {h:'Entrada',f:r=>r.i.ent?`<b>${horaAR(r.i.ent.ts)}</b> <span title="${esc(r.i.ent.medio)}">${MEDIO_I[r.i.ent.medio]||''}</span>`:'<span class="muted">—</span>'},

   {h:'Horas',f:r=>r.i.trab?hmc(r.i.trab)+(r.i.extra?` <span class="tag t-gold" title="Horas extra">+${hmc(r.i.extra)}</span>`:''):'<span class="muted">—</span>'},
   {h:'Estado',f:r=>estTag(r.i,f)}],rows,

function verFichadas(id,f){const e=emp(id);const L=(S.fich||[]).filter(x=>x.empleado_id===id&&d10(x.jornada)===f).sort((a,b)=>String(a.ts).localeCompare(String(b.ts)));const i=jorInfo(e,f);

  else if(r.aniversario)s=`🏅 Hoy cumplís ${r.aniversario} año${r.aniversario>1?'s':''} con nosotros. ¡Gracias por estar!`;
  else if(r.vuelve)s=r.vuelve==='enfermedad'?'¡Qué bueno tenerte de vuelta! Esperamos que estés mejor.':r.vuelve==='vacaciones'?'¡Qué bueno tenerte de vuelta! Esperamos que hayas descansado.':'¡Qué bueno tenerte de vuelta!';
  else if(r.diff_min!=null&&Math.abs(r.diff_min)<=180){if(r.diff_min<=-5)s=`Llegaste ${hm(-r.diff_min)} antes. ¡Gracias por la puntualidad!`;else if(r.diff_min<=tl)s='¡Justo a tiempo! Que tengas una buena jornada.';else s=`Hoy se te hizo un poquito tarde (${hm(r.diff_min)}). ¿Todo bien? ¡Que rinda el día!`;}
  return {t:`${sal}, ${n}!`,s};}

function diasSol(s){return s.desde&&s.hasta?Math.round((new Date(d10(s.hasta)+'T00:00:00')-new Date(d10(s.desde)+'T00:00:00'))/864e5)+1:null;}
function resumenSol(s){const T=s.tipo,dd=diasSol(s);if(LIC_T.includes(T))return `${fmtD(s.desde)}${s.hasta&&s.hasta!==s.desde?' al '+fmtD(s.hasta):''}${dd?` · ${dd} día${dd>1?'s':''}`:''}`;
  if(T==='permiso')return `${fmtD(s.desde)} · ${s.hora_desde||''}${s.hora_hasta?'–'+s.hora_hasta:''}`;if(T==='cambio_turno')return fmtD(s.desde)+(s.detalle?' · '+s.detalle.slice(0,60):'');

function filtSol(empId){const est=F.sEst==null?'pendiente':F.sEst,q=norm(F.sQ||'');return (S.sol||[]).filter(s=>{if(empId)return s.empleado_id===empId;const e=emp(s.empleado_id);if(!e)return false;if(est&&s.estado!==est)return false;if(F.sTipo&&s.tipo!==F.sTipo)return false;if(q&&!(norm(nomE(e)).includes(q)||norm(e.legajo).includes(q)))return false;return true;});}

   <div class="row"><button class="btn btn-ghost" onclick="closeModal()">Cerrar</button><button class="btn btn-ghost" onclick="closeModal();F.fTab='sol';go('ficha','${s.empleado_id}')">👤 Ficha</button>${gestiona()&&s.estado==='pendiente'?`<button class="btn btn-danger" onclick="resolverSol('${s.id}',false)">✕ Rechazar</button><button class="btn btn-gold" onclick="resolverSol('${s.id}',true)">✅ Aprobar</button>`:''}</div>`,true);}

function copiar(t){try{navigator.clipboard.writeText(t).then(()=>banner('Copiado ✓'),()=>banner('No se pudo copiar','warn'));}catch(e){banner('No se pudo copiar','warn');}}
async function printCred(id,pin){const e=emp(id);let qr='';try{qr=await qrDataURL(appURL(),400);}catch(x){}
  cartel('Tu acceso a la app de RRHH',qr,esc(nomCorto(e))+' · DNI '+esc(e.dni)+' · <b style="font-size:26px;letter-spacing:4px">PIN '+pin+'</b>','1) Escaneá el código con la cámara del celular.<br>2) Ingresá con tu DNI y tu PIN.<br>3) Tocá <b>Agregar a pantalla de inicio</b>.<br>Con el mismo PIN fichás en la tablet. No compartas tu PIN y cambialo desde la app.');}
function quitarApp(id){const e=emp(id);modal(`<h3>⛔ Quitar acceso a la app</h3><p class="hint">${esc(nomCorto(e))} no va a poder entrar más a la app del celular (su PIN de la tablet sigue). Lo podés volver a activar cuando quieras.</p><div class="row"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-danger" id="qa_ok" onclick="doQuitarApp('${id}')">⛔ Quitar acceso</button></div>`);}
async function doQuitarApp(id,silencioso){const b=$('qa_ok');if(b)b.disabled=true;try{await fn({action:'revocar',empleado_id:id});await addHist(id,'app','Se quitó el acceso a la app del celular');await Promise.all([loadEmps(),loadHist()]);if(!silencioso){closeModal();banner('Acceso a la app quitado');render();}return true;}
  catch(e){if(!silencioso){banner(e.message==='FN_NO'?'Falta publicar la función rrhh en Supabase':'Error: '+e.message,'err');if(b)b.disabled=false;}return false;}}
// pestañas de la ficha
function fichaAsis(e){const t=today();const ym=t.slice(0,7),r=resumenMes(e,ym),rows=[];for(let i=0;i<31;i++){const f=addDays(t,-i);const j=jorInfo(e,f);if(['na','futuro'].includes(j.est)||(j.est==='franco'&&!j.fs.length))continue;rows.push({f,j});}
  return `<div class="card-h"><h3>🕒 Asistencia (últimos 31 días)</h3><button class="btn btn-ghost btn-sm" onclick="F.aTab='mes';go('asis')">📅 Resumen del mes</button></div>
   <div class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr))"><div class="kpi"><small>Este mes</small><b>${r.dias}</b><span>días trabajados</span></div><div class="kpi"><small>Horas</small><b>${hmc(r.trab)}</b><span>extra ${hmc(r.extra)}</span></div><div class="kpi"><small>Tardanzas</small><b class="${r.tarde?'a':''}">${r.tarde}</b><span>${hm(r.minTarde)}</span></div><div class="kpi"><small>Ausencias</small><b class="${r.aus?'r':''}">${r.aus}</b></div></div>
   ${rows.length?`<div class="tscroll"><table><thead><tr><th>Día</th><th>Entrada</th><th>Salida</th><th>Horas</th><th>Estado</th></tr></thead><tbody>${rows.map(({f,j})=>`<tr class="gx-r" onclick="verFichadas('${e.id}','${f}')"><td><b>${DIAS_L[diaSem(f)].slice(0,3)} ${fmtD(f).slice(0,5)}</b></td><td>${j.ent?horaAR(j.ent.ts)+' '+(MEDIO_I[j.ent.medio]||''):'—'}</td><td>${j.sal?horaAR(j.sal.ts)+' '+(MEDIO_I[j.sal.medio]||''):'—'}</td><td>${j.trab?hmc(j.trab):'—'}</td><td>${estTag(j,f)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Sin registros todavía</div>'}`;}

// ══════════════ CONFIGURACIÓN: HORARIOS, AVISOS Y APP ══════════════
async function saveCfgListas(parcial){const listas=Object.assign({},S.L,parcial);const {error}=S.cfgRow?await sb.from('rrhh_config').update({listas}).eq('empresa_id',S.empresaId):await sb.from('rrhh_config').insert({empresa_id:S.empresaId,listas});if(error)throw error;await loadCfg();}
function viewHorarios(){const L=S.L,g=gestiona(),H=L.horarios||{},N=L.notif||{};
  $('cfgBody').innerHTML=`<div class="card"><div class="card-h"><h3>🕒 Horarios por turno</h3>${g?'<button class="btn btn-gold" id="hz_ok" onclick="saveHorarios()">💾 Guardar</button>':''}</div>
   <p class="hint">Con el horario se calculan las <b>tardanzas</b> y las <b>horas extra</b>. Dejá vacíos los turnos sin horario fijo (rotativo, cortado). Los turnos se editan en la pestaña Listas.</p>
   <table><thead><tr><th>Turno</th><th>Ingreso</th><th>Salida</th><th>Duración</th></tr></thead><tbody>${L.turnos.map((t,i)=>{const h=H[t]||{};return `<tr><td><b>${esc(t)}</b></td><td><input class="in" type="time" id="hz_i${i}" value="${esc(h.ini||'')}" ${g?'':'disabled'} style="max-width:140px"></td><td><input class="in" type="time" id="hz_f${i}" value="${esc(h.fin||'')}" ${g?'':'disabled'} style="max-width:140px"></td><td class="small muted">${h.ini&&h.fin?hm(durTurno(h)):'—'}</td></tr>`;}).join('')}</tbody></table>
   <div class="fg" style="margin-top:6px">${fi('hz_tol','Tolerancia de llegada (minutos)',String(tol()),{type:'number',attr:'min="0" max="60"'+(g?'':' disabled')})}<div class="two"><label class="lb">Días laborables</label><div class="seg">${[1,2,3,4,5,6,0].map(d=>`<label class="chk" style="margin-right:8px"><input type="checkbox" class="hz_d" value="${d}" ${(L.diasLab||[]).includes(d)?'checked':''} ${g?'':'disabled'}> ${DIAS_L[d].slice(0,3)}</label>`).join('')}</div></div></div></div>
   <div class="card"><div class="card-h"><h3>📧 Avisos por mail</h3>${g?'<button class="btn btn-ghost" id="hz_test" onclick="pruebaMail()">📧 Enviar mail de prueba</button>':''}</div>
   <p class="hint">Cada solicitud nueva de la app manda un mail a estas direcciones (por ejemplo, el correo de la empresa y el del Jefe de RRHH). Uno por renglón. El envío lo hace la función <b>rrhh</b> de Supabase con la cuenta de correo configurada en sus secretos (ver instructivo).</p>
   <label class="chk"><input type="checkbox" id="hz_nact" ${N.activo!==false?'checked':''} ${g?'':'disabled'}> Enviar avisos por mail</label>
   <textarea class="in" id="hz_mails" rows="3" placeholder="rrhh@empresa.com" ${g?'':'disabled'}>${esc((N.emails||[]).join('\n'))}</textarea></div>`;}
async function saveHorarios(){const L=S.L,H={};L.turnos.forEach((t,i)=>{const a=$('hz_i'+i).value,b=$('hz_f'+i).value;if(a&&b)H[t]={ini:a,fin:b};});
  const bad=L.turnos.find((t,i)=>!!$('hz_i'+i).value!==!!$('hz_f'+i).value);if(bad)return banner('Completá ingreso y salida del turno '+bad+' (o dejá los dos vacíos)','warn');
  const dias=[...document.querySelectorAll('.hz_d:checked')].map(c=>+c.value);if(!dias.length)return banner('Marcá al menos un día laborable','warn');
  const mails=[...new Set($('hz_mails').value.split(/[\n,;]+/).map(x=>x.trim().toLowerCase()).filter(Boolean))];const malo=mails.find(m=>!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(m));if(malo)return banner('Mail inválido: '+malo,'warn');
  const b=$('hz_ok');b.disabled=true;try{await saveCfgListas({horarios:H,tolerancia:Math.min(60,Math.max(0,+$('hz_tol').value||0)),diasLab:dias,notif:{activo:$('hz_nact').checked,emails:mails}});banner('Horarios y avisos guardados ✓');viewConfig();}catch(e){banner('Error: '+errMsg(e),'err');b.disabled=false;}}
async function pruebaMail(){const b=$('hz_test');b.disabled=true;b.textContent='⏳ Enviando…';try{const r=await fn({action:'prueba'});banner('Mail de prueba enviado a '+(r.destinatarios||[]).join(', ')+' ✓');}catch(e){banner(e.message==='FN_NO'?'Falta publicar la función rrhh en Supabase (ver instructivo)':e.message,'err');}b.disabled=false;b.textContent='📧 Enviar mail de prueba';}
async function viewAppCfg(){const link=appURL(),con=S.emps.filter(appActiva).length,act=S.emps.filter(e=>e.estado!=='baja').length;
  $('cfgBody').innerHTML=`<div class="card"><div class="card-h"><h3>📱 App del empleado</h3><span class="tag t-nav">${con} de ${act} con la app activa</span></div>
   <div style="display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap"><div id="appQr" style="background:#fff;padding:8px;border:1px solid var(--line);border-radius:10px"></div>
   <div style="flex:1;min-width:240px"><p class="hint" style="margin-top:0">Es una app web que se instala sin Play Store: el empleado abre el link, entra con su <b>DNI</b> y su <b>PIN</b>, y toca <b>"Agregar a pantalla de inicio"</b>. Desde ahí ficha, pide licencias y permisos, sube certificados y ve sus datos.</p>
    <div class="urlbox small">${esc(link)}</div><div class="seg" style="margin-top:10px"><button class="btn btn-ghost btn-sm" onclick="copiar('${esc(link)}')">📋 Copiar link</button><button class="btn btn-ghost btn-sm" onclick="printCartelApp()">🖨️ Imprimir cartel</button></div>
    <p class="hint" style="margin-top:12px">El PIN de cada empleado se genera desde su ficha: <b>📱 App y PIN</b>.</p></div></div></div>`;
  try{await qrInto($('appQr'),link,170);}catch(e){}}
async function printCartelApp(){cartel('Descargá la app de RRHH',await qrDataURL(appURL(),600),esc((S.empresa||{}).razon_social||''),'Escaneá con la cámara del celular, entrá con tu <b>DNI</b> y tu <b>PIN</b><br>y tocá <b>Agregar a pantalla de inicio</b>.<br>Fichá, pedí licencias y permisos, y subí tus certificados desde el celular.<br>¿No tenés PIN? Pedíselo a RRHH.');}

// ══════════════ INICIO ══════════════
function lock(msg,extra){$('splash').innerHTML=`<div style="font-size:34px">🔒</div><div style="font-size:17px;font-weight:800;max-width:520px">${msg}</div>${extra?`<div style="font-size:13px;color:rgba(255,255,255,.75);max-width:520px;line-height:1.5">${extra}</div>`:''}<a href="/portal.html" style="color:var(--gold);margin-top:8px">← Volver al portal CONTROL MAX</a>`;}
async function init(){
  $('buildLbl').textContent=BUILD;
  const {data:{session}}=await sb.auth.getSession();
  if(!session||!session.user){location.href='/portal.html';return;}
  const {data:perfil,error:pe}=await sb.from('perfiles').select('nombre,rol,empresa_id,activo').eq('id',session.user.id).single();
  if(pe||!perfil||perfil.activo===false){location.href='/portal.html';return;}
  S.uid=session.user.id;S.empresaId=perfil.empresa_id;S.rol=(perfil.rol||'').toLowerCase();S.nombre=perfil.nombre||session.user.email;
  const {data:em}=await sb.from('empresas').select('*').eq('id',S.empresaId).single();S.empresa=em||{};
  // plan y permisos de módulo (Configuración MAX)
  const mods=S.empresa.modulos;if(mods&&typeof mods==='object'&&mods.rrhh===false)return lock('CONTROL RRHH no está activo en el plan de tu empresa',esAdmin()?'Activalo en <b>Configuración → Plan y módulos</b>.':'');
  const pm=S.empresa.permisos_max&&S.empresa.permisos_max.modulos;
  const sinRol=!esAdmin()&&pm&&Array.isArray(pm[S.rol])&&!pm[S.rol].includes('rrhh')&&!(S.rol==='rrhh'&&!(S.rol in pm));
  // acceso por usuario (los legajos tienen datos personales)
  const r=await sb.rpc('rrhh_puede',{p_nivel:'gestion'});
  if(r.error){if(/rrhh_puede|PGRST202|does not exist|Could not find/i.test(r.error.message||''))return lock('CONTROL RRHH todavía no está instalado en la base',esAdmin()?'Corré <b>rrhh_etapa1_setup.sql</b> en Supabase → SQL Editor y recargá esta página.':'Avisale al administrador.');throw r.error;}
  // si el rol no tiene RRHH, solo puede entrar el usuario de la tablet (acceso "Tablet")
  if(sinRol){const rk=await sb.rpc('rrhh_puede',{p_nivel:'kiosco'});if(rk.error||!rk.data)return lock('Tu rol no tiene acceso a CONTROL RRHH');S.nivel='kiosco';}
  else if(esJefe())S.nivel='admin';else if(r.data)S.nivel='gestion';
  else{const r2=await sb.rpc('rrhh_puede',{p_nivel:'consulta'});if(r2.error)throw r2.error;
    if(r2.data)S.nivel='consulta';
    else{const r3=await sb.rpc('rrhh_puede',{p_nivel:'kiosco'});if(!r3.error&&r3.data)S.nivel='kiosco';
      else return lock('Tu usuario no tiene acceso a CONTROL RRHH','Los legajos tienen datos personales: el administrador o el Jefe de RRHH tienen que habilitarte en <b>CONTROL RRHH → Configuración RRHH → Accesos</b>.');}}
  if(S.nivel==='kiosco'){S.L=mergeL({});$('empName').textContent=S.empresa.razon_social||'';$('whoName').textContent=S.nombre;$('whoRole').textContent='Tablet de fichaje';$('splash').style.display='none';$('app').style.display='block';return go('kiosco');}
  await loadAll();
  $('empName').textContent=S.empresa.razon_social||'';$('whoName').textContent=S.nombre;$('whoRole').textContent=(ROL_LABEL[S.rol]||S.rol)+' · RRHH '+({admin:'total',gestion:'gestión',consulta:'consulta'}[S.nivel]);if(S.e2ok===false&&esJefe())setTimeout(()=>banner('Falta correr rrhh_etapa2_setup.sql para Asistencia y Solicitudes','warn'),600);
  $('splash').style.display='none';$('app').style.display='block';
  const h=(location.hash||'').slice(1);const [hv,hid]=h.split('=');
  if(hv==='ficha'&&hid&&emp(hid))return go('ficha',hid);
  go(META[hv]||FUT[hv]?hv:'panel');
}
document.addEventListener('visibilitychange',async()=>{if(document.hidden||!S.empresaId||$('modalBg').classList.contains('show')||S.nivel==='kiosco'||cur==='kiosco')return;try{await loadAll();buildNav();if(cur!=='config')go(cur,S.fichaId);}catch(e){}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&$('modalBg').classList.contains('show'))closeModal();});
init().catch(e=>{console.error(e);$('splash').innerHTML='<div style="padding:20px">No se pudo iniciar CONTROL RRHH: '+esc(errMsg(e))+'</div><a href="/portal.html" style="color:var(--gold)">← Volver al portal</a>';});
</script>
<script src="/cmax-top.js"></script>
