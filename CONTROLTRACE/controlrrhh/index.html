<style>
:root{--navy:#111D35;--navy2:#1B2A4A;--gold:#C9A84C;--gold-d:#A9842F;--cream:#F5F2EA;--ink:#1C2536;--muted:#6B7689;--line:#E7E2D6;--sage:#4F7D6A;--sage-bg:#E9F1EC;--clay:#B5654A;--clay-bg:#F6EBE6;--amber:#86571A;--amber-bg:#FAF3E2;--steel:#3D5A80;
  font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink)}
button,input,select,textarea{font-family:inherit}
/* LAYOUT (mismo menú lateral que los demás módulos) */
#app{display:none}
.layout{display:flex;min-height:100vh}
.side{width:230px;background:var(--navy);color:#cdd6e4;padding:18px 0;flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:11px;padding:0 20px 16px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:10px}
.brand svg{width:34px;height:34px;flex-shrink:0}
.brand h1{font-size:15px;margin:0;font-weight:800;color:#fff;letter-spacing:.3px}
.brand .sub{font-size:11px;color:var(--gold);margin-top:2px}
.gl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#64748b;padding:14px 20px 6px}
.side .nb{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:#cdd6e4;padding:10px 20px;font-size:14px;cursor:pointer;text-align:left}
.side .nb:hover{background:rgba(255,255,255,.06);color:#fff}
.side .nb.on{background:rgba(201,168,76,.16);color:#fff;border-right:3px solid var(--gold)}
.side .nb.fut{color:#7d8aa0;padding-top:7px;padding-bottom:7px;font-size:13px}
.side .nb .ico{width:20px;text-align:center}
.side .nb .cnt{margin-left:auto;background:var(--gold);color:var(--navy);font-size:10px;font-weight:800;padding:1px 7px;border-radius:9px}
.side .nb .et{margin-left:auto;border:1px solid #3a4a66;color:#8a96aa;font-size:9px;font-weight:700;padding:0 6px;border-radius:9px}
.side .foot{margin-top:auto;padding:14px 20px;border-top:1px solid rgba(255,255,255,.08);font-size:12px}
.side .foot .who{color:#fff;font-weight:600}.side .foot .role{color:#9fb0c8;font-size:11px}
.side .foot .bld{font-size:9px;color:#8a96aa;text-align:center;margin-top:10px;line-height:1.5}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{background:#fff;border-bottom:1px solid var(--line);padding:14px 26px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.top .crumb{font-size:11px;color:var(--steel);letter-spacing:.12em;text-transform:uppercase}
.top h2{margin:2px 0 0;font-size:20px;color:var(--navy)}
#mnav{display:none;background:none;border:0;font-size:22px;color:var(--navy);cursor:pointer;padding:0 6px 0 0}
.view{padding:22px 26px;max-width:1180px;width:100%}
.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:18px;margin-bottom:16px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.card-h h3{margin:0;font-size:16px;color:var(--navy)}
.hint{color:var(--muted);font-size:13px;margin:0 0 12px;line-height:1.5}
label.lb{display:block;font-size:12px;font-weight:600;margin:10px 0 5px}
.in{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fcfbf8;font-size:14px;color:var(--ink)}
.in:focus{outline:none;border-color:var(--steel);box-shadow:0 0 0 3px rgba(61,90,128,.12)}

.btn{border:0;border-radius:9px;padding:10px 15px;font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn-gold{background:var(--gold);color:#3a2c08}.btn-gold:hover{background:var(--gold-d);color:#fff}
.btn-ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}.btn-ghost:hover{background:#f6f3ec}
.btn-navy{background:var(--navy);color:#fff}
.btn-danger{background:#fff;color:var(--clay);border:1px solid #e7c3b6}
.btn-sm{padding:6px 10px;font-size:12px}
.btn[disabled]{opacity:.4;cursor:default}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap}
.t-ok{background:var(--sage-bg);color:var(--sage)}.t-out{background:var(--clay-bg);color:var(--clay)}.t-warn{background:var(--amber-bg);color:var(--amber)}.t-nav{background:#e8eef5;color:var(--navy)}.t-mut{background:#efece4;color:var(--muted)}.t-gold{background:#fbf3dd;color:#8a6410}
.seg{display:inline-flex;gap:6px;flex-wrap:wrap}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
.filters .f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}

.note{background:var(--amber-bg);border:1px solid #f0d9b0;color:var(--amber);padding:12px 14px;border-radius:10px;font-size:13px;margin-bottom:14px;line-height:1.5}
.empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:14px}
.muted{color:var(--muted)}.small{font-size:12px}
/* TABLAS (8 por página, selector y barra de acciones) */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid #f0ece2;vertical-align:middle}
.cod{color:var(--muted);font-size:12px}
.gx-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:#f7f3ea;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:0 0 10px}
.gx-pager{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--navy)}
.gx-n{font-size:12px;color:var(--muted)}
.gx-acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.gx-who{font-weight:700;color:var(--navy);margin-right:4px}

td.gx-sel{width:34px;text-align:center}td.gx-sel input{width:18px;height:18px;cursor:pointer;accent-color:#b8862b}
tr.gx-r{cursor:pointer}tr.gx-r:hover td{background:#fbf9f4}tr.gx-on td{background:#fdf3d9!important}
.tscroll{overflow-x:auto}
/* PANEL */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px 16px;cursor:default}
.kpi.ck{cursor:pointer}.kpi.ck:hover{box-shadow:0 6px 18px rgba(17,29,53,.08)}
.kpi small{display:block;color:var(--muted);font-size:12px}
.kpi b{display:block;font-size:28px;color:var(--navy);margin-top:4px;line-height:1.1}
.kpi b.r{color:var(--clay)}.kpi b.a{color:var(--amber)}.kpi b.g{color:#8a6410}
.kpi span{font-size:11px;color:var(--muted)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid #f0ece2;font-size:13px;cursor:pointer}
.li:last-child{border-bottom:0}.li:hover{background:#fbf9f4}
.li .who{font-weight:600;color:var(--ink)}
.bars .br{display:grid;grid-template-columns:150px 1fr 40px;gap:10px;align-items:center;font-size:13px;margin:6px 0}
.bars .tr{background:#f1ede4;border-radius:6px;height:12px;overflow:hidden}.bars .tr i{display:block;height:100%;background:var(--navy);border-radius:6px}
.bars .n{text-align:right;font-weight:700;color:var(--navy)}

.av{width:62px;height:62px;border-radius:50%;background:var(--navy);color:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;flex-shrink:0}
.fh .nm{font-size:22px;font-weight:800;color:var(--navy);line-height:1.15}
.fh .sb{color:var(--muted);font-size:13px;margin-top:3px}
.fh .tg{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:9px;padding:8px 13px;font-size:13px;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.dl{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 20px}
.dl .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.dl .v{font-size:14px;font-weight:600;margin-top:2px;word-break:break-word}
.dl .v.e{color:#b9b2a3;font-weight:400;font-style:italic}
.sect{font-size:12px;font-weight:800;color:var(--steel);text-transform:uppercase;letter-spacing:.1em;margin:18px 0 10px;border-bottom:1px solid var(--line);padding-bottom:6px}
.sect:first-child{margin-top:0}
.tl{border-left:3px solid var(--line);margin-left:6px;padding-left:16px}
.tl .ev{position:relative;padding:0 0 16px}
.tl .ev:before{content:"";position:absolute;left:-23px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--gold);border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.tl .ev.s:before{background:var(--clay)}.tl .ev.b:before{background:var(--muted)}.tl .ev.r:before{background:var(--sage)}
.tl .ev .h{font-size:12px;color:var(--muted)}.tl .ev .t{font-weight:700;color:var(--navy);margin:2px 0}.tl .ev .d{font-size:13px;line-height:1.45}
/* FORMULARIOS */
.fg{display:grid;grid-template-columns:repeat(3,1fr);gap:0 12px}
.fg>div{min-width:0}.fg .in{min-width:0;max-width:100%}
.fg .full{grid-column:1/-1}
.fg .two{grid-column:span 2}
/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(17,29,53,.5);display:none;align-items:center;justify-content:center;z-index:95;padding:16px}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:13px;padding:22px;max-width:540px;width:100%;max-height:92vh;overflow:auto}
.modal.wide{max-width:860px}
.modal h3{margin:0 0 6px;color:var(--navy)}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;padding:6px 0;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:#b8862b}
.lst{max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:4px 10px}
/* BANNER / SPLASH */
.banner{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 20px;border-radius:10px;font-size:13px;box-shadow:0 8px 30px rgba(0,0,0,.25);z-index:99;opacity:0;transition:opacity .2s;pointer-events:none;max-width:92vw}
.banner.show{opacity:1}.banner.warn{background:var(--gold-d)}.banner.err{background:var(--clay)}
#splash{position:fixed;inset:0;background:var(--navy);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;gap:14px;color:#fff;text-align:center;padding:20px}
#splash .lg{font-size:26px;font-weight:900;color:var(--gold);letter-spacing:2px}
#splash .lg span{color:#fff}
.spin{width:38px;height:38px;border:3px solid rgba(201,168,76,.3);border-top-color:var(--gold);border-radius:50%;animation:s .8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.fut{max-width:640px}
.fut .big{font-size:44px}
@media(max-width:860px){.g2{grid-template-columns:1fr}.dl{grid-template-columns:1fr 1fr}.fg{grid-template-columns:1fr 1fr}}
@media(max-width:760px){
  .layout{flex-direction:column}
  .side{position:fixed;left:0;top:0;bottom:0;z-index:80;transform:translateX(-100%);transition:transform .2s;height:100vh}
  body.nav-open .side{transform:none;box-shadow:0 0 40px rgba(0,0,0,.4)}
  #mnav{display:block}
  .top{padding:58px 14px 12px}.view{padding:14px}
  .dl{grid-template-columns:1fr}.fg{grid-template-columns:1fr}.fg .two{grid-column:auto}
  .bars .br{grid-template-columns:100px 1fr 34px}
}
</style>
</head>

const $=id=>document.getElementById(id);
const esc=s=>(s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const nf=(n,d=0)=>(+n||0).toLocaleString('es-AR',{minimumFractionDigits:d,maximumFractionDigits:d});
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function addDays(f,n){if(!f)return '';const d=new Date(String(f).slice(0,10)+'T00:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
const fmtD=f=>f?String(f).slice(0,10).split('-').reverse().join('/'):'—';
const d10=f=>f?String(f).slice(0,10):'';
function diasHasta(f){if(!f)return null;return Math.round((new Date(d10(f)+'T00:00:00')-new Date(today()+'T00:00:00'))/864e5);}
function fmtTs(ts){if(!ts)return '—';const d=new Date(ts);if(isNaN(d))return '—';return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function banner(t,k){const b=$('banner');b.textContent=t;b.className='banner show'+(k?' '+k:'');clearTimeout(b._t);b._t=setTimeout(()=>b.className='banner',k==='err'?6500:3000);}
function modal(html,wide){const m=$('modal');m.className='modal'+(wide?' wide':'');m.innerHTML=html;$('modalBg').classList.add('show');setTimeout(()=>{const f=m.querySelector('input:not([type=hidden]):not([type=checkbox]):not([disabled]):not([readonly]),select:not([disabled]),textarea');if(f)f.focus();},40);}
function closeModal(){$('modalBg').classList.remove('show');}
function errMsg(e){const m=(e&&(e.message||e.details||e.error_description))||String(e||'');
  if(/rrhh_|relation .* does not exist|PGRST205|PGRST202|Could not find the (table|function)/i.test(m)&&!/row-level|duplicate/i.test(m))return 'Falta correr rrhh_etapa1_setup.sql en Supabase → SQL Editor ('+m+')';
  if(/Bucket not found/i.test(m))return 'Falta el bucket de archivos: corré rrhh_etapa1_setup.sql en Supabase ('+m+')';
  if(/row-level security|permission denied/i.test(m))return 'Tu usuario no tiene permiso para esta operación en RRHH ('+m+')';
  if(/rrhh_empleados_dni_uq/.test(m))return 'Ya existe un legajo con ese DNI';
  if(/rrhh_empleados_legajo_uq/.test(m))return 'Ese número de legajo ya existe (otra persona lo cargó recién). Probá de nuevo.';
  if(/rrhh_empleados_oper_uq/.test(m))return 'Ese operario de TRACE ya está vinculado a otro legajo';
  return m;}
function esAdmin(){return ADMINS.includes(S.rol);}

function lsGet(k,d){try{const v=localStorage.getItem(k);return v==null?d:v;}catch(e){return d;}}

function norm(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\s+/g,' ').trim();}
async function sbAll(build){const out=[];for(let from=0;;from+=1000){const {data,error}=await build().range(from,from+999);if(error)throw error;out.push(...(data||[]));if(!data||data.length<1000)break;}return out;}

// ══════════════ GRILLA (8 por página, selector y barra de acciones · igual que los otros módulos) ══════════════
const G={};
function grid(cid,key,cols,rows,acts,dbl){
  const st=G[key]||(G[key]={pag:1,sel:null});st.args=[cid,key,cols,rows,acts,dbl];
  const pags=Math.max(1,Math.ceil(rows.length/PP));st.pag=Math.min(Math.max(1,st.pag),pags);
  if(st.sel&&!rows.some(r=>r._k===st.sel))st.sel=null;
  const sel=rows.find(r=>r._k===st.sel);const A=sel?acts(sel):[];window['_ga_'+key]=A;window['_gd_'+key]=dbl;
  const vis=rows.slice((st.pag-1)*PP,st.pag*PP);
  const bar=`<div class="gx-bar"><div class="gx-pager"><button class="btn btn-ghost btn-sm" ${st.pag<=1?'disabled':''} onclick="gridPag('${key}',-1)">◀</button><b>Pág. ${st.pag} de ${pags}</b><button class="btn btn-ghost btn-sm" ${st.pag>=pags?'disabled':''} onclick="gridPag('${key}',1)">▶</button><span class="gx-n">${rows.length} registro${rows.length===1?'':'s'}</span></div>
   <div class="gx-acts">${sel?`<span class="gx-who">${esc(sel._lbl||'')}</span>`+(A.length?A.map((a,i)=>`<button class="btn btn-sm ${a.cls||'btn-ghost'}" ${a.dis?'disabled':''} onclick="gridDo('${key}',${i})">${a.lbl}</button>`).join(''):'<span class="gx-hint">Sin acciones para este registro</span>'):'<span class="gx-hint">☝️ Seleccioná un registro de la lista'+(dbl?' (doble clic para abrir)':'')+'</span>'}</div></div>`;
  const body=vis.map(r=>`<tr class="gx-r${r._k===st.sel?' gx-on':''}" onclick="gridSel('${key}','${esc(r._k)}')" ondblclick="gridDbl('${key}','${esc(r._k)}')"><td class="gx-sel"><input type="radio" name="gx_${key}" ${r._k===st.sel?'checked':''} aria-label="Seleccionar"></td>${cols.map(c=>`<td class="${c.cls||''}">${c.f(r)}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${cols.length+1}" class="empty">Sin registros</td></tr>`;
  $(cid).innerHTML=bar+`<div class="tscroll"><table><thead><tr><th></th>${cols.map(c=>`<th class="${c.cls||''}">${c.h}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div>`;}
function gridRedraw(key){const st=G[key];if(st&&st.args&&$(st.args[0]))grid(...st.args);}
function gridSel(key,k){G[key].sel=k;gridRedraw(key);}
function gridPag(key,d){G[key].pag+=d;G[key].sel=null;gridRedraw(key);}
function gridDo(key,i){const a=(window['_ga_'+key]||[])[i];if(a&&!a.dis)a.fn();}
function gridDbl(key,k){const f=window['_gd_'+key];if(f)f(k);}

// ══════════════ DATOS ══════════════
function mergeL(l){l=l||{};const o={};Object.keys(DEF_L).forEach(k=>{o[k]=(k in l&&l[k]!=null)?l[k]:JSON.parse(JSON.stringify(DEF_L[k]));});o.avisoDias=Math.max(1,+o.avisoDias||30);return o;}
async function loadCfg(){const {data,error}=await sb.from('rrhh_config').select('*').eq('empresa_id',S.empresaId).maybeSingle();if(error)throw error;S.cfgRow=data||null;S.L=mergeL(data&&data.listas);S.accesos=(data&&data.accesos)||{};}
async function loadEmps(){S.emps=await sbAll(()=>sb.from('rrhh_empleados').select('*').eq('empresa_id',S.empresaId).order('legajo',{ascending:true}));}
async function loadDocs(){S.docs=await sbAll(()=>sb.from('rrhh_documentos').select('*').eq('empresa_id',S.empresaId).order('created_at',{ascending:false}));}
async function loadHist(){S.hist=await sbAll(()=>sb.from('rrhh_historial').select('*').eq('empresa_id',S.empresaId).order('created_at',{ascending:false}));}
async function loadOps(){const {data,error}=await sb.from('operarios').select('id,nombre,area,activo').eq('empresa_id',S.empresaId).order('nombre');S.opsOk=!error;S.ops=error?[]:(data||[]);}
async function loadAll(){await loadCfg();await Promise.all([loadEmps(),loadDocs(),loadHist(),loadOps()]);}

// ══════════════ REGLAS DEL LEGAJO ══════════════
const emp=id=>S.emps.find(e=>e.id===id);
function nomE(e){if(!e)return '—';return e.apellido?`${e.apellido}, ${e.nombre}`:(e.nombre||'—');}
function nomCorto(e){return e?[e.nombre,e.apellido].filter(Boolean).join(' '):'—';}
function iniciales(e){const p=[e.nombre,e.apellido].filter(Boolean).join(' ').split(/\s+/).filter(Boolean);return ((p[0]||'?')[0]+((p.length>1?p[p.length-1]:'')[0]||'')).toUpperCase();}
function meses(a,b){const x=new Date(d10(a)+'T00:00:00'),y=new Date(d10(b)+'T00:00:00');let m=(y.getFullYear()-x.getFullYear())*12+(y.getMonth()-x.getMonth());if(y.getDate()<x.getDate())m--;return m;}
function antigM(e){if(!e||!e.fecha_ingreso)return null;const fin=(e.estado==='baja'&&e.fecha_egreso)?e.fecha_egreso:today();const m=meses(e.fecha_ingreso,fin);return m<0?null:m;}
function txtMeses(m){if(m==null)return '';const y=Math.floor(m/12),mm=m%12;if(!y&&!mm)return 'menos de 1 mes';return (y?y+' año'+(y>1?'s':''):'')+(y&&mm?' y ':'')+(mm?mm+' mes'+(mm>1?'es':''):'');}
function edad(e){if(!e||!e.fecha_nacimiento)return null;return Math.floor(meses(e.fecha_nacimiento,today())/12);}
const REQ=[['apellido','Apellido'],['dni','DNI'],['cuil','CUIL'],['fecha_ingreso','Fecha de ingreso'],['sector','Sector'],['puesto','Puesto'],['telefono','Teléfono']];
function faltan(e){return REQ.filter(([k])=>!e[k]).map(r=>r[1]);}
function cuilDig(c){return String(c||'').replace(/\D/g,'');}
function fmtCuil(c){const d=cuilDig(c);return d.length===11?d.slice(0,2)+'-'+d.slice(2,10)+'-'+d.slice(10):String(c||'').trim();}
function cuilOK(c){const d=cuilDig(c);if(d.length!==11)return false;const w=[5,4,3,2,7,6,5,4,3,2];let s=0;for(let i=0;i<10;i++)s+=(+d[i])*w[i];let v=11-(s%11);if(v===11)v=0;if(v===10)v=9;return v===+d[10];}
function nextLegajo(extra){let mx=0;S.emps.forEach(e=>{const m=/(\d+)\s*$/.exec(e.legajo||'');if(m)mx=Math.max(mx,+m[1]);});return 'EMP-'+String(mx+1+(extra||0)).padStart(4,'0');}
function opDe(e){return e&&e.operario_id?S.ops.find(o=>o.id===e.operario_id):null;}
function opsLibres(exceptId){const used=new Set(S.emps.filter(e=>e.operario_id&&e.id!==exceptId).map(e=>e.operario_id));return S.ops.filter(o=>!used.has(o.id));}
function opsSinLegajo(){return opsLibres().filter(o=>o.activo!==false);}
function estadoTag(e){return e.estado==='baja'?`<span class="tag t-mut">Baja${e.fecha_egreso?' '+fmtD(e.fecha_egreso):''}</span>`:'<span class="tag t-ok">Activo</span>';}
// documentos
function aviso(){return (S.L&&S.L.avisoDias)||30;}
function tipoVence(t){const x=(S.L.tiposDoc||[]).find(o=>o.n===t);return !!(x&&x.v);}
function reemplazado(d){return S.docs.some(o=>o.id!==d.id&&o.estado!=='anulado'&&o.empleado_id===d.empleado_id&&o.tipo===d.tipo&&o.vence&&d.vence&&d10(o.vence)>d10(d.vence));}
function docEst(d){if(d.estado==='anulado')return 'anulado';if(!d.vence)return 'sin';if(reemplazado(d))return 'renovado';const n=diasHasta(d.vence);if(n<0)return 'vencido';if(n<=aviso())return 'porvencer';return 'vigente';}
function docTag(d){const e=docEst(d),n=diasHasta(d.vence);return {anulado:'<span class="tag t-mut">Anulado</span>',sin:'<span class="tag t-nav">Sin vencimiento</span>',renovado:'<span class="tag t-mut">Renovado</span>',vencido:`<span class="tag t-out">Vencido hace ${-n} d</span>`,porvencer:`<span class="tag t-warn">Vence en ${n} d</span>`,vigente:'<span class="tag t-ok">Vigente</span>'}[e];}
function docsAlerta(){return S.docs.filter(d=>{const e=emp(d.empleado_id);return e&&e.estado!=='baja'&&['vencido','porvencer'].includes(docEst(d));}).sort((a,b)=>d10(a.vence).localeCompare(d10(b.vence)));}
function docsDe(id){return S.docs.filter(d=>d.empleado_id===id);}
function alertasDe(id){return S.docs.filter(d=>d.empleado_id===id&&['vencido','porvencer'].includes(docEst(d)));}

// ══════════════ PIN Y AUDITORÍA (igual que TRACE / PLUS) ══════════════
function pinAuth(v){v=(v||'').trim();if(!v)return null;const master=(((S.empresa&&S.empresa.pin)||'1234')+'').trim();if(v===master)return {nombre:(S.empresa&&S.empresa.pin_nombre)||'Supervisor'};const list=(S.empresa&&S.empresa.autorizadores)||[];const f=list.find(a=>a&&a.activo!==false&&((a.pin||'')+'').trim()===v);return f?{nombre:f.nombre||'Autorizador'}:null;}
async function logNovedad(tipo,ref,detalle,auth){try{const {error}=await sb.from('novedades').insert({empresa_id:S.empresaId,fecha:today(),tipo:tipo,referencia:ref||null,detalle:(detalle||'').slice(0,400)||null,autorizado_por:(auth&&auth.nombre)||null,ejecutado_por:S.nombre||null});if(error)console.warn('[auditoría] no se pudo registrar',error.message);}catch(e){console.warn('[auditoría]',e);}}
async function addHist(empId,tipo,detalle,ant,nue,auth,fecha){const {error}=await sb.from('rrhh_historial').insert({empresa_id:S.empresaId,empleado_id:empId,fecha:fecha||today(),tipo,detalle:detalle||null,valor_anterior:ant||null,valor_nuevo:nue||null,autorizado_por:(auth&&auth.nombre)||null,registrado_por:S.nombre||null});if(error)throw error;}
// o: {titulo, html, btn, tipo, ref, detalle(), validar(), onOK(auth)}
function pinModal(o){
  modal(`<h3>🔒 ${o.titulo}</h3>${o.html||''}<label class="lb">PIN de supervisor *</label><input class="in" type="password" inputmode="numeric" id="pin_v" autocomplete="off" placeholder="PIN o QR de autorización"><p class="hint" style="margin:6px 0 0">Queda registrado en CONTROL TOTAL → Auditoría.</p><div class="row"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-gold" id="pin_ok">${o.btn||'✅ Autorizar'}</button></div>`,o.wide);
  const go_=async()=>{const err=o.validar?o.validar():null;if(err)return banner(err,'warn');const a=pinAuth($('pin_v').value);if(!a){banner('PIN incorrecto','err');$('pin_v').select();return;}
    const b=$('pin_ok');b.disabled=true;b.textContent='⏳ Guardando…';
    try{await o.onOK(a);await logNovedad(o.tipo,o.ref,typeof o.detalle==='function'?o.detalle():o.detalle,a);closeModal();}catch(e){banner('Error: '+errMsg(e),'err');b.disabled=false;b.textContent=o.btn||'✅ Autorizar';}};
  $('pin_ok').onclick=go_;$('pin_v').addEventListener('keydown',ev=>{if(ev.key==='Enter'){ev.preventDefault();go_();}});
}

function proximos(campo,dias,minAnios){const t=today(),out=[];S.emps.filter(e=>e.estado!=='baja'&&e[campo]).forEach(e=>{const f=d10(e[campo]);const y=+t.slice(0,4);for(const yy of [y,y+1]){let md=f.slice(5);if(md==='02-29'&&!((yy%4===0&&yy%100!==0)||yy%400===0))md='02-28';const c=yy+'-'+md;const n=diasHasta(c);if(n>=0&&n<=dias){const an=yy-(+f.slice(0,4));if(an>=(minAnios||0))out.push({e,f:c,n,an});break;}}});return out.sort((a,b)=>a.n-b.n);}

    <div class="kpi ck" onclick="F.estado='incompletos';go('legajos')"><small>Legajos incompletos</small><b class="${inc.length?'a':''}">${nf(inc.length)}</b><span>les falta algún dato clave</span></div>
   </div>
   <div class="g2">
    <div class="card"><div class="card-h"><h3>⏰ Vencimientos</h3><button class="btn btn-ghost btn-sm" onclick="F.dEst='alerta';go('docs')">Ver todos</button></div>

function filtLegajos(){const q=norm(F.q),qd=cuilDig(F.q);return S.emps.filter(e=>{

  if(F.sector&&e.sector!==F.sector)return false;if(F.mod&&e.modalidad!==F.mod)return false;
  if(q&&!(norm(nomE(e)).includes(q)||norm(nomCorto(e)).includes(q)||norm(e.legajo).includes(q)||(qd.length>=3&&(cuilDig(e.dni).includes(qd)||cuilDig(e.cuil).includes(qd)))))return false;return true;})

async function saveEmp(id){

    emergencia_nombre:v('e_emn')||null,emergencia_vinculo:v('e_emv')||null,emergencia_tel:v('e_emt')||null,fecha_ingreso:v('e_ing')||null,observaciones:v('e_obs')||null};

  if(o.cuil&&o.dni&&!cuilDig(o.cuil).slice(2,10).endsWith(o.dni))return banner('El DNI no coincide con el del CUIL','warn');
  if(o.dni&&S.emps.some(x=>x.id!==id&&x.dni===o.dni))return banner('Ya existe un legajo con ese DNI: '+nomE(S.emps.find(x=>x.id!==id&&x.dni===o.dni)),'warn');

  const opv=v('e_op');const b=$('e_ok');b.disabled=true;b.textContent='⏳ Guardando…';

      if(camb.length)await addHist(e.id,'edicion','Se actualizaron: '+camb.map(k=>({apellido:'apellido',nombre:'nombre',dni:'DNI',cuil:'CUIL',fecha_nacimiento:'fecha de nacimiento',telefono:'teléfono',email:'email',domicilio:'domicilio',localidad:'localidad',emergencia_nombre:'contacto de emergencia',emergencia_vinculo:'vínculo de emergencia',emergencia_tel:'teléfono de emergencia',fecha_ingreso:'fecha de ingreso',observaciones:'observaciones'})[k]||k).join(', '));}
    else{let leg=nextLegajo(),error,data;for(let i=0;i<3;i++){({data,error}=await sb.from('rrhh_empleados').insert(Object.assign({empresa_id:S.empresaId,legajo:leg,estado:'activo',created_by:S.nombre},o)).select().single());if(!error||!/legajo_uq/.test(error.message||''))break;await loadEmps();leg=nextLegajo();}
      if(error)throw error;row=data;await addHist(row.id,'alta',`Ingreso como ${o.puesto} en ${o.sector}`+(o.modalidad?' · '+o.modalidad:''),null,{sector:o.sector,puesto:o.puesto,categoria:o.categoria,convenio:o.convenio,modalidad:o.modalidad,turno:o.turno,jornada:o.jornada},null,o.fecha_ingreso);}

      else{const {error:el}=await sb.from('rrhh_empleados').update({operario_id:opr.id}).eq('id',row.id);if(el)throw el;await addHist(row.id,'vinculo_operario','Se creó el operario "'+nomOp+'" en CONTROL TRACE y se vinculó al legajo');}}
    else if(opv!==prevOp){const {error:el}=await sb.from('rrhh_empleados').update({operario_id:opv||null}).eq('id',row.id);if(el)throw el;const op=S.ops.find(x=>x.id===opv);await addHist(row.id,'vinculo_operario',opv?'Vinculado al operario de TRACE "'+(op?op.nombre:'')+'"':'Se quitó el vínculo con el operario de TRACE');}
    closeModal();await Promise.all([loadEmps(),loadHist(),loadOps()]);banner(e?'Legajo actualizado ✓':'Legajo '+row.legajo+' creado ✓');go('ficha',row.id);
  }catch(err){banner('Error: '+errMsg(err),'err');b.disabled=false;b.textContent='💾 '+(e?'Guardar cambios':'Crear legajo');}
}

function importarOps(){const L=opsSinLegajo();if(!L.length)return banner('Todos los operarios activos ya tienen legajo ✓');
  const porNombre={};S.emps.forEach(e=>{if(!e.operario_id){porNombre[norm(nomCorto(e))]=e;porNombre[norm(nomE(e).replace(',',''))]=e;}});

  modal(`<h3>⤵️ Importar operarios de TRACE</h3><p class="hint">Se crea un legajo por cada operario marcado, con el nombre del padrón y el sector según su área. Después completás DNI, CUIL, ingreso y el resto desde cada ficha. Si ya hay un legajo con el mismo nombre, se <b>vincula</b> en vez de crear otro.</p>

}
async function doImportar(){const sel=[...document.querySelectorAll('.impc:checked')].map(c=>window._imp[+c.dataset.i]);if(!sel.length)return banner('No marcaste ningún operario','warn');
  const b=$('imp_ok');b.disabled=true;b.textContent='⏳ Importando…';let creados=0,vinc=0;
  try{
    const nuevos=sel.filter(x=>!x.match),links=sel.filter(x=>x.match);
    for(const x of links){const {error}=await sb.from('rrhh_empleados').update({operario_id:x.o.id}).eq('id',x.match.id);if(error)throw error;await addHist(x.match.id,'vinculo_operario','Vinculado al operario de TRACE "'+x.o.nombre+'"');vinc++;}

      const {data,error}=await sb.from('rrhh_empleados').insert(rows).select();if(error)throw error;creados=data.length;
      const {error:eh}=await sb.from('rrhh_historial').insert(data.map(r=>({empresa_id:S.empresaId,empleado_id:r.id,fecha:today(),tipo:'alta',detalle:'Legajo creado desde el padrón de operarios de TRACE',registrado_por:S.nombre})));if(eh)console.warn(eh);}
    closeModal();await Promise.all([loadEmps(),loadHist()]);banner(`Listo: ${creados} legajo(s) nuevo(s)`+(vinc?` y ${vinc} vinculado(s)`:'')+'. Completá apellido, DNI e ingreso en cada ficha.');F.estado='incompletos';go('legajos');

async function saveDoc(){const empId=$('d_emp').value,tipo=$('d_tipo').value,f=$('d_file').files[0],vto=$('d_vto').value,emi=$('d_emi').value;
  if(!empId)return banner('Elegí el empleado','warn');if(!tipo)return banner('Elegí el tipo de documento','warn');
  if(tipoVence(tipo)&&!vto)return banner('Este tipo de documento lleva fecha de vencimiento','warn');
  if(vto&&emi&&vto<emi)return banner('El vencimiento no puede ser anterior a la emisión','warn');

  if(f&&!/^image\/|application\/pdf/.test(f.type||'')&&!/\.(pdf|jpe?g|png|heic|webp)$/i.test(f.name))return banner('Subí una foto o un PDF','warn');
  const b=$('d_ok');b.disabled=true;b.textContent='⏳ Subiendo…';let path=null;
  try{
    if(f){const safe=f.name.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\w.\-]+/g,'_').slice(-80);path=`${S.empresaId}/${empId}/${Date.now()}_${safe}`;

    const {error}=await sb.from('rrhh_documentos').insert({empresa_id:S.empresaId,empleado_id:empId,tipo,descripcion:$('d_desc').value.trim()||null,archivo_path:path,archivo_nombre:f?f.name:null,mime:f?f.type||null:null,tamano:f?f.size:null,fecha_emision:emi||null,vence:vto||null,estado:'vigente',subido_por:S.nombre});if(error)throw error;
    await addHist(empId,'documento','Se cargó: '+tipo+(vto?' (vence '+fmtD(vto)+')':'')+(f?'':' · sin archivo'));
    closeModal();await Promise.all([loadDocs(),loadHist()]);banner('Documento guardado ✓');buildNav();render();
  }catch(e){banner('Error: '+errMsg(e),'err');b.disabled=false;b.textContent='💾 Guardar';}

    {h:'Archivo',f:r=>r.archivo_path?`📄 <span class="small">${esc((r.archivo_nombre||'archivo').slice(0,28))}</span>`:'<span class="small muted">sin archivo</span>'},{h:'Cargó',f:r=>`<span class="small">${esc(r.subido_por||'')}<br><span class="muted">${fmtTs(r.created_at)}</span></span>`});
  grid(cid,key,cols,rows,docActs,k=>{const d=S.docs.find(x=>x.id===k);if(d&&d.archivo_path)verDoc(k);});
}

function filtDocs(){const q=norm(F.dQ);return S.docs.filter(d=>{const e=emp(d.empleado_id);if(!e)return false;const st=docEst(d);
  if(F.dEst==='alerta'&&!(e.estado!=='baja'&&['vencido','porvencer'].includes(st)))return false;if(F.dEst==='vigentes'&&st==='anulado')return false;if(F.dEst==='anulados'&&st!=='anulado')return false;if(F.dEst==='sinarch'&&(d.archivo_path||st==='anulado'))return false;
  if(F.dTipo&&d.tipo!==F.dTipo)return false;if(q&&!(norm(nomE(e)).includes(q)||norm(nomCorto(e)).includes(q)||norm(e.legajo).includes(q)))return false;return true;})
  .sort((a,b)=>F.dEst==='alerta'?d10(a.vence).localeCompare(d10(b.vence)):String(b.created_at).localeCompare(String(a.created_at)));}

function tdDraw(){const g=gestiona();$('tdList').innerHTML=`<table><thead><tr><th>Tipo</th><th style="width:110px">Vence</th><th style="width:60px"></th></tr></thead><tbody>${window._td.map((t,i)=>`<tr><td><input class="in" value="${esc(t.n)}" ${g?'':'disabled'} oninput="window._td[${i}].n=this.value"></td><td><label class="chk"><input type="checkbox" ${t.v?'checked':''} ${g?'':'disabled'} onchange="window._td[${i}].v=this.checked"> vence</label></td><td>${g?`<button class="btn btn-ghost btn-sm" title="Quitar" onclick="window._td.splice(${i},1);tdDraw()">✕</button>`:''}</td></tr>`).join('')}</tbody></table>`;}

async function saveListas(){const l={};LISTAS.forEach(([k])=>{l[k]=[...new Set($('l_'+k).value.split('\n').map(x=>x.trim()).filter(Boolean))];});
  if(!l.sectores.length||!l.puestos.length)return banner('Sectores y puestos no pueden quedar vacíos','warn');
  const td=[];const seen=new Set();window._td.forEach(t=>{const n=(t.n||'').trim();if(n&&!seen.has(n)){seen.add(n);td.push({n,v:!!t.v});}});if(!td.length)return banner('Dejá al menos un tipo de documento','warn');
  l.tiposDoc=td;l.avisoDias=Math.min(180,Math.max(1,+$('l_aviso').value||30));
  const b=$('cfg_ok');b.disabled=true;b.textContent='⏳ Guardando…';
  try{const {error}=S.cfgRow?await sb.from('rrhh_config').update({listas:l}).eq('empresa_id',S.empresaId):await sb.from('rrhh_config').insert({empresa_id:S.empresaId,listas:l});if(error)throw error;await loadCfg();buildNav();banner('Listas guardadas ✓');viewConfig();}
  catch(e){banner('Error: '+errMsg(e),'err');b.disabled=false;b.textContent='💾 Guardar listas';}
}

   <table><thead><tr><th>Usuario</th><th>Rol</th><th style="width:220px">Acceso a RRHH</th></tr></thead><tbody>${us.map((u,i)=>{const adm=ADMINS.includes((u.rol||'').toLowerCase());const v=A[u.id]||'';
     return `<tr><td><b>${esc(u.nombre||'—')}</b></td><td>${esc(ROL_LABEL[(u.rol||'').toLowerCase()]||u.rol||'')}</td><td>${adm?'<span class="tag t-ok">Siempre (administrador)</span>':`<select class="in acc" data-i="${i}">${[['','Sin acceso'],['consulta','Consulta'],['gestion','Gestión']].map(([k,l])=>`<option value="${k}"${v===k?' selected':''}>${l}</option>`).join('')}</select>`}</td></tr>`;}).join('')||'<tr><td colspan="3" class="empty">Sin usuarios</td></tr>'}</tbody></table></div>`;

let _xlsxP=null;

async function toXlsx(nombre,hoja,aoa){try{await loadXLSX();const ws=XLSX.utils.aoa_to_sheet(aoa);ws['!cols']=aoa[0].map((_,c)=>({wch:Math.min(45,Math.max(8,...aoa.map(r=>String(r[c]==null?'':r[c]).length+2)))}));ws['!autofilter']={ref:XLSX.utils.encode_range({s:{r:0,c:0},e:{r:aoa.length-1,c:aoa[0].length-1}})};const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,hoja);XLSX.writeFile(wb,nombre+'_'+today()+'.xlsx');}catch(e){banner('Error: '+errMsg(e),'err');}}

function exportDocs(){const L={anulado:'Anulado',sin:'Sin vencimiento',renovado:'Renovado',vencido:'Vencido',porvencer:'Por vencer',vigente:'Vigente'};toXlsx('Documentos_RRHH','Documentos',[['Legajo','Empleado','Sector','Documento','Descripción','Emisión','Vence','Días','Estado','Archivo','Cargó','Fecha de carga'],
  ...filtDocs().map(d=>{const e=emp(d.empleado_id)||{};const n=diasHasta(d.vence);return [e.legajo||'',nomE(e),e.sector||'',d.tipo,d.descripcion||'',fmtD(d.fecha_emision),fmtD(d.vence),n==null?'':n,L[docEst(d)],d.archivo_nombre||'',d.subido_por||'',fmtTs(d.created_at)];})]);}

// ══════════════ INICIO ══════════════
function lock(msg,extra){$('splash').innerHTML=`<div style="font-size:34px">🔒</div><div style="font-size:17px;font-weight:800;max-width:520px">${msg}</div>${extra?`<div style="font-size:13px;color:rgba(255,255,255,.75);max-width:520px;line-height:1.5">${extra}</div>`:''}<a href="/portal.html" style="color:var(--gold);margin-top:8px">← Volver al portal CONTROL MAX</a>`;}
async function init(){
  $('buildLbl').textContent=BUILD;
  const {data:{session}}=await sb.auth.getSession();
  if(!session||!session.user){location.href='/portal.html';return;}
  const {data:perfil,error:pe}=await sb.from('perfiles').select('nombre,rol,empresa_id,activo').eq('id',session.user.id).single();
  if(pe||!perfil||perfil.activo===false){location.href='/portal.html';return;}
  S.uid=session.user.id;S.empresaId=perfil.empresa_id;S.rol=(perfil.rol||'').toLowerCase();S.nombre=perfil.nombre||session.user.email;
  const {data:em}=await sb.from('empresas').select('*').eq('id',S.empresaId).single();S.empresa=em||{};
  // plan y permisos de módulo (Configuración MAX)
  const mods=S.empresa.modulos;if(mods&&typeof mods==='object'&&mods.rrhh===false)return lock('CONTROL RRHH no está activo en el plan de tu empresa',esAdmin()?'Activalo en <b>Configuración → Plan y módulos</b>.':'');
  const pm=S.empresa.permisos_max&&S.empresa.permisos_max.modulos;
  if(!esAdmin()&&pm&&Array.isArray(pm[S.rol])&&!pm[S.rol].includes('rrhh'))return lock('Tu rol no tiene acceso a CONTROL RRHH');
  // acceso por usuario (los legajos tienen datos personales)
  const r=await sb.rpc('rrhh_puede',{p_nivel:'gestion'});
  if(r.error){if(/rrhh_puede|PGRST202|does not exist|Could not find/i.test(r.error.message||''))return lock('CONTROL RRHH todavía no está instalado en la base',esAdmin()?'Corré <b>rrhh_etapa1_setup.sql</b> en Supabase → SQL Editor y recargá esta página.':'Avisale al administrador.');throw r.error;}
  if(esAdmin())S.nivel='admin';else if(r.data)S.nivel='gestion';
  else{const r2=await sb.rpc('rrhh_puede',{p_nivel:'consulta'});if(r2.error)throw r2.error;if(!r2.data)return lock('Tu usuario no tiene acceso a CONTROL RRHH','Los legajos tienen datos personales: un administrador tiene que habilitarte en <b>CONTROL RRHH → Configuración RRHH → Accesos</b>.');S.nivel='consulta';}
  await loadAll();
  $('empName').textContent=S.empresa.razon_social||'';$('whoName').textContent=S.nombre;$('whoRole').textContent=(ROL_LABEL[S.rol]||S.rol)+' · RRHH '+({admin:'total',gestion:'gestión',consulta:'consulta'}[S.nivel]);
  $('splash').style.display='none';$('app').style.display='block';
  const h=(location.hash||'').slice(1);const [hv,hid]=h.split('=');
  if(hv==='ficha'&&hid&&emp(hid))return go('ficha',hid);
  go(META[hv]||FUT[hv]?hv:'panel');
}
document.addEventListener('visibilitychange',async()=>{if(document.hidden||!S.empresaId||$('modalBg').classList.contains('show'))return;try{await loadAll();buildNav();if(cur!=='config')go(cur,S.fichaId);}catch(e){}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&$('modalBg').classList.contains('show'))closeModal();});
init().catch(e=>{console.error(e);$('splash').innerHTML='<div style="padding:20px">No se pudo iniciar CONTROL RRHH: '+esc(errMsg(e))+'</div><a href="/portal.html" style="color:var(--gold)">← Volver al portal</a>';});
</script>
