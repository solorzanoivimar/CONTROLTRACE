<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" width="960" height="240" font-family="Inter,'Segoe UI',Arial,sans-serif" role="img" aria-label="Del pedido a la entrega">
<title>Del pedido a la entrega</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3d5a80"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9a24b"/></marker></defs>
<rect width="960" height="240" rx="14" fill="#f5f2ea"/>
<rect x="24" y="46" width="200" height="70" rx="10" fill="#fff" stroke="#d9d2c3" stroke-width="1.5"/><circle cx="40" cy="62" r="10" fill="#16243f"/><text x="40" y="66" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">1</text><text x="124.0" y="74.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1c2536">Pedido</text><text x="124.0" y="92.0" text-anchor="middle" font-size="11.5" fill="#6b7689">Pendiente</text><line x1="224" y1="81" x2="252" y2="81" stroke="#3d5a80" stroke-width="2"  marker-end="url(#a)"/><rect x="252" y="46" width="200" height="70" rx="10" fill="#fff" stroke="#d9d2c3" stroke-width="1.5"/><circle cx="268" cy="62" r="10" fill="#16243f"/><text x="268" y="66" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">2</text><text x="352.0" y="74.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1c2536">Remito emitido</text><text x="352.0" y="92.0" text-anchor="middle" font-size="11.5" fill="#6b7689">lote por renglón</text><line x1="452" y1="81" x2="480" y2="81" stroke="#3d5a80" stroke-width="2"  marker-end="url(#a)"/><rect x="480" y="46" width="200" height="70" rx="10" fill="#fff" stroke="#d9d2c3" stroke-width="1.5"/><circle cx="496" cy="62" r="10" fill="#16243f"/><text x="496" y="66" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">3</text><text x="580.0" y="74.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1c2536">Validación de carga</text><text x="580.0" y="92.0" text-anchor="middle" font-size="11.5" fill="#6b7689">cajas controladas</text><line x1="680" y1="81" x2="708" y2="81" stroke="#3d5a80" stroke-width="2"  marker-end="url(#a)"/><rect x="708" y="46" width="200" height="70" rx="10" fill="#fff" stroke="#d9d2c3" stroke-width="1.5"/><circle cx="724" cy="62" r="10" fill="#16243f"/><text x="724" y="66" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">4</text><text x="808.0" y="74.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1c2536">Entrega</text><text x="808.0" y="92.0" text-anchor="middle" font-size="11.5" fill="#6b7689">remito impreso</text><rect x="252" y="160" width="200" height="62" rx="10" fill="#faf3e2" stroke="#e7cf96" stroke-width="1.5"/><text x="352.0" y="184.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1c2536">Asignar lotes</text><text x="352.0" y="202.0" text-anchor="middle" font-size="11.5" fill="#6b7689">si quedó pendiente de lote</text><path d="M 330 116 L 330 158" fill="none" stroke="#3d5a80" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/><path d="M 380 160 L 380 118" fill="none" stroke="#3d5a80" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="470" y="190" text-anchor="start" font-size="11.5" font-weight="500" fill="#6b7689">hasta asignar el lote, ese renglón no descuenta stock</text><text x="24" y="30" text-anchor="start" font-size="11" font-weight="700" fill="#c9a24b">El pedido pasa a Entregado al emitir el remito</text></svg>