<rect x="24" y="104" width="190" height="66" rx="10" fill="#fff" stroke="#d9d2c3" stroke-width="1.5"/><circle cx="40" cy="120" r="10" fill="#16243f"/><text x="40" y="124" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">1</text><text x="119.0" y="130.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1c2536">Lote devuelto</text><text x="119.0" y="148.0" text-anchor="middle" font-size="11.5" fill="#6b7689">escaneá o tipeá</text><rect x="250" y="104" width="190" height="66" rx="10" fill="#fff" stroke="#d9d2c3" stroke-width="1.5"/><circle cx="266" cy="120" r="10" fill="#16243f"/><text x="266" y="124" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">2</text><text x="345.0" y="130.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1c2536">Elegir la entrega</text><text x="345.0" y="148.0" text-anchor="middle" font-size="11.5" fill="#6b7689">remito y cantidad</text><line x1="214" y1="137" x2="248" y2="137" stroke="#3d5a80" stroke-width="2"  marker-end="url(#a)"/><rect x="560" y="24" width="300" height="66" rx="10" fill="#e9f1ec" stroke="#b9d3c3" stroke-width="1.5"/><text x="710.0" y="50.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1c2536">↩️ Producto terminado</text><text x="710.0" y="68.0" text-anchor="middle" font-size="11.5" fill="#6b7689">vuelve al stock, mismo lote</text><path d="M 440 137 C 500 137, 500 57, 558 57" fill="none" stroke="#3d5a80" stroke-width="2"  marker-end="url(#a)"/><rect x="560" y="108" width="300" height="66" rx="10" fill="#eef3fb" stroke="#c8d6ee" stroke-width="1.5"/><text x="710.0" y="134.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1c2536">🥬 Materia prima</text><text x="710.0" y="152.0" text-anchor="middle" font-size="11.5" fill="#6b7689">lote nuevo de reingreso (kg)</text><path d="M 440 137 C 500 137, 500 141, 558 141" fill="none" stroke="#3d5a80" stroke-width="2"  marker-end="url(#a)"/><rect x="560" y="192" width="300" height="66" rx="10" fill="#f