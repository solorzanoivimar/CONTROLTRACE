<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 276" width="960" height="276" font-family="Inter,'Segoe UI',Arial,sans-serif" role="img" aria-label="Cómo se decide qué ve cada usuario">
<title>Cómo se decide qué ve cada usuario</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3d5a80"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9a24b"/></marker></defs>
<rect width="960" height="276" rx="14" fill="#f5f2ea"/>
<text x="24" y="34" text-anchor="start" font-size="11" font-weight="700" fill="#c9a24b">QUÉ VE UN USUARIO: SE APLICAN TRES FILTROS, UNO DESPUÉS DEL OTRO</text><rect x="24" y="52" width="268" height="72" rx="10" fill="#fff" stroke="#d9d2c3" stroke-width="1.5"/><circle cx="40" cy="68" r="10" fill="#16243f"/><text x="40" y="72" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">1</text><text x="158.0" y="81.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1c2536">Plan de la empresa</text><text x="158.0" y="99.0" text-anchor="middle" font-size="11.5" fill="#6b7689">qué módulos tiene</text><text x="158" y="144" text-anchor="middle" font-size="11" font-weight="500" fill="#3d5a80">se configura en: Plan y módulos</text><line x1="292" y1="88" x2="322" y2="88" stroke="#3d5a80" stroke-width="2"  marker-end="url(#a)"/><rect x="322" y="52" width="268" height="72" rx="10" fill="#fff" stroke="#d9d2c3" stroke-width="1.5"/><circle cx="338" cy="68" r="10" fill="#16243f"/><text x="338" y="72" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">2</text><text x="456.0" y="81.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1c2536">Rol del usuario</text><text x="456.0" y="99.0" text-anchor="middle" font-size="11.5" fill="#6b7689">qué módulos ve</text><text x="456" y="144" text-anchor="middle" font-size="11" font-weight="500" fill="#3d5a80">se configura en: Roles y permisos · tabla 1</text><line x1="590" y1="88" x2="620" y2="88" stroke="#3d5a80" stroke-width="2"  marker-end="url(#a)"/><rect x="620" y="52" width="268" height="72" rx="10" fill="#fff" stroke="#d9d2c3" stroke-width="1.5"/><circle cx="636" cy="68" r="10" fill="#16243f"/><text x="636" y="72" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">3</text><text x="754.0" y="81.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1c2536">Permisos del rol</text><text x="754.0" y="99.0" text-anchor="middle" font-size="11.5" fill="#6b7689">qué pantallas y secciones</text><text x="754" y="144" text-anchor="middle" font-size="11" font-weight="500" fill="#3d5a80">se configura en: Roles y permisos · tablas 2 a 4</text><rect x="24" y="170" width="436" height="58" rx="10" fill="#fff" stroke="#c9a24b" stroke-width="1.5"/><text x="242.0" y="192.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1c2536">🔑 Acceso: Galpón / Finca / Administrador</text><text x="242.0" y="210.0" text-anchor="middle" font-size="11.5" fill="#6b7689">solo decide si entra a CONTROL TRACE o a CONTROLAGRO</text><rect x="500" y="170" width="436" height="58" rx="10" fill="#16243f" stroke="#16243f" stroke-width="1.5"/><text x="718.0" y="192.0" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">👑 Administrador y Dueño</text><text x="718.0" y="210.0" text-anchor="middle" font-size="11.5" fill="#fff">ven todo siempre, incluida Configuración</text><text x="24" y="258" text-anchor="start" font-size="12" font-weight="500" fill="#6b7689">Los cambios se aplican cuando la persona vuelve a entrar al módulo (o recarga la página).</text></svg>