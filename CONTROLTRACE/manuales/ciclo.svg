<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 262" width="960" height="262" font-family="Inter,'Segoe UI',Arial,sans-serif" role="img" aria-label="Vida de un documento en el muro">
<title>Vida de un documento en el muro</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3d5a80"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9a24b"/></marker></defs>
<rect width="960" height="262" rx="14" fill="#f5f2ea"/>
<text x="24" y="34" text-anchor="start" font-size="11" font-weight="700" fill="#c9a24b">VIDA DE UN DOCUMENTO EN EL MURO</text><rect x="24" y="50" width="200" height="66" rx="10" fill="#eef2f8" stroke="#c5d1e3" stroke-width="1.5"/><circle cx="40" cy="66" r="10" fill="#16243f"/><text x="40" y="70" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">1</text><text x="124.0" y="76.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1c2536">Pedido o plan</text><text x="124.0" y="94.0" text-anchor="middle" font-size="11.5" fill="#6b7689">se carga en TRACE / PLUS</text><line x1="224" y1="83" x2="252" y2="83" stroke="#3d5a80" stroke-width="2"  marker-end="url(#a)"/><rect x="252" y="50" width="200" height="66" rx="10" fill="#fff" stroke="#d9d2c3" stroke-width="1.5"/><circle cx="268" cy="66" r="10" fill="#16243f"/><text x="268" y="70" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">2</text><text x="352.0" y="76.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1c2536">Publicar</text><text x="352.0" y="94.0" text-anchor="middle" font-size="11.5" fill="#6b7689">foto sin precios · para qué roles</text><line x1="452" y1="83" x2="480" y2="83" stroke="#3d5a80" stroke-width="2"  marker-end="url(#a)"/><rect x="480" y="50" width="200" height="66" rx="10" fill="#fff" stroke="#d9d2c3" stroke-width="1.5"/><circle cx="496" cy="66" r="10" fill="#16243f"/><text x="496" y="70" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">3</text><text x="580.0" y="76.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1c2536">En el muro</text><text x="580.0" y="94.0" text-anchor="middle" font-size="11.5" fill="#6b7689">🆕 Nuevo → ✅ Visto</text><line x1="680" y1="83" x2="708" y2="83" stroke="#3d5a80" stroke-width="2"  marker-end="url(#a)"/><rect x="708" y="50" width="200" height="66" rx="10" fill="#f6f3ec" stroke="#ddd3bd" stroke-width="1.5"/><circle cx="724" cy="66" r="10" fill="#16243f"/><text x="724" y="70" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">4</text><text x="808.0" y="76.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1c2536">Vencido</text><text x="808.0" y="94.0" text-anchor="middle" font-size="11.5" fill="#6b7689">al pasar “visible hasta”</text><path d="M 580 116 C 580 170, 520 176, 480 176" fill="none" stroke="#b5654a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/><rect x="250" y="150" width="226" height="58" rx="10" fill="#faf3e2" stroke="#e7cf96" stroke-width="1.5"/><text x="363.0" y="172.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1c2536">⚠ cambió el origen</text><text x="363.0" y="190.0" text-anchor="middle" font-size="11.5" fill="#6b7689">se editó el pedido o el plan</text><path d="M 362 150 L 362 120" fill="none" stroke="#c9a24b" stroke-width="2"  marker-end="url(#g)"/><text x="372" y="140" text-anchor="start" font-size="11.5" font-weight="600" fill="#1c2536">🔁 Republicar → v2 · 🔄 Actualizado</text><rect x="706" y="150" width="230" height="58" rx="10" fill="#f6ebe6" stroke="#e2bfb2" stroke-width="1.5"/><text x="821.0" y="172.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1c2536">✕ Retirado</text><text x="821.0" y="190.0" text-anchor="middle" font-size="11.5" fill="#6b7689">a mano, con motivo</text><path d="M 640 116 C 660 150, 690 168, 704 172" fill="none" stroke="#b5654a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="24" y="244" text-anchor="start" font-size="12" font-weight="500" fill="#6b7689">Nada se borra: las versiones anteriores quedan en el historial y lo retirado o vencido sigue en Publicaciones.</text></svg>