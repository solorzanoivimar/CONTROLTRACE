function isMissing(e){return /PGRST205|42P01|does not exist|Could not find the table|schema cache/i.test((e&&(e.message||''))+' '+(e&&e.code||''))}
async function fetchAll(table,f){const P=1000;let out=[],from=0;for(;;){let q=sb.from(table).select('*').eq('empresa_id',S.empresaId);if(f)q=f(q);q=q.range(from,from+P-1);const {data,error}=await q;if(error){if(isMissing(error)||/column/i.test(error.message||'')){S.faltan.push(table);return out}throw new Error(table+': '+error.message)}out=out.concat(data||[]);if(!data||data.length<P)break;from+=P}return out}
async function fetchIn(table,col,ids){ids=[...new Set(ids.filter(Boolean))];let out=[];for(let i=0;i<ids.length;i+=150){const part=ids.slice(i,i+150);out=out.concat(await fetchAll(table,q=>q.in(col,part)));if(S.faltan.includes(table))break}return out}
function group(arr,kf,vf){const m={};arr.forEach(x=>{const k=kf(x)||'(sin dato)';m[k]=(m[k]||0)+vf(x)});return Object.entries(m).map(([k,v])=>({k,v})).sort((a,b)=>b.v-a.v)}
function csv(name,rows){const t=rows.map(r=>r.map(c=>{c=String(c==null?'':c);return /[",;\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(';')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+t],{type:'text/csv'}));a.download=name+'_'+hoy()+'.csv';a.click()}
// ───────── período ─────────
function rango(){const p=$('fPer').value,t=hoy(),d=new Date();let a,b=t;
  if(p==='mes')a=iso(new Date(d.getFullYear(),d.getMonth(),1));
  else if(p==='mesant'){a=iso(new Date(d.getFullYear(),d.getMonth()-1,1));b=iso(new Date(d.getFullYear(),d.getMonth(),0))}
  else if(p==='trim')a=iso(new Date(d.getFullYear(),Math.floor(d.getMonth()/3)*3,1));
  else if(p==='anio')a=d.getFullYear()+'-01-01';
  else if(p==='custom'){a=$('fD').value||t;b=$('fH').value||t}
  else a=addD(t,-(+p-1));
  return {a,b}}
function fechaManual(){$('fPer').value='custom';aplicar()}
function perCambio(){const r=rango();if($('fPer').value!=='custom'){$('fD').value=r.a;$('fH').value=r.b}}
let _apSeq=0;
async function aplicar(){perCambio();const r=rango();if(r.a>r.b)return toast('La fecha "desde" es posterior a "hasta"');const seq=++_apSeq;
  const n=days(r.a,r.b);const cmp=$('fCmp').value==='prev';const pb=addD(r.a,-1),pa=addD(pb,-(n-1));
  S.rng={a:r.a,b:r.b,pa:cmp?pa:null,pb:cmp?pb:null,n};
  if(!subRep())$('body').innerHTML='<div class="card">⏳ Cargando datos del período…</div>';
  repSync();
  try{await cargar(cmp?pa:r.a,r.b)}catch(e){if(seq!==_apSeq)return;console.error(e);$('body').innerHTML='<div class="card alert bad">No se pudieron cargar los datos: '+esc(e.message)+'</div>';return}

  $('fInfo').textContent='Período: '+fD(r.a)+' → '+fD(r.b)+' ('+n+' días)'+(cmp?' · comparado con '+fD(pa)+' → '+fD(pb):'');
  render();}
// ───────── carga ─────────
async function cargar(a,b){S.faltan=[];const R=S.raw;
  const fd=(col)=>q=>q.gte(col,a).lte(col,b);
  const [rec,prd,desc,ent,cv,cc,cob,pag,caja,banco]=await Promise.all([
    fetchAll('recepciones',fd('fecha')),fetchAll('producciones',fd('fecha')),fetchAll('descartes',fd('fecha')),fetchAll('entregas',fd('fecha')),
    fetchAll('comprobantes_venta',fd('fecha')),fetchAll('comprobantes_compra',fd('fecha')),fetchAll('cobranzas',fd('fecha')),fetchAll('pagos',fd('fecha')),
    Promise.resolve([]),Promise.resolve([])]);
  Object.assign(R,{rec,prd,desc,ent,cv,cc,cob,pag,caja,banco});
  // tot 2.0: comprobantes en dólares → pesos (cotización del comprobante)
  const FXF=['neto_gravado','neto_no_gravado','exento','iva_105','iva_21','iva_27','tributos','total','saldo'];const fxN=c=>{if(c._fx)return;const f=c.moneda==='DOL'?num(c.cotizacion)||1:1;c._fx=f;if(f!==1)FXF.forEach(k=>{if(c[k]!=null)c[k]=num(c[k])*f})};cv.forEach(fxN);
  const pid=new Set(prd.map(p=>p.id)),eid=new Set(ent.map(e=>e.id));

    fetchAll('comprobantes_venta',q=>q.gt('saldo',0)),fetchAll('comprobantes_compra',q=>q.gt('saldo',0)),fetchAll('clientes')]);
  R.outs=outs.filter(o=>pid.has(o.produccion_id));R.items=items.filter(i=>eid.has(i.entrega_id));R.cxc=cxc;R.cxp=cxp;
  R.cli={};clis.forEach(c=>R.cli[c.id]=c.razon_social||c.nombre||'');R.clis=clis;cxc.forEach(fxN);

    fetchIn('comprobantes_venta_items','comprobante_id',cv.map(c=>c.id)),fetchIn('comprobantes_compra_items','comprobante_id',cc.map(c=>c.id)),
    fetchIn('cobranza_medios','cobranza_id',cob.map(c=>c.id)),fetchIn('cobranza_retenciones','cobranza_id',cob.map(c=>c.id)),fetchIn('pago_medios','pago_id',pag.map(p=>p.id)),
    fetchAll('cheques'),fetchAll('cajas'),fetchAll('cuentas_bancarias'),fetchAll('vendedores'),fetchAll('productos'),fetchAll('caja_movimientos'),fetchAll('banco_movimientos'),fetchAll('novedades',fd('fecha'))]);
  const fxm={};cv.forEach(c=>fxm[c.id]=c._fx||1);cvi.forEach(i=>{const f=fxm[i.comprobante_id]||1;if(f!==1)['neto','iva','precio_unit'].forEach(k=>{if(i[k]!=null)i[k]=num(i[k])*f})});
  Object.assign(R,{cvi,cci,cobm,cobr,pagm,chq,cajas,ctas,vends,cjmAll,bmAll,nov});R.prods={};prods.forEach(p=>R.prods[p.id]=p);

// ───────── cálculo ─────────
const neto=x=>num(x.neto_gravado)+num(x.neto_no_gravado)+num(x.exento);
const vivaV=c=>!['anulada','borrador'].includes(c.estado);
function calc(a,b){const R=S.raw,X={a,b};
  const rec=R.rec.filter(r=>r.estado!=='anulada'&&inR(r.fecha,a,b));
  X.rec={n:rec.length,kg:rec.reduce((s,r)=>s+num(r.kilos),0),valor:rec.reduce((s,r)=>s+(num(r.total)||num(r.kilos)*num(r.precio_kilo)),0),
    porMP:group(rec,r=>r.materia_prima,r=>num(r.kilos)),porProv:group(rec,r=>r.proveedor,r=>num(r.kilos)),
    precioMP:Object.entries(rec.reduce((m,r)=>{const k=r.materia_prima||'(sin dato)';const g=m[k]=m[k]||{kg:0,v:0};if(num(r.precio_kilo)>0){g.kg+=num(r.kilos);g.v+=num(r.kilos)*num(r.precio_kilo)}return m},{})).map(([k,g])=>({k,p:g.kg?g.v/g.kg:0,kg:g.kg})).filter(x=>x.p>0).sort((x,y)=>y.kg-x.kg)};

  const mpkg=prd.reduce((s,p)=>s+num(p.mp_kg),0),okg=outs.reduce((s,o)=>s+num(o.kilos),0);
  const des=R.desc.filter(d=>d.estado!=='anulada'&&inR(d.fecha,a,b));const dkg=des.reduce((s,d)=>s+num(d.kg),0);
  X.prod={ops:prd.length,mpkg,okg,unid:outs.reduce((s,o)=>s+num(o.cantidad),0),rinde:mpkg>0&&okg>0?okg/mpkg:null,
    porProd:group(outs,o=>o.producto_nombre,o=>num(o.cantidad)),descKg:dkg,descPct:(mpkg+dkg)>0?dkg/Math.max(mpkg,1):null,

    porCli:group(cv,c=>c.cliente_nombre,c=>sg(c)*num(c.total)),porMes:group(cv,c=>String(c.fecha).slice(0,7),c=>sg(c)*num(c.total)).sort((x,y)=>x.k<y.k?-1:1),

    porProd:group(real,i=>i.producto_nombre,i=>num(i.cantidad)),porProdVal:group(real,i=>i.producto_nombre,i=>num(i.cantidad)*num(i.precio)),
    porCli:group(ent,e=>R.cli[e.cliente_id]||'(sin cliente)',e=>real.filter(i=>i.entrega_id===e.id).reduce((s,i)=>s+num(i.cantidad),0))};

    porProv:group(cc,c=>c.proveedor_nombre,c=>sc(c)*num(c.total)),porCat:group(cc.filter(c=>c.subtipo==='gasto'),c=>c.categoria||c.concepto,c=>sc(c)*neto(c)),

function saldos(){const R=S.raw,t=hoy();const f=(arr,vencF)=>{const vivos=arr.filter(c=>!['anulada','borrador'].includes(c.estado)&&num(c.saldo)>0&&c.clase!=='nc');

  const disp=sumBy((S.raw.cajas||[]),c=>saldoCajaA(c.id,t))+sumBy((S.raw.ctas||[]),c=>saldoCtaA(c.id,t));const W=[];for(let i=0;i<13;i++)W.push({a:addD(t,i*7),b:addD(t,i*7+6),cxc:0,chc:0,cxp:0,chp:0});const wk=f=>{f=String(f||t).slice(0,10);if(f<t)return 0;const i=Math.floor((days(t,f)-1)/7);return i<13?i:-1};
  (S.raw.cxc||[]).filter(c=>!['anulada','borrador'].includes(c.estado)&&c.clase!=='presupuesto'&&num(c.saldo)>0).forEach(c=>{const i=wk(c.fecha_vto||c.fecha);if(i>=0)W[i].cxc+=num(c.saldo)*(c.clase==='nc'?-1:1)});
  (S.raw.cxp||[]).filter(c=>c.estado!=='anulada'&&num(c.saldo)>0).forEach(c=>{const i=wk(c.fecha_vto||c.fecha);if(i>=0)W[i].cxp+=num(c.saldo)*(c.clase==='nc'?-1:1)});
  chqVivos().forEach(c=>{const i=wk(c.fecha_cobro);if(i<0)return;if(c.origen==='tercero'&&c.estado==='cartera')W[i].chc+=num(c.importe);if(c.origen==='propio'&&['entregado','emitido'].includes(c.estado))W[i].chp+=num(c.importe)});
  let sal=disp;const proy=W.map((w,i)=>{const n=w.cxc+w.chc-w.cxp-w.chp;sal+=n;return [(i?'':'<b>Hoy y vencidos</b><br>')+fD(w.a).slice(0,5)+' al '+fD(w.b).slice(0,5),m$(w.cxc),m$(w.chc),m$(w.cxp),m$(w.chp),`<b style="color:${n<0?'#B3261E':'#2D7D46'}">${m$(n)}</b>`,`<b style="color:${sal<0?'#B3261E':'inherit'}">${m$(sal)}</b>`]});
  const minS=Math.min(...(()=>{let s=disp;return W.map(w=>s+=w.cxc+w.chc-w.cxp-w.chp)})());
  return card('Flujo de fondos real del período',`<p class="hint">Lo efectivamente cobrado (recibos) y pagado (órdenes de pago), por ${S.rng.n>62?'mes':S.rng.n>21?'semana':'día'}.</p>`+tbl(['Período','Cobrado','Pagado','Neto','Acumulado'],real,'flujo_real'))+
  card('Proyección de fondos · próximas 13 semanas',`<p class="hint">Parte del disponible de hoy (${m$(disp)}) y suma lo que debería entrar (facturas a cobrar por su vencimiento + cheques en cartera por su fecha de cobro) menos lo que debería salir (facturas a pagar + cheques propios a debitar). Lo vencido se imputa a la primera semana. Es una proyección: depende de que clientes y proveedores cumplan los plazos.</p>${minS<0?`<div class="alert bad">Atención: la proyección muestra saldo negativo (mínimo ${m$(minS)}). Conviene adelantar cobranzas o reprogramar pagos.</div>`:''}`+tbl(['Semana','A cobrar (facturas)','Cheques a cobrar','A pagar (facturas)','Cheques propios','Neto semana','Saldo proyectado'],proy,'proyeccion_fondos'))},
 eerr(){const cv=ventasP(),cc=comprasP();const m={};const g=k=>m[k]=m[k]||{v:0,c:0,g:0};cv.forEach(c=>g(String(c.fecha).slice(0,7)).v+=sgn(c)*neto(c));cc.forEach(c=>{const x=g(String(c.fecha).slice(0,7));if(c.subtipo==='gasto')x.g+=sgn(c)*neto(c);else x.c+=sgn(c)*neto(c)});
  const rows=Object.keys(m).sort().map(k=>{const x=m[k];const[y,mm]=k.split('-');const r=x.v-x.c-x.g;return {mes:MES[+mm-1]+' '+y,k,v:x.v,c:x.c,mb:x.v-x.c,mbp:x.v?(x.v-x.c)/x.v:null,g:x.g,r,rp:x.v?r/x.v:null}});
  const cats=group(cc.filter(c=>c.subtipo==='gasto'),c=>c.categoria||'(sin categoría)',c=>sgn(c)*neto(c));
  return rpt({id:'eerr',titulo:'Resultado mensual (ventas − compras − gastos)',desc:'Estado de resultados simplificado por mes con importes netos sin IVA. No incluye variación de stock, amortizaciones, sueldos no cargados como gasto ni impuestos a las ganancias: es un indicador de gestión, no un balance contable.',rows,noSearch:true,sort:null,
   post:card('Gastos del período por categoría',bars(cats,m$,12)),
   cols:[{k:'mes',l:'Mes',t:TX},{k:'v',l:'Ventas netas',t:T$},{k:'c',l:'Compras',t:T$},{k:'mb',l:'Margen bruto',t:T$},{k:'mbp',l:'Margen bruto %',t:TP,tot:r=>{const v=sumBy(r,x=>x.v);return v?sumBy(r,x=>x.mb)/v:null}},{k:'g',l:'Gastos',t:T$},{k:'r',l:'Resultado',t:T$},{k:'rp',l:'Resultado %',t:TP,tot:r=>{const v=sumBy(r,x=>x.v);return v?sumBy(r,x=>x.r)/v:null}}]})}
};
// ═════════ AUDITORÍA (novedades de todos los módulos) ═════════
const NOV_L={anular_recepcion:'Anular recepción',editar_recepcion:'Editar recepción',anular_acondicionamiento:'Anular acondicionamiento',editar_acondicionamiento:'Editar acondicionamiento',peps_forzado:'PEPS forzado',desbloqueo_produccion:'Desbloquear producción',editar_despacho:'Editar despacho',anular_despacho:'Anular despacho',anular_remito:'Anular remito',editar_remito:'Editar remito',validar_carga_dif:'Carga con diferencias',descarte:'Descarte MP',anular_descarte:'Anular descarte',editar_descarte:'Editar descarte',anular_devolucion:'Anular devolución',editar_devolucion:'Editar devolución',anular_produccion:'Anular producción',anular_ensamblado:'Anular ensamblado',editar_ensamblado:'Editar ensamblado',ajuste_stock:'Ajuste de stock',editar_ajuste:'Editar ajuste de stock',anular_ajuste:'Anular ajuste de stock',unificar_dup:'Unificar duplicados',asignar_lote_neg:'Asignar lote (stock negativo)',
 plus_anular_factura:'Anular comprobante de venta',plus_anular_cobranza:'Anular recibo',plus_anular_compra:'Anular comprobante de compra',plus_anular_pago:'Anular orden de pago',plus_anular_remito_compra:'Anular remito de compra',plus_anular_mov_caja:'Anular movimiento de caja',plus_anular_mov_banco:'Anular movimiento bancario',plus_eliminar_pedido:'Eliminar pedido',plus_cheque_rechazado:'Cheque rechazado',plus_cheque_estado:'Cambiar estado de cheque',plus_egreso_caja:'Egreso manual de caja',plus_ajuste_stock:'Ajuste de stock',plus_editar_ajuste:'Editar ajuste de stock',plus_anular_ajuste:'Anular ajuste de stock',plus_credito_excedido:'Facturar con crédito excedido',plus_autorizacion:'Autorización',plus_omitir_pendientes:'Marcar remitos/recepciones como listos',plus_revertir_omitido:'Volver a pendiente (desmarcar listo)',plus_arca_produccion:'Facturación ARCA pasada a producción'};
const novMod=n=>n.modulo?String(n.modulo).toUpperCase():/^plus_/.test(n.tipo||'')?'PLUS':/^agro_/.test(n.tipo||'')?'AGRO':/^rrhh_/.test(n.tipo||'')?'RRHH':'TRACE';
function vAud(){if(S.faltan.includes('novedades'))return '<div class="card alert warn">No se encontró la tabla de novedades en la base. Corré novedades_setup.sql en Supabase para activar la auditoría.</div>';
  const rows=(S.raw.nov||[]).map(n=>({f:n.fecha,h:String(n.created_at||'').slice(11,16),mod:novMod(n),op:NOV_L[n.tipo]||n.tipo||'',ref:n.referencia||'',det:n.detalle||'',aut:n.autorizado_por||'(sin PIN)',eje:n.ejecutado_por||''}));
  return rpt({id:'aud',titulo:'Auditoría · operaciones autorizadas',desc:'Todo lo que requirió autorización de supervisor (PIN) en los módulos de CONTROL MAX: anulaciones, ediciones, ajustes de stock, cheques rechazados, facturación con crédito excedido y más. Los registros de PLUS se guardan desde la versión 8.0.',sort:0,rows,filters:[{k:'mod',l:'Módulo'},{k:'op',l:'Operación'},{k:'aut',l:'Autorizó'},{k:'eje',l:'Ejecutó'}],noTot:true,
   pre:kpis([['Operaciones autorizadas',nf(rows.length),'en el período'],['TRACE',nf(rows.filter(r=>r.mod==='TRACE').length),''],['PLUS',nf(rows.filter(r=>r.mod==='PLUS').length),''],['Anulaciones',nf(rows.filter(r=>/anular/i.test(r.op)).length),'']])+`<div class="g2"><div>${card('Por operación',bars(group(rows,r=>r.op,r=>1),v=>nf(v),8))}</div><div>${card('Por quién autorizó',bars(group(rows,r=>r.aut,r=>1),v=>nf(v),8))}</div></div>`,
   cols:[{k:'f',l:'Fecha',t:TD},{k:'h',l:'Hora',t:TX},{k:'mod',l:'Módulo',t:TX},{k:'op',l:'Operación',t:TX},{k:'ref',l:'Referencia',t:TX},{k:'det',l:'Detalle',t:TX},{k:'aut',l:'Autorizó',t:TX},{k:'eje',l:'Ejecutó',t:TX}]})}

// ───────── reportes de TRACE dentro de cada pestaña (mismo código que TRACE → Reportes, embebido) ─────────
const TRACE_URL='/CONTROLTRACE/controltrace/index.html';
const SUBS={
 prod:[['res','📊 Resumen del período'],['|','De TRACE'],['t:diario','Diario'],['t:prov','Rinde proveedor'],['t:merma','Rinde por lote'],['t:traza','Trazabilidad'],['t:pedidos','Pedidos'],['t:estac','Estacionalidad'],['t:comp','Comparativo'],['t:cumpl','Cumplimiento'],['t:capac','Capacidad h-h'],['t:movim','Movimientos de stock']],
 com:[['res','📊 Resumen del período'],['n:facCli','Facturación por cliente'],['n:artCli','Artículos por cliente'],['n:rankArt','Ranking de artículos'],['n:estad','Estadísticas de ventas'],['n:vend','Ventas por vendedor'],['n:evoCli','Evolución de clientes'],['n:ctaCli','Saldos de clientes'],['n:nc','Notas de crédito'],['n:libroV','Libro IVA Ventas'],['|','De TRACE'],['t:ent','Entregas']],
 compras:[['res','📊 Resumen del período'],['n:cmpProv','Compras por proveedor'],['n:artComp','Artículos comprados'],['n:precioMP','Precio de MP por proveedor'],['n:gastosCat','Gastos por categoría'],['n:gastosDet','Detalle de gastos'],['n:ctaPrv','Saldos a proveedores'],['n:libroC','Libro IVA Compras'],['|','De TRACE'],['t:compras','Compras por MP y lote']],
 fin:[['res','📊 Resumen del período'],['n:posicion','Posición financiera'],['n:flujo','Flujo y proyección de fondos'],['n:eerr','Resultado mensual'],['n:cobranzas','Cobranzas'],['n:pagos','Pagos'],['n:cheques','Cheques'],['n:caja','Caja'],['n:bancos','Bancos'],['n:retenc','Retenciones sufridas'],['|','De TRACE'],['t:ventas','Ventas y utilidad']]};
const R_ALL=Object.assign({},R_COM,R_CMP,R_FIN);
function subCur(){return (SUBS[S.tab]&&S.sub[S.tab])||'res'}
function subRep(){const v=subCur();return v.startsWith('t:')?v.slice(2):null}
function subBar(){const l=SUBS[S.tab];if(!l)return '';const v=subCur();
  return `<div class="tabs noprint" style="margin-top:-4px;align-items:center">${l.map(r=>r[0]==='|'?`<span class="subg">${r[1]}:</span>`:`<button class="btn ${v===r[0]?'gold':''}" onclick="S.sub[S.tab]='${r[0]}';render()">${r[1]}</button>`).join('')}${v.startsWith('t:')?'':'<span style="flex:1"></span><button class="btn" onclick="window.print()">🖨 Imprimir vista</button>'}</div>`}
function repFrame(){return document.getElementById('repFrame')}
function repSync(){const f=repFrame();if(!f||!S.rng)return;try{f.contentWindow.postMessage({type:'cmax-periodo',desde:S.rng.a,hasta:S.rng.b},location.origin)}catch(e){}}
function repMostrar(r){const w=$('repWrap');w.style.display='block';const f=repFrame();
  if(f){try{f.contentWindow.postMessage({type:'cmax-reporte',r},location.origin)}catch(e){}return}
  const p=S.rng||rango();
  w.innerHTML=`<div class="card" style="padding:0;overflow:hidden"><div id="repLoad" class="hint" style="padding:12px 16px">⏳ Cargando los reportes de TRACE (la primera vez tarda unos segundos)…</div>
  <iframe id="repFrame" title="Reportes" src="${TRACE_URL}?embed=rep&desde=${p.a}&hasta=${p.b}&r=${r}" style="display:block;width:100%;height:calc(100vh - 230px);min-height:620px;border:0;background:#fff"></iframe></div>
  <div class="hint">El período se toma de arriba. Los filtros de proveedor, materia prima y cliente están dentro del reporte. El Diario usa su propia fecha.</div>`}
window.addEventListener('message',e=>{if(e.origin!==location.origin)return;if(e.data&&e.data.type==='cmax-trace-listo'){const l=$('repLoad');if(l)l.remove();repSync();const r=subRep();if(r)try{repFrame().contentWindow.postMessage({type:'cmax-reporte',r},location.origin)}catch(_){}}});
// ───────── render ─────────
function render(){$('tabs').innerHTML=TABS.map(t=>`<button class="btn ${t[0]===S.tab?'on':''}" onclick="S.tab='${t[0]}';render()">${t[1]}</button>`).join('');
  const r=subRep();if(r){$('body').innerHTML=subBar();repMostrar(r);return}
  $('repWrap').style.display='none';const v=subCur();
  const V={resumen:vResumen,prod:vProd,com:vCom,compras:vCompras,fin:vFin,aud:vAud,ia:vIA};let h;
  try{h=v.startsWith('n:')?R_ALL[v.slice(2)]():V[S.tab]()}catch(e){console.error(e);h='<div class="card alert bad">Error al armar la vista: '+esc(e.message)+'</div>'}
  $('body').innerHTML=subBar()+h;if(S.tab==='ia')iaTipoCambio();}
// ───────── init ─────────
async function init(){const {data:{session}}=await sb.auth.getSession();if(!session||!session.user){location.href='/portal.html';return}
  const {data:pf,error}=await sb.from('perfiles').select('nombre,rol,empresa_id,activo').eq('id',session.user.id).single();if(error||!pf||pf.activo===false){location.href='/portal.html';return}
  S.empresaId=pf.empresa_id;S.rol=(pf.rol||'').toLowerCase();S.nombre=pf.nombre||session.user.email;
  if(!['admin','supervisor','comercial'].includes(S.rol)&&S.rol!=='administrador'){$('splash').innerHTML='<div style="text-align:center;padding:24px"><div style="font-size:30px">🔒</div>CONTROL TOTAL está disponible para administración y supervisión.<br><br><a href="/portal.html" style="color:#C9A84C">Volver al portal</a></div>';return}
  try{const {data:e}=await sb.from('empresas').select('razon_social').eq('id',S.empresaId).single();S.emp=e;$('hEmp').textContent=(e&&e.razon_social)||''}catch(e){}
  $('fPer').value='mes';perCambio();$('splash').style.display='none';await aplicar();}
document.addEventListener('DOMContentLoaded',()=>init().catch(e=>{console.error(e);$('splash').innerHTML='Error al iniciar: '+esc(e.message)}));
</script>
