// ── HELPERS DE CODIFICACIÓN ──────────────────────────────────
// Devuelve "[COD] NOMBRE" si el artículo tiene código, o solo "NOMBRE"
function fmtMP(nombre){
  if(!nombre) return '';
  const m=(S.materiasPrimas||[]).find(x=>(x.nombre||'').toUpperCase()===(nombre||'').toUpperCase());
  return (m&&m.codigo)?`[${m.codigo}] ${nombre.toUpperCase()}`:nombre.toUpperCase();
}
function fmtProd(p){
  if(!p) return '';
  return p.codigo?`[${p.codigo}] ${p.nombre}`:p.nombre;
}
function artCod(n){if(!n)return '';const u=(''+n).toUpperCase();const p=(S.productos||[]).find(x=>(x.nombre||'').toUpperCase()===u);if(p&&p.codigo)return p.codigo;const m=(S.materiasPrimas||[]).find(x=>(x.nombre||'').toUpperCase()===u);return (m&&m.codigo)||'';}
function provCod(n){if(!n)return '';const p=(S.proveedores||[]).find(x=>(x.nombre||'').toUpperCase()===(''+n).toUpperCase());return (p&&p.codigo)||'';}
function cliCod(id){const c=(S.clientes||[]).find(x=>x.id===id);return (c&&c.codigo)||'';}
// Busca el nombre real a partir de lo que escribe el usuario (con o sin código)
function parseMPNombre(raw){
  if(!raw) return '';
  const m=raw.match(/^\[([^\]]+)\]\s*(.+)$/);
  return m?m[2].trim():raw.trim();
}

async function boot(){
  try{
    const {data:{user}}=await sb.auth.getUser();
    if(!user){showLogin();return;}
    const {data:perfil,error:e1}=await sb.from('perfiles').select('nombre,rol,empresa_id,activo').eq('id',user.id).single();
    if(e1)throw new Error('Perfil: '+e1.message);
    S.empresaId=perfil.empresa_id;S.rol=perfil.rol;S.nombre=perfil.nombre;S._uid=user.id;
    if(perfil.activo===false){await sb.auth.signOut();showLogin();lmsg('Tu usuario está inactivo. Contactá al administrador.',0);return;}
    const {data:emp,error:e2}=await sb.from('empresas').select('*').eq('id',perfil.empresa_id).single();
    if(e2)throw new Error('Empresa: '+e2.message);
    S.empresa=emp;
    await reloadCatalogo();
    await reloadRecepciones();
    await reloadAcond();
    await reloadProducciones();
    await reloadDespachos();
    await reloadEntregas();
    await reloadPedidos();
    await reloadOperarios();
    await reloadInsumos();
    await reloadCostos();
    await reloadDevoluciones();
    await reloadEnsamblados();
    await reloadDescartes();
    await reloadAjustes();
    await reloadNovedades();
    // pintar shell
    $('empName').textContent=emp.razon_social;
    $('whoName').textContent=S.nombre;$('whoRole').textContent=S.rol;
    buildNav();
    $('login').style.display='none';$('app').style.display='block';
    go('dash');
  }catch(err){lmsg('❌ '+err.message,0);$('btnLogin').innerHTML='Ingresar';$('btnLogin').disabled=false;}
}

async function reloadCatalogo(){
  const [{data:prod},{data:cli},{data:prov},{data:mat},{data:comp}]=await Promise.all([
    sb.from('productos').select('*').eq('empresa_id',S.empresaId).order('nombre'),
    sb.from('clientes').select('*').eq('empresa_id',S.empresaId).order('razon_social'),
    sb.from('proveedores').select('*').eq('empresa_id',S.empresaId).order('nombre'),
    sb.from('producto_materias').select('producto_id,materia_prima,cantidad,por_kilo').eq('empresa_id',S.empresaId),
    sb.from('producto_componentes').select('producto_id,componente,cantidad').eq('empresa_id',S.empresaId)
  ]);
  S.productos=prod||[];S.clientes=cli||[];S.proveedores=prov||[];
  const byId={};(S.productos||[]).forEach(p=>byId[p.id]=p.nombre);
  S.prodMP={};S.recetas={};
  (mat||[]).forEach(m=>{const n=byId[m.producto_id];if(!n)return;(S.prodMP[n]=S.prodMP[n]||[]).push(m.materia_prima);(S.recetas[n]=S.recetas[n]||[]).push({mp:m.materia_prima,cantidad:+m.cantidad||0});});
  S.materias=[...new Set((mat||[]).map(m=>m.materia_prima))].sort();
  S.componentes={};(comp||[]).forEach(c=>{const n=byId[c.producto_id];if(!n)return;(S.componentes[n]=S.componentes[n]||[]).push({componente:c.componente,cantidad:+c.cantidad||0});});
  await reloadMaterias();
}

function enPeriodo(fecha,key){const p=periodos[key]||'mes';if(p==='todo')return true;if(!fecha)return false;const now=new Date();const f=new Date(fecha+'T00:00:00');
  if(p==='hoy')return fecha===today();
  if(p==='rango'){const r=periodosR[key]||{};if(r.d&&fecha<r.d)return false;if(r.h&&fecha>r.h)return false;return true;}
  if(p==='mes')return f.getFullYear()===now.getFullYear()&&f.getMonth()===now.getMonth();
  if(p==='prev'){const d=new Date(now.getFullYear(),now.getMonth()-1,1);return f.getFullYear()===d.getFullYear()&&f.getMonth()===d.getMonth();}
  if(p==='3m'){const d=new Date(now.getFullYear(),now.getMonth()-2,1);return f>=d;}
  if(p==='año')return f.getFullYear()===now.getFullYear();
  return true;}

async function saveRecep(){
  if($('r_reventa')&&$('r_reventa').checked)return saveRecepReventa();

}

function recActiva(codigo){return S.recepciones.find(r=>r.codigo_lote===codigo&&r.estado!=='anulada');}
function kgConsumidoLote(codigo){let s=0;S.producciones.filter(p=>p.estado!=='anulada').forEach(p=>{if(p.loteId===codigo)s+=+p.mpKg||0;(p.lotes||[]).forEach(l=>{if(l.loteId===codigo)s+=+l.kg||0;});});return s;}
function descartadoLote(codigo){return (S.descartes||[]).filter(d=>d.estado!=='anulada'&&d.codigo_lote===codigo).reduce((s,d)=>s+(+d.kg||0),0);}
function acondConsumidoLote(uuid){return (S.acond||[]).filter(a=>a.estado!=='anulada'&&a.recepcionId===uuid).reduce((s,a)=>s+(+a.kgEnt||0),0);}
function ajusteLoteMP(lote){return (S.ajustes||[]).filter(a=>a.estado!=='anulada'&&a.tipo==='mp'&&a.lote===lote).reduce((s,a)=>s+(+a.cantidad||0),0);}
function stockLote(r){const raw=(+r.kilos||0)-kgConsumidoLote(r.codigo_lote)-descartadoLote(r.codigo_lote)-acondConsumidoLote(r.id)+ajusteLoteMP(r.codigo_lote);return raw<0.1?0:raw;}
function lotesConStock(){return S.recepciones.filter(r=>r.estado!=='anulada'&&stockLote(r)>0.001).sort((a,b)=>a.fecha<b.fecha?-1:1);}
function mpConStock(){return [...new Set(lotesConStock().map(r=>r.materia_prima).filter(Boolean))].sort();}
function mpConStockOpts(){return mpConStock().map(m=>{const rec=(S.materiasPrimas||[]).find(x=>(x.nombre||'').toUpperCase()===m.toUpperCase());const label=rec&&rec.codigo?`[${rec.codigo}] ${m}`:m;return `<option value="${esc(m)}">${esc(label)}</option>`;}).join('');}
function loteOptsFiltrado(filter){const f=(filter||'').trim().toUpperCase();const ls=lotesConStock().filter(r=>!f||(r.materia_prima||'').toUpperCase().includes(f));return '<option value="">— elegí un lote —</option>'+ls.map(r=>{const _m=(S.materiasPrimas||[]).find(x=>(x.nombre||'').toUpperCase()===(r.materia_prima||'').toUpperCase());const _lbl=_m&&_m.codigo?`[${_m.codigo}] ${r.materia_prima}`:r.materia_prima;return `<option value="${r.codigo_lote}">${r.codigo_lote} · ${_lbl} · ${nf(stockLote(r),1)}kg disp.</option>`;}).join('');}
function ppFilterLotes(){const el=$('pp_lote');if(el)el.innerHTML=loteOptsFiltrado($('pp_mpf')?$('pp_mpf').value:'');}
function acFilterLotes(){const el=$('ac_lote');if(el)el.innerHTML=loteOptsFiltrado($('ac_mpf')?$('ac_mpf').value:'');}
function lotesDeMP(mp){return S.recepciones.filter(r=>r.estado!=='anulada'&&(r.materia_prima||'').toUpperCase()===(mp||'').toUpperCase()&&stockLote(r)>0.001).sort((a,b)=>a.fecha<b.fecha?-1:1);}
function loteNum(r){const m=(''+((r&&r.codigo_lote)||'')).match(/(\d+)/);return m?+m[1]:0;}
function recAntes(x,r){if((x.fecha||'')<(r.fecha||''))return true;if((x.fecha||'')>(r.fecha||''))return false;if(x.created_at&&r.created_at)return x.created_at<r.created_at;return loteNum(x)<loteNum(r);}
function lotesAnteriores(r){return S.recepciones.filter(x=>x.estado!=='anulada'&&x.codigo_lote!==r.codigo_lote&&(x.materia_prima||'').toUpperCase()===(r.materia_prima||'').toUpperCase()&&recAntes(x,r)&&stockLote(x)>0.001).sort((a,b)=>recAntes(a,b)?-1:1);}
function eligibleProds(mp){return S.productos.filter(p=>(p.tipo||'simple')==='simple'&&(S.prodMP[p.nombre]||[]).some(x=>(x||'').toUpperCase()===(mp||'').toUpperCase()));}
function horasEntre(ini,fin){if(!ini||!fin)return 0;const[h1,m1]=ini.split(':').map(Number),[h2,m2]=fin.split(':').map(Number);let d=(h2*60+m2)-(h1*60+m1);if(d<0)d+=1440;return d/60;}

function acScan(){const i=$('ac_scan'),sel=$('ac_lote');if(!i||!sel)return;const _mpf=$('ac_mpf');if(_mpf)_mpf.value='';sel.innerHTML=loteOptsFiltrado('');let v=(i.value||'').trim();if(!v)return;try{const o=JSON.parse(v);v=o.lote||o.op||v;}catch(e){}v=fixCode(v);const nv=normCode(v);const opt=[...sel.options].find(o=>o.value&&normCode(o.value)===nv);if(opt){sel.value=opt.value;i.value='';acPick();}else banner('No encontré el lote '+v+' con stock','warn');}

function sugProdPelado(mat){mat=(mat||'').toUpperCase();if(mat.includes('CHOCLO'))return 'CHOCLO PELADO';return (mat.replace(' CON CHALA','')+' ACONDICIONADO').trim();}
function acMatBase(mat){let s=(mat||'').toUpperCase().replace(' CON CHALA','').replace(' SUCIO','').replace(' SUCIA','').trim();s=s.replace(/\b(PELADO|PELADA|LAVADO|LAVADA|CORTADO|CORTADA|DESGRANADO|DESGRANADA|SELECCIONADO|SELECCIONADA|ACONDICIONADO|ACONDICIONADA|Y)\b/g,'').replace(/\s+/g,' ').trim();return s;}
function acWords(proc){proc=(proc||'').toLowerCase();if(proc.includes('pel'))return 'PELADO';if(proc.includes('desgran'))return 'DESGRANADO';if(proc.includes('lav'))return 'LAVADO';if(proc.includes('cort'))return 'CORTADO';if(proc.includes('selec')&&proc.includes('lav'))return 'SELECCIONADO Y LAVADO';if(proc.includes('selec'))return 'SELECCIONADO';return 'ACONDICIONADO';}
function sugProcAcond(mat){mat=(mat||'').toUpperCase();if(mat.includes('CHOCLO'))return 'Pelado';if(mat.includes('ARVEJA'))return 'Desgranado';return 'Lavado';}
function sugProdAcond(mat,proc){return (acMatBase(mat)+' '+acWords(proc)).trim();}
function sugProdOpts(mat){const b=acMatBase(mat);return ['PELADO','LAVADO','CORTADO','DESGRANADO'].map(w=>'<option>'+esc(b+' '+w)+'</option>').join('');}
function acProdSug(){const el=$('ac_prodsal');if(!el||el.dataset.t)return;const proc=$('ac_proc')?$('ac_proc').value:'';el.value=sugProdAcond(window._acMat||'',proc);}
function acCajasCalc(){const c=+($('ac_cajent')?$('ac_cajent').value:0)||0;const kgc=window._acKgCaja||0;if(kgc>0&&$('ac_kgent')){$('ac_kgent').value=+(c*kgc).toFixed(2);acCalc();}}
function acCalc(){const ent=+$('ac_kgent').value||0,sal=+$('ac_kgsal').value||0;const el=$('ac_calc');if(!el)return;const merma=Math.max(0,ent-sal);const rinde=ent>0?sal/ent*100:0;
  if(sal>ent){el.innerHTML=`<span style="color:var(--clay)">⚠️ Los kg obtenidos no pueden superar los kg procesados.</span>`;return;}
  el.innerHTML=ent&&sal?`Merma (chala): <b>${nf(merma,1)} kg</b> · Rinde del pelado: <b>${nf(rinde,1)}%</b>`:'Ingresá kg procesados y kg obtenidos.';}
function rootLote(code){const i=(code||'').indexOf('·');return i>=0?code.slice(0,i):(code||'');}
async function recalcPeladoRec(recSalId){const acs=(S.acond||[]).filter(a=>a.estado!=='anulada'&&a.recSalId===recSalId);let kilos=0,cajas=0,total=0;acs.forEach(a=>{kilos+=+a.kgSal||0;cajas+=+a.cajasSal||0;total+=(+a.kgEnt||0)*adjPriceKg(a.materia||'');});kilos=+kilos.toFixed(3);total=+total.toFixed(2);const precio=kilos>0?+(total/kilos).toFixed(4):0;await sb.from('recepciones').update({kilos,cajas,total,precio_kilo:precio}).eq('id',recSalId).eq('empresa_id',S.empresaId);}
async function genAcond(){
  const cl=$('ac_lote').value;const r=S.recepciones.find(x=>x.codigo_lote===cl);if(!r)return banner('Elegí un lote','warn');
  const ent=+$('ac_kgent').value||0,sal=+$('ac_kgsal').value||0,proc=$('ac_proc').value.trim()||'Pelado';
  const prodSal=$('ac_prodsal').value.trim();const cajas=+$('ac_cajas').value||0,op=+$('ac_op').value||0,hs=+$('ac_hs').value||0,fecha=$('ac_fecha').value;
  if(ent<=0||sal<=0)return banner('Cargá los kg procesados y obtenidos','warn');
  if(sal>ent)return banner('Los kg obtenidos no pueden superar los procesados','warn');
  if(ent>stockLote(r)+0.001)return banner('No hay tantos kg disponibles en el lote','warn');
  if(!prodSal)return banner('Indicá el producto resultante (ej: CHOCLO PELADO)','warn');
  // Opción A: el lote pelado hereda el costo total de los kg entrados, absorbido en los kg de salida
  const costoEntrada=ent*adjPriceKg(r.materia_prima);
  const precioSal=sal>0?+(costoEntrada/sal).toFixed(4):0;
  $('ac_gen').innerHTML='<span class="spin"></span>Registrando...';$('ac_gen').disabled=true;
  try{
    const {data:numA,error:e1}=await sb.rpc('siguiente_numero',{p_tipo:'acond'});if(e1)throw e1;
    const codigo='AC-'+pad(numA);
    // ¿ya hay un lote pelado del MISMO lote de MP y mismo producto? → agrupar (sumar stock)
    const prodKey=prodSal.trim().toUpperCase();
    const prev=(S.acond||[]).find(a=>a.estado!=='anulada'&&a.recepcionId===r.id&&(a.prodSal||'').trim().toUpperCase()===prodKey&&a.recSalId&&recByUuid(a.recSalId));
    let loteSal,recSalId,nuevoLote=false;
    if(prev){loteSal=prev.loteSal;recSalId=prev.recSalId;}
    else{nuevoLote=true;const _root=rootLote(r.codigo_lote);let _mx=0;S.recepciones.forEach(x=>{if(x.origen==='acondicionamiento'&&rootLote(x.codigo_lote)===_root){const _i=x.codigo_lote.lastIndexOf('·');const _n=_i>=0?(parseInt(x.codigo_lote.slice(_i+1))||0):0;if(_n>_mx)_mx=_n;}});loteSal=_root+'·'+(_mx+1);const {data:recSal,error:e3}=await sb.from('recepciones').insert({empresa_id:S.empresaId,codigo_lote:loteSal,fecha,proveedor:'ACOND · '+r.codigo_lote,materia_prima:prodSal,cajas,kilos:sal,precio_kilo:precioSal,total:+(sal*precioSal).toFixed(2),recibido_por:S.nombre,estado:'activa',origen:'acondicionamiento'}).select('id').single();if(e3)throw e3;recSalId=recSal.id;}
    const {data:acRow,error:e4}=await sb.from('acondicionamientos').insert({empresa_id:S.empresaId,codigo,fecha,recepcion_id:r.id,materia_prima:r.materia_prima,proceso:proc,kg_entrada:ent,kg_salida:sal,cajas_salida:cajas,producto_salida:prodSal,lote_salida:loteSal,recepcion_salida_id:recSalId,operarios:op,horas:hs,estado:'activa'}).select('id').single();if(e4)throw e4;
    if(nuevoLote)await sb.from('recepciones').update({acond_id:acRow.id}).eq('id',recSalId).eq('empresa_id',S.empresaId);
    await reloadRecepciones();await reloadAcond();
    await recalcPeladoRec(recSalId);
    await reloadRecepciones();
    const d={codigo,loteSal,prodSal,sal,ent};
    banner(prev?('Acond. '+codigo+' sumado al lote pelado '+loteSal):('Acondicionamiento '+codigo+' · lote '+loteSal+' generado'),'');
    render();labelLoteRec(loteSal);
  }catch(err){banner('Error: '+err.message,'err');$('ac_gen').innerHTML='🌽 Registrar acondicionamiento';$('ac_gen').disabled=false;}
}
async function anularAcond(codigo){const a=(S.acond||[]).find(x=>x.id===codigo);if(!a)return;
  const rSal=recByUuid(a.recSalId);
  if(rSal&&stockLote(rSal)<a.kgSal-0.001)return modal(`<h3>No se puede anular ${codigo}</h3><p class="hint">El lote pelado <b>${a.loteSal}</b> ya se usó (total o parcialmente) en una producción. Anulá primero esa producción.</p><div class="row"><button class="btn btn-gold" onclick="closeModal()">Entendido</button></div>`);
  modal(`<h3>🔒 Anular acondicionamiento ${codigo}</h3><p class="hint">Se libera el stock del lote original y se descuenta esta operación del lote pelado <b>${a.loteSal}</b> (la parte no usada).</p><label>PIN de supervisor</label><input type="password" id="aca_pin" autocomplete="off"><div class="row"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-danger" onclick="doAnularAcond('${codigo}')">Anular</button></div>`);}
async function doAnularAcond(codigo){const a=(S.acond||[]).find(x=>x.id===codigo);if(!a)return;
  if(!authOK($('aca_pin').value,'anular_acondicionamiento',codigo,'Anulación de acondicionamiento'))return;
  try{
    await sb.from('acondicionamientos').update({estado:'anulada'}).eq('empresa_id',S.empresaId).eq('id',a.uuid);
    await reloadAcond();
    if(a.recSalId){const others=(S.acond||[]).filter(x=>x.estado!=='anulada'&&x.recSalId===a.recSalId);if(others.length){await recalcPeladoRec(a.recSalId);}else{await sb.from('recepciones').update({estado:'anulada'}).eq('empresa_id',S.empresaId).eq('id',a.recSalId);}}
    await reloadRecepciones();await reloadAcond();closeModal();banner('Acondicionamiento anulado','warn');render();
  }catch(err){banner('Error: '+err.message,'err');}
}

function alocarPEPS(mp,kgNec){const lots=lotesDeMP(mp);const out=[];let rem=kgNec;for(const l of lots){const av=stockLote(l);if(av<=0)continue;const take=Math.min(av,rem);if(take<=0)break;out.push({recepcionUuid:l.id,codigo_lote:l.codigo_lote,fecha:l.fecha,mp,kg:+take.toFixed(3)});rem-=take;if(rem<=0.001)break;}return {asign:out,falta:Math.max(0,rem)};}
function onCompChange(){
  const nombre=$('cp_prod').value;const panel=$('cp_panel');if(!nombre){panel.innerHTML='';return;}
  const receta=S.recetas[nombre]||[];window._comp={nombre:nombre,receta:receta,alloc:{}};
  if(!receta.length){panel.innerHTML='<div class="note" style="margin:8px 0">Este producto no tiene receta cargada. Cargá los componentes en <b>Configuración &rarr; Productos &rarr; Editar</b> (sección Componentes).</div>';return;}
  panel.innerHTML=`<label>Paquetes a producir (estimado)</label><input type="number" id="cp_paq" step="1" min="1" placeholder="ej: 100" oninput="cpReqRender()">
   <div id="cp_alloc" style="margin-top:10px"></div>
   <div class="note" style="margin:6px 0;padding:8px 10px;font-size:12px">Por cada componente elegí el/los lote(s) y tipeá los <b>kilos reales a procesar</b> (libre). <b>&#8635; Sugerir PEPS</b> propone kg = paquetes × receta, pero podés cambiarlos. La diferencia entre kilos procesados y kilos en los paquetes queda como <b>merma</b>.</div>
   <div class="g2"><div><label>Operarios</label><input type="number" id="cp_oper" min="1"></div><div><label>Hora inicio</label><input type="time" id="cp_ini"></div></div>
   <div class="g2"><div><label>Hora fin</label><input type="time" id="cp_fin"></div><div></div></div>
   <button class="btn btn-gold" id="cp_save" style="width:100%;margin-top:14px" onclick="saveCompuesto()">Abrir producción</button>`;
  cpReqRender();
}
function cpReq(mp){const paq=+($('cp_paq')?$('cp_paq').value:0)||0;const r=(window._comp.receta||[]).find(x=>x.mp===mp);return paq*((r&&r.cantidad)||0);}
function cpReqRender(){const st=window._comp;if(!st)return;st.receta.forEach(r=>{if(st.alloc[r.mp]===undefined&&cpReq(r.mp)>0){st.alloc[r.mp]=alocarPEPS(r.mp,cpReq(r.mp)).asign.map(x=>({lote:x.codigo_lote,kg:x.kg}));}});cpDraw();}
function cpDraw(){const st=window._comp;if(!st)return;const w=$('cp_alloc');if(w)w.innerHTML=st.receta.map((r,ci)=>cpCompBlock(ci)).join('');}
function cpMp(ci){return window._comp.receta[ci].mp;}
function cpCompBlock(ci){const st=window._comp;const mp=st.receta[ci].mp;const req=cpReq(mp);const rows=st.alloc[mp]||[];const alloc=rows.reduce((a,x)=>a+(+x.kg||0),0);const lots=lotesDeMP(mp);const opt=sel=>`<option value="">— elegí lote —</option>`+lots.map(l=>`<option value="${l.codigo_lote}" ${sel===l.codigo_lote?'selected':''}>${l.codigo_lote} · ${fmtD(l.fecha)} · ${nf(stockLote(l),1)}kg</option>`).join('')+((sel&&!lots.some(l=>l.codigo_lote===sel))?`<option value="${sel}" selected>${sel} (sin stock)</option>`:'');
  return `<div style="border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px"><div style="display:flex;justify-content:space-between;align-items:center;font-size:13px"><b>${esc(mp)}</b> <span class="mono" style="color:var(--steel)">${nf(alloc,2)} kg${req>0?` · sug. ~${nf(req,2)}`:''}</span></div>${rows.map((x,i)=>`<div class="g2" style="grid-template-columns:1.6fr .7fr auto;align-items:center;margin-top:6px"><select onchange="cpSet(${ci},${i},'lote',this.value)">${opt(x.lote)}</select><input type="number" min="0" step="0.01" value="${x.kg||''}" placeholder="kg" onchange="cpSet(${ci},${i},'kg',this.value)"><button class="btn btn-danger btn-sm" onclick="cpDel(${ci},${i})">✕</button></div>`).join('')||'<div class="scan-note" style="margin-top:4px">Sin lotes. Agregá uno o usá Sugerir PEPS.</div>'}<div style="margin-top:6px;display:flex;gap:6px"><button class="btn btn-ghost btn-sm" onclick="cpAdd(${ci})">+ Otro lote</button><button class="btn btn-ghost btn-sm" onclick="cpSeed(${ci})">&#8635; Sugerir PEPS</button></div></div>`;
}
function cpSet(ci,i,f,v){const st=window._comp;const mp=cpMp(ci);if(!st.alloc[mp]||!st.alloc[mp][i])return;st.alloc[mp][i][f]=(f==='kg')?(+v||0):v;cpDraw();}
function cpAdd(ci){const st=window._comp;const mp=cpMp(ci);st.alloc[mp]=st.alloc[mp]||[];st.alloc[mp].push({lote:'',kg:0});cpDraw();}
function cpDel(ci,i){const st=window._comp;const mp=cpMp(ci);(st.alloc[mp]||[]).splice(i,1);cpDraw();}
function cpSeed(ci){const st=window._comp;const mp=cpMp(ci);st.alloc[mp]=alocarPEPS(mp,cpReq(mp)).asign.map(x=>({lote:x.codigo_lote,kg:x.kg}));cpDraw();}
async function saveCompuesto(){const st=window._comp;if(!st)return;const nombre=st.nombre;const paq=Math.round(+($('cp_paq')?$('cp_paq').value:0)||0);if(!paq)return banner('Indicá la cantidad de paquetes','warn');
  const comps=[];
  for(const r of st.receta){const rows=(st.alloc[r.mp]||[]).filter(x=>x.lote&&x.kg>0);
    if(!rows.length)return banner('Asigná lote y kilos para '+r.mp,'warn');
    for(const x of rows){const rec=recById(x.lote);if(!rec)return banner('Lote no encontrado: '+x.lote,'warn');if(+x.kg>stockLote(rec)+0.01)return banner('El lote '+x.lote+' no tiene '+nf(x.kg,2)+'kg disponibles','warn');comps.push({recepcionUuid:rec.id,codigo_lote:x.lote,mp:r.mp,kg:+(+x.kg).toFixed(3)});}
  }
  if(!comps.length)return banner('Asigná al menos un lote por componente','warn');
  $('cp_save').innerHTML='<span class="spin"></span>Guardando...';$('cp_save').disabled=true;
  try{
    const {data:opNum,error:e1}=await sb.rpc('siguiente_numero',{p_tipo:'op'});if(e1)throw e1;
    const codigoOp='P-'+pad(opNum);const totalKg=comps.reduce((a,c)=>a+c.kg,0);
    const ini=$('cp_ini').value,fin=$('cp_fin').value;
    const {data:prodRow,error:e2}=await sb.from('producciones').insert({empresa_id:S.empresaId,codigo_op:codigoOp,recepcion_id:null,fecha:today(),mp_kg:totalKg,operarios:+$('cp_oper').value||0,hora_inicio:ini||null,hora_fin:fin||null,horas:horasEntre(ini,fin),estado:'abierta'}).select('id').single();if(e2)throw e2;
    const {data:pn}=await sb.rpc('siguiente_numero',{p_tipo:'prod'});
    const {error:e3}=await sb.from('produccion_outputs').insert({empresa_id:S.empresaId,produccion_id:prodRow.id,codigo_prod:'PR-'+pad(pn),producto_nombre:nombre,cantidad:paq,kilos:+(paq*(prodKg(nombre)||0)).toFixed(3)});if(e3)throw e3;
    const {error:e4}=await sb.from('produccion_lotes').insert(comps.map(c=>({empresa_id:S.empresaId,produccion_id:prodRow.id,recepcion_id:c.recepcionUuid,codigo_lote:c.codigo_lote,materia_prima:c.mp,kg:c.kg})));if(e4)throw e4;
    await reloadProducciones();banner('Compuesto '+codigoOp+' abierto','');go('prod');
  }catch(err){banner('Error: '+err.message,'err');$('cp_save').innerHTML='Abrir producción';$('cp_save').disabled=false;}
}
function prodHorasAbierta(p){const base=p.createdAt||(p.fecha?p.fecha+'T00:00:00':null);if(!base)return 0;const ms=Date.now()-new Date(base).getTime();return ms>0?ms/3600000:0;}
function prodsAbiertasViejas(){return S.producciones.filter(p=>p.estado==='abierta'&&prodHorasAbierta(p)>=24).sort((a,b)=>prodHorasAbierta(b)-prodHorasAbierta(a));}
function anularProdAsk(codigo){const p=S.producciones.find(x=>x.id===codigo);if(!p)return;modal(`<h3>🔒 Anular producción ${codigo}</h3><p class="hint">Se libera la materia prima consumida y desaparecen del stock los productos generados. Los insumos consumidos se restituyen. Requiere PIN del supervisor.</p><label>Motivo</label><input id="anp_mot" placeholder="ej: abierta por error / duplicada"><label>PIN de supervisor</label><input type="password" id="anp_pin" autocomplete="off"><div class="row"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-danger" id="anp_save" onclick="doAnularProd('${codigo}')">Anular</button></div>`);}
async function doAnularProd(codigo){const p=S.producciones.find(x=>x.id===codigo);if(!p)return;if(!authOK($('anp_pin').value,'anular_produccion',codigo,'Anulación de producción · '+($('anp_mot')?$('anp_mot').value.trim():'')))return;const b=$('anp_save');if(b){b.innerHTML='<span class="spin"></span>...';b.disabled=true;}try{const {error}=await sb.from('producciones').update({estado:'anulada'}).eq('empresa_id',S.empresaId).eq('id',p.uuid);if(error)throw error;await restaurarInsumos(codigo);await reloadProducciones();await reloadInsumos();closeModal();banner(codigo+' anulada · stock liberado','warn');render();}catch(err){banner('Error: '+err.message,'err');const b2=$('anp_save');if(b2){b2.innerHTML='Anular';b2.disabled=false;}}}
function prodReportRows(){const rows=[];S.producciones.filter(p=>p.estado!=='anulada'&&enPeriodo(p.fecha,'prod')).forEach(p=>{const li=loteInfoDeProd(p);(p.outputs||[]).forEach(o=>{rows.push({producto:o.producto,lote:li.lote,op:p.id,fecha:p.fecha,cant:+o.cantidad||0,kilos:+o.kilos||0,estado:p.estado});});});return rows;}
function exportProdDia(){const rows=prodReportRows();if(!rows.length)return banner('No hay producción en el período','warn');const out=[['Codigo','Producto','Lote','OP','Fecha','Paquetes','Kilos','Estado']].concat(rows.map(r=>[artCod(r.producto),r.producto,r.lote,r.op,r.fecha,r.cant,r.kilos,r.estado==='validada'?'Cerrada':'Abierta']));dlCSV('produccion_'+today()+'.csv',out);}
function printProdDia(){const rows=prodReportRows();if(!rows.length)return banner('No hay producción en el período','warn');const e=S.empresa;const byP={},ord=[];rows.forEach(r=>{if(!(r.producto in byP)){byP[r.producto]=[];ord.push(r.producto);}byP[r.producto].push(r);});ord.sort();let totC=0,totK=0,body='';ord.forEach(pr=>{const list=byP[pr].slice().sort((a,b)=>(a.fecha<b.fecha?-1:a.fecha>b.fecha?1:0)||(a.lote<b.lote?-1:1));let sc=0,sk=0;list.forEach(r=>{sc+=r.cant;sk+=r.kilos;totC+=r.cant;totK+=r.kilos;body+=`<tr><td class="mono">${esc(artCod(r.producto))}</td><td>${esc(r.producto)}</td><td>${esc(r.lote)}</td><td>${esc(r.op)}</td><td>${fmtD(r.fecha)}</td><td class="mono" style="text-align:right">${nf(r.cant)}</td><td class="mono" style="text-align:right">${nf(r.kilos,1)}</td><td>${r.estado==='validada'?'Cerrada':'Abierta'}</td></tr>`;});body+=`<tr style="font-weight:700;background:#f0ece2"><td colspan="5">Subtotal ${esc(pr)}</td><td class="mono" style="text-align:right">${nf(sc)}</td><td class="mono" style="text-align:right">${nf(sk,1)}</td><td></td></tr>`;});modal(`<h3>Reporte de producción</h3><p class="hint">Producción del período seleccionado, agrupada por producto y lote. Podés imprimir o exportar a Excel/CSV.</p><div id="lblArea"><div class="remito"><div class="rh"><div style="display:flex;gap:10px;align-items:center;font-size:11px">${empLogo()?`<img class="rlogo" src="${empLogo()}">`:''}<div><b>${e.razon_social||''}</b><br>Reporte de producción</div></div><div class="rtitle">PRODUCCIÓN<br><span style="font-size:12px">${rows.length} línea(s)</span></div><div style="text-align:right;font-size:10px">Generado: <b>${fmtD(today())}</b><br>Paquetes: <b>${nf(totC)}</b> · Kg: <b>${nf(totK,1)}</b></div></div><table style="font-size:9px"><thead><tr><th>Cód.</th><th>Producto</th><th>Lote</th><th>OP</th><th>Fecha</th><th style="text-align:right">Paquetes</th><th style="text-align:right">Kg</th><th>Estado</th></tr></thead><tbody>${body}<tr style="font-weight:700;border-top:2px solid #000"><td colspan="5">TOTAL GENERAL</td><td class="mono" style="text-align:right">${nf(totC)}</td><td class="mono" style="text-align:right">${nf(totK,1)}</td><td></td></tr></tbody></table><div class="rspacer"></div><div class="obs"><b>Observaciones:</b></div></div></div><div class="row"><button class="btn btn-ghost" onclick="closeModal()">Cerrar</button><button class="btn btn-ghost" onclick="exportProdDia()">⬇ Exportar Excel/CSV</button><button class="btn btn-gold" onclick="printDoc('A4')">🖨️ Imprimir / PDF</button></div>`);}
function prodNamesProducidos(){return [...new Set(S.producciones.flatMap(p=>(p.outputs||[]).map(o=>o.producto)).filter(Boolean))].sort();}
function prodApplyFilt(){window._prodFilt={prod:$('pf_prod')?$('pf_prod').value:'',lote:$('pf_lote')?$('pf_lote').value:''};const tb=$('prodTbody');if(tb)tb.innerHTML=prodRows();}
function prodRows(){const F=window._prodFilt||{prod:'',lote:''};const fp=(F.prod||'').trim().toUpperCase();const fl=normCode((F.lote||'').trim());return S.producciones.filter(p=>{if(!enPeriodo(p.fecha,'prod'))return false;if(fp){const names=[...new Set((p.outputs||[]).map(o=>o.producto))].join(' ').toUpperCase();if(!names.includes(fp))return false;}if(fl){const codes=[normCode(p.loteId),normCode(p.id)].concat((p.lotes||[]).map(l=>normCode(l.loteId)));if(!codes.some(c=>c&&c.includes(fl)))return false;}return true;}).slice(0,300).map(p=>{const paq=p.outputs.reduce((a,o)=>a+(+o.cantidad||0),0);const hAb=p.estado==='abierta'?prodHorasAbierta(p):0;const vieja=hAb>=24;const abTag=vieja?`<span style="background:#fbe1dd;color:#a3341f;padding:2px 9px;border-radius:20px">⚠️ Abierta ${Math.floor(hAb)}h</span>`:`<span style="background:var(--amber-bg);color:#86571a;padding:2px 9px;border-radius:20px">Abierta</span>`;const est=p.estado==='anulada'?['out','Anulada']:p.estado==='validada'?['ok','Validada 🔒']:['',abTag];return`<tr style="${p.estado==='anulada'?'opacity:.5':(vieja?'background:#fdecea':'')}"><td class="mono">${p.id}</td><td>${fmtD(p.fecha)}</td><td style="max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc([...new Set(p.outputs.map(o=>o.producto))].join(', '))}">${esc([...new Set(p.outputs.map(o=>o.producto))].join(', ')||'—')}</td><td class="mono">${p.loteId}</td><td class="mono">${nf(p.mpKg,1)}</td><td class="mono">${nf(paq)}</td><td>${p.estado==='abierta'?est[1]:`<span class="tag ${est[0]}">${est[1]}</span>`}</td><td style="white-space:nowrap"><button class="btn btn-ghost btn-sm" onclick="detalleOP('${p.id}')">🔍</button> <button class="btn btn-ghost btn-sm" onclick="editProd('${p.id}')">✎</button>${p.estado==='abierta'?` <button class="btn btn-gold btn-sm" onclick="validarProd('${p.id}')">✓</button>`:''}${p.estado!=='anulada'?` <button class="btn btn-danger btn-sm" onclick="anularProdAsk('${p.id}')" title="Anular">✕</button>`:''}</td></tr>`;}).join('')||'<tr><td colspan=8 class=empty>Sin producciones para el período / filtro</td></tr>';}
function recMP(codigo){const r=S.recepciones.find(x=>x.codigo_lote===codigo);return r?r.materia_prima:'MP';}
function detalleOP(codigo){
  const p=S.producciones.find(x=>x.id===codigo);if(!p)return;
  const paq=p.outputs.reduce((a,o)=>a+(+o.cantidad||0),0);
  const consumo=(p.lotes&&p.lotes.length)?p.lotes.map(l=>`· ${l.mp}: <b>${nf(l.kg,3)}kg</b> del lote ${l.loteId}`).join('<br>'):`· ${recMP(p.loteId)}: <b>${nf(p.mpKg,1)}kg</b> del lote ${p.loteId||'—'}`;
  const kgOut=p.outputs.reduce((a,o)=>a+(+o.kilos||0),0);
  const merma=Math.max(0,p.mpKg-kgOut);
  const rend=p.mpKg>0?kgOut/p.mpKg*100:0;
  const hh=(p.operarios>0&&p.horas>0)?`${p.operarios} operarios · ${nf(p.horas,2)}h = ${nf(p.operarios*p.horas,1)} horas-hombre · ${nf(paq/(p.operarios*p.horas),1)} paq/h-h`:'sin datos de horas';
  const est=p.estado==='validada'?['ok','Validada 🔒']:p.estado==='anulada'?['out','Anulada']:['','Abierta'];
  modal(`<h3>Detalle de ${codigo}</h3>
   <div style="display:flex;gap:12px;align-items:center;font-size:13px;margin-bottom:10px"><span class="tag ${est[0]}">${est[1]}</span><span style="color:var(--muted)">${fmtD(p.fecha)}</span></div>
   <div style="font-size:13px;line-height:1.8">
     <b>Materia prima consumida</b><br>${consumo}<br><br>
     <b>Productos resultantes</b><br>${p.outputs.map(o=>`· ${o.producto}: <b>${nf(o.cantidad)} paquetes</b> (${nf(o.kilos,1)}kg) · cód. ${o.code}`).join('<br>')||'— (sin completar)'}<br><br>
     <b>Producto obtenido:</b> ${nf(kgOut,1)}kg de ${nf(p.mpKg,1)}kg de MP<br>
     <b>Merma:</b> ${nf(merma,1)}kg (${nf(p.mpKg>0?merma/p.mpKg*100:0,0)}% de la materia prima)<br>
     <b>Rendimiento:</b> ${nf(rend,0)}% (kilos de producto sobre kilos de MP)<br>
     <b>Mano de obra:</b> ${hh}
   </div>
   <div class="row"><button class="btn btn-ghost" onclick="closeModal()">Cerrar</button></div>`);
}

/* Normaliza códigos escaneados: tolera lectores con distribución de teclado
   distinta (que escriben L'00017 o L/00017 en vez de L-00017). */
function normCode(s){return (s||'').toString().toUpperCase().replace(/[^A-Z0-9]/g,'');}
function fixCode(s){return (s||'').toString().trim().toUpperCase().replace(/[^A-Z0-9]+/g,'-').replace(/^-+|-+$/g,'');}
function prodScan(){
  const i=$('pp_scan'),msg=$('pp_scanmsg'),sel=$('pp_lote');if(!i||!sel)return;const _mpf=$('pp_mpf');if(_mpf)_mpf.value='';sel.innerHTML=loteOptsFiltrado('');
  let v=(i.value||'').trim();if(!v){if(msg)msg.innerHTML='Escaneá o tipeá un código de lote.';return;}
  try{const o=JSON.parse(v);v=o.lote||o.op||v;}catch(e){}
  v=fixCode(v);const nv=normCode(v);
  const opt=[...sel.options].find(o=>o.value&&normCode(o.value)===nv);
  if(opt){sel.value=opt.value;i.value='';if(msg)msg.innerHTML=`✓ Lote <b>${opt.value}</b> cargado.`;onLoteChange();return;}
  const r=S.recepciones.find(x=>normCode(x.codigo_lote)===nv);
  if(msg){
    if(r&&r.estado==='anulada')msg.innerHTML=`⚠️ El lote <b>${v}</b> está anulado: no se puede procesar.`;
    else if(r)msg.innerHTML=`⚠️ El lote <b>${v}</b> ya no tiene stock disponible en cámara.`;
    else msg.innerHTML=`⚠️ No encontré el lote <b>${v}</b>. Verificá que sea una etiqueta de lote (L-…).`;
  }
  i.select();
}
function onLoteChange(){
  const codigo=$('pp_lote').value;const panel=$('pp_panel');if(!codigo){panel.innerHTML='';return;}
  const r=recActiva(codigo);const st=stockLote(r);
  const ant=lotesAnteriores(r);
  const fefo=ant.length?`<div class="note" style="margin:12px 0"><b>⚠️ Atención — PEPS (primero entra, primero sale)</b><br>Hay lotes de ${r.materia_prima} con ingreso anterior y stock: ${ant.map(x=>`<b>${x.codigo_lote}</b> (${fmtD(x.fecha)}, ${nf(stockLote(x),1)}kg)`).join(', ')}. Lo recomendado es procesar primero el más antiguo. Para procesar este igual, el supervisor autoriza con PIN.</div>`:'';
  window._eligOpts=(function(){const elig=eligibleProds(r.materia_prima);const simples=S.productos.filter(p=>(p.tipo||'simple')==='simple');const eN=new Set(elig.map(p=>p.nombre));const otros=simples.filter(p=>!eN.has(p.nombre));if(!elig.length)return (simples.length?simples:S.productos).map(p=>`<option>${esc(p.nombre)}</option>`).join('');let h='<optgroup label="Usan '+esc(r.materia_prima)+'">'+elig.map(p=>`<option>${esc(p.nombre)}</option>`).join('')+'</optgroup>';if(otros.length)h+='<optgroup label="Otros productos">'+otros.map(p=>`<option>${esc(p.nombre)}</option>`).join('')+'</optgroup>';return h;})();window._eligArr=(function(){const elig=eligibleProds(r.materia_prima);const simples=S.productos.filter(p=>(p.tipo||'simple')==='simple');const eN=new Set(elig.map(p=>p.nombre));const otros=simples.filter(p=>!eN.has(p.nombre));if(!elig.length)return apArrProd(simples.length?simples:S.productos);return apArrProd(elig.concat(otros));})();window._ppKgCaja=(r.cajas>0)?r.kilos/r.cajas:0;const kgCaja=window._ppKgCaja;const cajasStock=kgCaja>0?st/kgCaja:0;const yaProcesado=((+r.kilos||0)-st)>0.01;
  panel.innerHTML=`${fefo}
   <div style="font-size:13px;color:var(--muted);margin:8px 0">Disponible: <b style="color:var(--steel)">${nf(st,1)} kg</b>${(r.cajas>0&&r.kilos>0)?` (≈ ${nf(st/(r.kilos/r.cajas),1)} cajas)`:''} de ${r.materia_prima}</div>

// ---- DESPACHO Y ETIQUETAS (etiquetar producción, lote real) ----
function prodInfo(nombre){const p=S.productos.find(x=>x.nombre===nombre)||{};return {kg:+p.contenido_kg||0,gtin:p.gtin||'',rnpa:p.rnpa||'',rne:p.rne||'',fam:p.familia||'aizu',micro:!!p.microondas,uxc:+p.unidades_por_caja||1,vida:+p.vida_util_dias||0,muestraCaja:!!p.muestra_caja};}
function remCajasProd(prod,units){const u=prodInfo(prod).uxc||1;return Math.ceil((+units||0)/(u||1));}
function esMuestraCaja(prod){return !!prodInfo(prod).muestraCaja;}
function remBultosMuestra(items){let esp=0,hayNorm=false;const pm={};(items||[]).forEach(it=>{if(!it.producto||!(+it.cantidad>0))return;if(esMuestraCaja(it.producto)){pm[it.producto]=(pm[it.producto]||0)+(+it.cantidad||0);}else{hayNorm=true;}});Object.keys(pm).forEach(k=>{esp+=remCajasProd(k,pm[k]);});return esp+(hayNorm?1:0);}
function addDays(d,n){const x=new Date(d+'T00:00:00');x.setDate(x.getDate()+(+n||0));return x.toISOString().slice(0,10);}
function despachadoDe(code){let s=0;S.despachos.filter(d=>d.estado!=='anulada').forEach(d=>d.items.forEach(it=>(it.consumido||[]).forEach(c=>{if(c.code===code)s+=+c.cantidad||0;})));return s;}
function reingresoPT(code){return (S.devoluciones||[]).filter(d=>d.estado!=='anulada'&&d.tipo==='reingreso_pt'&&d.output_code===code).reduce((s,d)=>s+(+d.cantidad||0),0);}
function ensambladoConsumidoDe(code){return (S.ensConsumos||[]).filter(c=>c.output_code===code).reduce((s,c)=>s+(+c.cantidad||0),0);}
function stockOut(o){return Math.max(0,(+o.cantidad||0));}
function loteDeProd(p){return loteInfoDeProd(p).lote;}
function producidoLote(prod,lote){let s=0;S.producciones.forEach(p=>{if(p.estado!=='validada')return;if(loteDeProd(p)!==lote)return;p.outputs.forEach(o=>{if(o.producto===prod)s+=+o.cantidad||0;});});return s;}
function entregadoLote(prod,lote){let s=0;(S.entregas||[]).forEach(e=>{if(e.estado==='anulada')return;(e.items||[]).forEach(it=>{if(it.producto===prod&&(it.loteRef||'')===lote)s+=+it.cantidad||0;});});return s;}
function reingLote(prod,lote){let s=0;(S.devoluciones||[]).forEach(d=>{if(d.estado==='anulada')return;if(d.tipo==='reingreso_pt'&&d.producto_nombre===prod&&(d.lote_ref||'')===lote)s+=+d.cantidad||0;});return s;}
function ajusteLotePT(prod,lote){return (S.ajustes||[]).filter(a=>a.estado!=='anulada'&&a.tipo==='pt'&&a.item===prod&&a.lote===lote).reduce((s,a)=>s+(+a.cantidad||0),0);}
function stockLoteProd(prod,lote){return Math.max(0,Math.round(producidoLote(prod,lote)+reingLote(prod,lote)-entregadoLote(prod,lote)+ajusteLotePT(prod,lote)));}
function lotesDeProducto(name){const set=new Set();S.producciones.forEach(p=>{if(p.estado==='validada'&&p.outputs.some(o=>o.producto===name))set.add(loteDeProd(p));});(S.entregas||[]).forEach(e=>{if(e.estado!=='anulada')(e.items||[]).forEach(it=>{if(it.producto===name&&it.loteRef)set.add(it.loteRef);});});return [...set];}
function prodByCode(code){for(const p of S.producciones){for(const o of p.outputs){if(o.code===code)return p;}}return null;}
function loteInfoDeProd(p){if(p.lotes&&p.lotes.length){return {lote:p.id,op:p.id,origen:p.lotes.map(l=>`${l.mp} ${l.loteId}`)};}return {lote:p.loteId||p.id,op:p.id,origen:[p.loteId||p.id]};}
function loteDeItem(it){const c=(it.consumido||[])[0];if(!c)return {lote:'—',op:'',origen:[]};const p=prodByCode(c.code);return p?loteInfoDeProd(p):{lote:'—',op:'',origen:[]};}
function lotesDeItem(it){const out=[];(it.consumido||[]).forEach(c=>{const p=prodByCode(c.code);const lo=p?loteInfoDeProd(p).lote:'-';const ex=out.find(x=>x.lote===lo);if(ex)ex.cantidad+=(+c.cantidad||0);else out.push({lote:lo,cantidad:+c.cantidad||0});});return out;}
function labelables(){const out=[];const prodsCerr=[...new Set(S.producciones.filter(p=>p.estado==='validada').flatMap(p=>(p.outputs||[]).map(o=>o.producto)))];prodsCerr.forEach(prod=>{lotesDeProducto(prod).forEach(l=>{const st=stockLoteProd(prod,l);if(st>0.001){const p=S.producciones.find(x=>x.estado==='validada'&&loteDeProd(x)===l&&x.outputs.some(o=>o.producto===prod));const o=p?p.outputs.find(o=>o.producto===prod):null;const li=p?loteInfoDeProd(p):{lote:l,origen:[l]};out.push({kind:'cerrado',op:p?p.id:'',opFecha:p?p.fecha:'',producto:prod,code:o?o.code:'',disp:st,stockReal:st,lote:l,origen:li.origen});}});});S.producciones.filter(p=>p.estado==='abierta').forEach(p=>(p.outputs||[]).forEach(o=>{const li=loteInfoDeProd(p);out.push({kind:'abierto',op:p.id,opFecha:p.fecha,producto:o.producto,code:o.code,disp:+o.cantidad||0,stockReal:0,lote:li.lote,origen:li.origen});}));return out;}
function labResumen(labs){const byP={};labs.forEach(l=>{const g=byP[l.producto]=byP[l.producto]||{cerr:[],abi:[]};(l.kind==='cerrado'?g.cerr:g.abi).push(l);});return byP;}
function labOptions(labs){const byP={};labs.forEach((l,i)=>{(byP[l.producto]=byP[l.producto]||[]).push(Object.assign({_i:i},l));});return Object.keys(byP).sort().map(pr=>{const its=byP[pr];const cerr=its.filter(x=>x.kind==='cerrado');const abi=its.filter(x=>x.kind==='abierto');const stC=cerr.reduce((s,x)=>s+x.disp,0),stA=abi.reduce((s,x)=>s+x.disp,0);let o='';cerr.forEach(x=>{o+=`<option value="${x._i}">[CERRADO] lote ${x.lote} · ${nf(x.disp)} u disponibles</option>`;});abi.forEach(x=>{o+=`<option value="${x._i}">[ABIERTA ${x.op}] lote ${x.lote} · ${nf(x.disp)} u estimadas</option>`;});return `<optgroup label="${esc(pr)} — real ${nf(stC)} u · en producción ${nf(stA)} u">${o}</optgroup>`;}).join('');}
function labStockPanel(labs){const byP=labResumen(labs);const prods=Object.keys(byP).sort();if(!prods.length)return '';const rows=prods.map(pr=>{const g=byP[pr];const cerr=g.cerr.slice().sort((a,b)=>String(a.lote).localeCompare(String(b.lote)));const abi=g.abi.slice().sort((a,b)=>String(a.lote).localeCompare(String(b.lote)));const stC=cerr.reduce((s,x)=>s+x.disp,0),stA=abi.reduce((s,x)=>s+x.disp,0);const cCell=cerr.length?cerr.map(x=>`${esc(x.lote)}: <b>${nf(x.disp)}</b>`).join('<br>'):'<span style="color:var(--muted)">—</span>';const aCell=abi.length?abi.map(x=>`${esc(x.lote)} (${x.op}): <b>${nf(x.disp)}</b>`).join('<br>'):'<span style="color:var(--muted)">—</span>';return `<tr><td><b>${esc(pr)}</b></td><td style="font-size:12px">${cCell}</td><td class="mono" style="text-align:right"><b style="color:var(--sage)">${nf(stC)}</b></td><td style="font-size:12px">${aCell}</td><td class="mono" style="text-align:right"><b style="color:var(--gold)">${nf(stA)}</b></td></tr>`;}).join('');return `<div class="card" style="margin-bottom:16px"><div class="card-h"><h3>Stock por producto y lote</h3></div><p class="hint"><b style="color:var(--sage)">Real (cerrado)</b> = disponible de producciones validadas · <b style="color:var(--gold)">Estimado (abierto)</b> = a producir en producciones sin cerrar. Sirve para saber cuántas etiquetas imprimir con seguridad.</p><div style="overflow:auto"><table><thead><tr><th>Producto</th><th>Lotes con stock real</th><th style="text-align:right">Real</th><th>Lotes en producción</th><th style="text-align:right">Estimado</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;}

    if(e.pedido_codigo){const pp=S.pedidos.find(x=>x.id===e.pedido_codigo);if(pp)await sb.from('pedidos').update({estado:'pendiente',numero_remito:null}).eq('empresa_id',S.empresaId).eq('id',pp.uuid);}
    await reloadEntregas();await reloadPedidos();await reloadDespachos();closeModal();banner('Remito '+e.numero_remito+' anulado · lotes liberados','warn');render();
  }catch(err){banner('Error: '+err.message,'err');$('ae_save').innerHTML='Anular remito';$('ae_save').disabled=false;}}
function reactivarEntrega(id){const e=S.entregas.find(x=>x.id===id);if(!e)return;if(e.estado!=='anulada')return banner('El remito no está anulado','warn');const byLote={};(e.items||[]).forEach(it=>{const k=it.producto+'||'+(it.loteRef||'');byLote[k]=(byLote[k]||0)+(+it.cantidad||0);});const faltan=[];for(const k in byLote){const i=k.indexOf('||');const pr=k.slice(0,i),lo=k.slice(i+2);const disp=stockLoteProd(pr,lo);if(byLote[k]>disp+0.001)faltan.push(pr+' lote '+lo+' — pide '+nf(byLote[k])+', hay '+nf(disp));}if(faltan.length)return modal('<h3>No se puede reactivar '+e.numero_remito+'</h3><p class="hint">No hay stock suficiente para volver a descontar:<br>'+faltan.map(esc).join('<br>')+'</p><div class="row"><button class="btn btn-gold" onclick="closeModal()">Entendido</button></div>');modal('<h3>♻️ Reactivar remito '+e.numero_remito+'</h3><p class="hint">El remito vuelve a estado <b>Activa</b> y se descuenta de nuevo su stock por lote.'+(e.pedido_codigo?' El pedido <b>'+esc(e.pedido_codigo)+'</b> vuelve a <b>Cumplido</b>.':'')+'</p><label>PIN de supervisor</label><input type="password" id="re_pin2" autocomplete="off"><div class="row"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-gold" id="re_save2" onclick="doReactivarEntrega(\''+id+'\')">Reactivar</button></div>');}
async function doReactivarEntrega(id){const e=S.entregas.find(x=>x.id===id);if(!e)return;if(!authOK($('re_pin2').value,'reactivar_remito',e.numero_remito,'Reactivación de remito'))return;if($('re_save2')){$('re_save2').innerHTML='<span class="spin"></span>Reactivando...';$('re_save2').disabled=true;}try{const {error}=await sb.from('entregas').update({estado:'activa'}).eq('empresa_id',S.empresaId).eq('id',e.id);if(error)throw error;if(e.pedido_codigo){const pp=S.pedidos.find(x=>x.id===e.pedido_codigo);if(pp)await sb.from('pedidos').update({estado:'cumplido',numero_remito:e.numero_remito}).eq('empresa_id',S.empresaId).eq('id',pp.uuid);}await reloadEntregas();await reloadPedidos();closeModal();banner('Remito '+e.numero_remito+' reactivado · stock descontado','');render();}catch(err){banner('Error: '+err.message,'err');if($('re_save2')){$('re_save2').innerHTML='Reactivar';$('re_save2').disabled=false;}}}
function editEntrega(id){const e=S.entregas.find(x=>x.id===id);if(!e)return;if(e.estado==='anulada')return banner('El remito está anulado','warn');
  modal(`<h3>🔒 Editar remito ${e.numero_remito}</h3><p class="hint">Editar un remito emitido puede afectar stock y facturación. Por seguridad, ingresá el PIN de supervisor.</p><label>PIN de supervisor</label><input type="password" id="ee_pin" autocomplete="off"><div class="row"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-gold" onclick="editEntregaAuth('${id}')">Continuar</button></div>`);}
function editEntregaAuth(id){const e=S.entregas.find(x=>x.id===id);if(!authOK($('ee_pin').value,'editar_remito',e?e.numero_remito:id,'Edición de remito'))return;openEditEntrega(id);}
function openEditEntrega(id){const e=S.entregas.find(x=>x.id===id);if(!e)return;if(e.estado==='anulada')return banner('El remito está anulado','warn');window._editRemito=id;closeModal();go('ent');banner('Editando remito '+e.numero_remito+' · cambiá lotes, productos, cantidades y guardá','');return;window._edEnt={id,items:JSON.parse(JSON.stringify(e.items||[]))};
  modal(`<h3>Editar remito ${e.numero_remito}</h3>
   <div class="g2"><div><label>Fecha</label><input type="date" id="ee_fecha" value="${e.fecha}"></div><div><label>Orden de compra</label><input id="ee_oc" value="${esc(e.orden_compra||'')}" placeholder="opcional"></div></div>
   <label style="margin-top:8px">Ítems (ajustá cantidad/precio o quitá con ✕)</label><div id="ee_items"></div>
   <div class="g2" style="margin-top:8px"><div><label>Descuento</label><select id="ee_dtipo" onchange="edEntCalc()" style="padding:6px 8px"><option value="" ${!e.descuento_tipo?'selected':''}>Sin descuento</option><option value="pct" ${e.descuento_tipo==='pct'?'selected':''}>% porcentaje</option><option value="monto" ${e.descuento_tipo==='monto'?'selected':''}>$ monto</option></select></div><div><label>Valor</label><input type="number" id="ee_dvalor" min="0" step="0.01" value="${e.descuento_valor||''}" oninput="edEntCalc()"></div></div>
   <div id="ee_tot" class="scan-note" style="margin-top:8px"></div>
   <div class="row"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-gold" id="ee_save" onclick="saveEditEntrega()">Guardar cambios</button></div>`);
  edEntRows();edEntCalc();}
function edEntRows(){const st=window._edEnt;if(!st)return;const w=$('ee_items');if(!w)return;w.innerHTML=st.items.map((it,i)=>`<div class="g2" style="grid-template-columns:1.5fr .6fr .8fr auto;align-items:center;margin-bottom:6px"><span style="font-size:12px">${esc(it.producto)}<br><span style="color:var(--muted);font-size:10px">lote ${esc(it.loteRef||'—')}</span></span><input type="number" min="0" value="${it.cantidad}" data-eei="${i}" data-f="cantidad" oninput="edEntSet(this)" title="Unidades"><input type="number" min="0" step="0.01" value="${it.precio||''}" data-eei="${i}" data-f="precio" oninput="edEntSet(this)" title="Precio unitario"><button class="btn btn-danger btn-sm" onclick="edEntDel(${i})">✕</button></div>`).join('')||'<div class="note">Sin ítems. Si querés quitar todo, mejor anulá el remito.</div>';}
function edEntSet(inp){const st=window._edEnt;if(!st)return;const i=+inp.dataset.eei,f=inp.dataset.f;if(st.items[i]){st.items[i][f]=+inp.value||0;}edEntCalc();}
function edEntDel(i){const st=window._edEnt;if(!st)return;st.items.splice(i,1);edEntRows();edEntCalc();}
function edEntCalc(){const st=window._edEnt;if(!st)return;const gross=st.items.reduce((a,it)=>a+((+it.precio||0)*(+it.cantidad||0)),0);const tipo=$('ee_dtipo')?$('ee_dtipo').value:'';const val=+($('ee_dvalor')?$('ee_dvalor').value:0)||0;const d=tipo==='pct'?gross*val/100:(tipo==='monto'?Math.min(val,gross):0);const el=$('ee_tot');if(el)el.innerHTML=`Bruto: <b>${money(gross)}</b>${d>0?` · desc. −${money(d)} · Neto: <b>${money(gross-d)}</b>`:''}`;}
async function saveEditEntrega(){const st=window._edEnt;if(!st)return;const e=S.entregas.find(x=>x.id===st.id);if(!e)return;if(!st.items.length)return banner('Dejá al menos un ítem, o mejor anulá el remito','warn');
  const fecha=$('ee_fecha').value,oc=$('ee_oc').value.trim()||null,dtipo=$('ee_dtipo').value||null,dvalor=+$('ee_dvalor').value||0;
  $('ee_save').innerHTML='<span class="spin"></span>Guardando...';$('ee_save').disabled=true;
  try{const {error:e1}=await sb.from('entregas').update({fecha,orden_compra:oc,descuento_tipo:dtipo,descuento_valor:dvalor}).eq('empresa_id',S.empresaId).eq('id',e.id);if(e1)throw e1;
    const {error:e2}=await sb.from('entrega_items').delete().eq('empresa_id',S.empresaId).eq('entrega_id',e.id);if(e2)throw e2;
    const rows=st.items.map(it=>({empresa_id:S.empresaId,entrega_id:e.id,producto_nombre:it.producto,producto_id:prodIdByName(it.producto),cantidad:+it.cantidad||0,cajas:it.cajas||0,precio:+it.precio||0,despacho_id:(S.despachos.find(x=>x.id===it.did)||{}).uuid||null,lote_ref:it.loteRef}));
    const {error:e3}=await sb.from('entrega_items').insert(rows);if(e3)throw e3;
    await reloadEntregas();await reloadDespachos();closeModal();banner('Remito '+e.numero_remito+' actualizado','');render();
  }catch(err){banner('Error: '+err.message,'err');$('ee_save').innerHTML='Guardar cambios';$('ee_save').disabled=false;}}

function reRemito(id){const e=S.entregas.find(x=>x.id===id);if(!e)return;const cli=S.clientes.find(c=>c.id===e.cliente_id)||{};renderRemito({nro:e.numero_remito,fecha:e.fecha,cliData:cli,items:e.items,oc:e.orden_compra,muestra:e.es_muestra});}
function remitoHTML(e){const emp=S.empresa;const c=e.cliData||{};return `<div class="remito"><div class="rh"><div style="display:flex;gap:10px;align-items:center;font-size:10px">${empLogo()?`<img class="rlogo" src="${empLogo()}">`:''}<div><b>${emp.razon_social}</b><br>${emp.cuit||''}<br>${emp.dom_fiscal||''}</div></div><div class="rtitle">REMITO<br><span style="font-size:13px">${e.nro}</span></div><div style="text-align:right;font-size:10px">Fecha: ${fmtD(e.fecha)}${e.oc?`<br><b>O. Compra:</b> ${esc(e.oc)}`:''}<br><b style="font-family:Space Grotesk;color:#16243f">FMN</b></div></div>
  <div style="display:flex;justify-content:space-between;gap:20px;padding:8px 0;border-bottom:1px solid #000;font-size:10px"><div><b>Cliente:</b> ${c.razon_social||''}<br><b>CUIT:</b> ${c.cuit||'—'}<br><b>Domicilio:</b> ${c.domicilio||'—'}</div><div style="text-align:right"><b>Localidad:</b> ${c.localidad||'—'}<br><b>Cond. IVA:</b> ${c.iva||'—'}<br><b>Tel:</b> ${c.telefono||'—'}</div></div>
  ${e.muestra?'<div style="text-align:center;font-weight:800;color:#b3402f;border:1.5px solid #b3402f;padding:3px;margin:6px 0;letter-spacing:.05em">MUESTRA · SIN VALOR COMERCIAL</div>':''}<table><thead><tr><th>Código</th><th>Artículo</th><th style="text-align:right">Cantidad</th><th style="text-align:right">Bultos</th></tr></thead><tbody>${(function(){const g={},ord=[];(e.items||[]).forEach(it=>{const k=it.producto||'';if(!(k in g)){g[k]={c:0,cj:0};ord.push(k);}g[k].c+=+it.cantidad||0;g[k].cj+=+it.cajas||0;});return ord.map(k=>`<tr><td class="mono">${esc(artCod(k))}</td><td>${k}</td><td class="mono" style="text-align:right">${nf(g[k].c,2)}</td><td class="mono" style="text-align:right">${e.muestra?(esMuestraCaja(k)?remCajasProd(k,g[k].c):'—'):remCajasProd(k,g[k].c)}</td></tr>`).join('')+((e.muestra&&ord.some(k=>!esMuestraCaja(k)))?`<tr><td></td><td><i>Caja de muestras varias (1 paq. c/u)</i></td><td></td><td class="mono" style="text-align:right">1</td></tr>`:'');})()}</tbody></table>
  <div class="rspacer"></div>
  <div class="obs"><b>OBSERVACIÓN:</b></div></div>`;}
function printDoc(size,opts){opts=opts||{};const host=document.getElementById('lblArea')||document.getElementById('repSheet');if(!host)return;const a4=(size==='A4'||size==='a4');let st=document.getElementById('dynpage');if(!st){st=document.createElement('style');st.id='dynpage';document.head.appendChild(st);}st.textContent='@page{size:'+(size||'auto')+';margin:'+(a4?'10mm':'6mm')+'}';let pr=document.getElementById('printRoot');if(!pr){pr=document.createElement('div');pr.id='printRoot';document.body.appendChild(pr);}const parent=host.parentNode,next=host.nextSibling;const cop=opts.copia||(document.getElementById('pd_copia')&&document.getElementById('pd_copia').checked);pr.innerHTML='';pr.appendChild(host);let clone=null;if(cop){clone=host.cloneNode(true);clone.removeAttribute('id');clone.style.pageBreakBefore='always';clone.style.breakBefore='page';pr.appendChild(clone);}document.body.classList.add('printing-doc');window.print();document.body.classList.remove('printing-doc');if(clone&&clone.parentNode)clone.parentNode.removeChild(clone);if(parent){if(next)parent.insertBefore(host,next);else parent.appendChild(host);}pr.innerHTML='';}
function renderRemito(e){modal(`<h3>Remito ${e.nro}</h3><p class="hint">Documento interno para el cliente (sin precios) · hoja A4. En el cuadro de impresión de Chrome desmarcá “Encabezados y pies de página”.</p><div id="lblArea">${remitoHTML(e)}</div><label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;margin:10px 0"><input type="checkbox" id="pd_copia" style="width:auto"> Imprimir un duplicado (original + copia)</label><div class="row"><button class="btn btn-ghost" onclick="closeModal()">Cerrar</button><button class="btn btn-gold" onclick="printDoc('A4')">🖨️ Imprimir remito (A4)</button></div>`);}

// ---- PEDIDOS Y PLAN DE COMPRA (conectado a la nube) ----
function stockProd(name){let s=0;lotesDeProducto(name).forEach(l=>{s+=stockLoteProd(name,l);});return s;}
function stockMP(mp){let s=0;S.recepciones.filter(r=>r.estado!=='anulada'&&(r.materia_prima||'').toUpperCase()===(mp||'').toUpperCase()).forEach(r=>s+=stockLote(r));return s;}
function rindeTeo(name){const p=S.productos.find(x=>x.nombre===name);return p?+p.rinde||0:0;}
function rindeReal(name){let paq=0,mp=0;S.producciones.filter(p=>p.estado!=='anulada'&&(p.lotes||[]).length===0&&p.outputs.length===1&&p.outputs[0].producto===name&&p.mpKg>0).forEach(p=>{paq+=p.outputs[0].cantidad;mp+=p.mpKg;});return mp>0?paq/mp:0;}
function rindeBasis(teo,real){const b=window._rindeBasis||'cons';if(b==='teo')return teo||real||0;if(b==='real')return real||teo||0;const vals=[teo,real].filter(v=>v>0);return vals.length?Math.min(...vals):0;}
async function reloadPedidos(){
  const [{data:peds},{data:items}]=await Promise.all([
    sb.from('pedidos').select('*').eq('empresa_id',S.empresaId).order('created_at',{ascending:false}),
    sb.from('pedido_items').select('*').eq('empresa_id',S.empresaId)
  ]);
  const cliById={};S.clientes.forEach(c=>cliById[c.id]=c.razon_social);
  S.pedidos=(peds||[]).map(p=>({id:p.codigo,uuid:p.id,cliente_id:p.cliente_id,clienteNombre:cliById[p.cliente_id]||'',fecha:p.fecha,dia:p.dia,estado:p.estado,numero_remito:p.numero_remito||'',
    items:(items||[]).filter(it=>it.pedido_id===p.id).map(it=>({producto:it.producto_nombre,paquetes:+it.paquetes||0,precio:+it.precio||0,importe:+it.importe||0}))}));
}

   <div class="card"><div class="card-h"><h3>Pedidos recientes</h3><div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">${periodSelect('ped')}<span style="display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)">👤 ${apair('pedf_cli','cli','Cliente…',pedF.cli,'',"pedFiltSet('cli',this.value)",apTodos(apCliArr()))}</span><span style="display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)">📦 ${apair('pedf_prod','prod','Producto…',pedF.prod,'',"pedFiltSet('prod',this.value)",apTodos(apArrNames(pedProdOpts)))}</span><span id="pedCount" style="font-size:12px;color:var(--muted)">${pedFiltered().length} pedido(s)</span></div></div>

function viewPlan(){
  $('view').innerHTML=`<div class="card"><div class="card-h"><h3>Plan de producción y compra</h3>
     <div style="display:flex;align-items:center;gap:6px;font-size:12px"><span style="color:var(--muted)">Rinde:</span><select id="pl_basis" onchange="window._rindeBasis=this.value;renderPlan()" style="width:auto;padding:5px 8px"><option value="cons">Conservador</option><option value="teo">Teórico</option><option value="real">Real prom.</option></select></div></div>

function pedAddLine(prod){const w=$('pd_lines');const d=document.createElement('div');d.className='g2';d.setAttribute('data-pl','');d.style.gridTemplateColumns='1.5fr .7fr 1.1fr .9fr auto';d.style.marginBottom='6px';
  const _plk='plp'+(window._plk=(window._plk||0)+1);
  d.innerHTML=`${apair(_plk,'prod','Buscar producto…',prod||'','pl_prod','pedPrefill(this);pedCalc()')}<input class="pl_cant" type="number" min="0" placeholder="unid." oninput="pedCalc()"><input class="pl_precio" type="number" min="0" step="0.01" placeholder="$/u" oninput="this.dataset.t=1;pedCalc()"><div class="pl_imp mono" style="display:flex;align-items:center;justify-content:flex-end;font-weight:600;color:var(--steel)">—</div><button class="btn btn-ghost btn-sm" onclick="this.parentNode.remove();pedCalc()">✕</button>`;
  w.appendChild(d);pedPrefill(d.querySelector('.pl_prod'));pedCalc();}
function pedPrefill(sel){const row=sel.closest('[data-pl]');const prod=row.querySelector('.pl_prod').value;const cliId=$('pd_cli')?$('pd_cli').value:'';const pr=row.querySelector('.pl_precio');if(!pr.dataset.t){const pv=ultimoPrecioProd(cliId,prod);if(pv)pr.value=pv;}}
function pedPrefillAll(){document.querySelectorAll('#pd_lines [data-pl]').forEach(r=>{r.querySelector('.pl_precio').dataset.t='';pedPrefill(r.querySelector('.pl_prod'));});pedCalc();}
function pedLineData(row){const prod=row.querySelector('.pl_prod').value;const cant=+row.querySelector('.pl_cant').value||0;const precio=+row.querySelector('.pl_precio').value||0;return {producto:prod,paquetes:cant,precio,importe:cant*precio};}
function pedCalc(){let paq=0,imp=0;document.querySelectorAll('#pd_lines [data-pl]').forEach(r=>{const d=pedLineData(r);paq+=d.paquetes;imp+=d.importe;const _ic=r.querySelector('.pl_imp');if(_ic)_ic.textContent=d.importe>0?money(d.importe):'—';});$('pd_tot').innerHTML=paq?`Total: <b style="color:var(--ink)">${nf(paq)} unidades</b> · <b style="color:var(--steel)">${money(imp)}</b>`:'<span style="color:var(--muted)">Cargá productos y cantidades.</span>';}
function pedMatch(p){const fpr=(pedF.prod||'').toLowerCase();if(pedF.cli&&p.cliente_id!==pedF.cli)return false;if(fpr&&!p.items.some(it=>(it.producto||'').toLowerCase().includes(fpr)))return false;return true;}

function planCompra(){
  const demand={};S.pedidos.filter(p=>p.estado==='pendiente').forEach(p=>p.items.forEach(it=>{demand[it.producto]=(demand[it.producto]||0)+(+it.paquetes||0);}));
  const rows=[];const mpNeed={};
  Object.keys(demand).forEach(prod=>{const ped=demand[prod];const st=stockProd(prod);const falta=Math.max(0,ped-st);const rTeo=rindeTeo(prod);const rReal=rindeReal(prod);const tipo=prodTipo(prod);
    rows.push({prod,ped,st,falta,rTeo,rReal,tipo});
    if(falta<=0)return;
    if(tipo==='comp_produccion'){(S.recetas[prod]||[]).forEach(r=>{mpNeed[r.mp]=(mpNeed[r.mp]||0)+falta*r.cantidad;});}
    else if(tipo==='simple'){const rinde=rindeBasis(rTeo,rReal);const mp=(S.prodMP[prod]||[])[0];if(mp&&rinde>0)mpNeed[mp]=(mpNeed[mp]||0)+falta/rinde;}
  });
  const compra=Object.keys(mpNeed).map(mp=>{const need=mpNeed[mp];const stk=stockMP(mp);return {mp,need:+need.toFixed(2),stk:+stk.toFixed(2),comprar:+Math.max(0,need-stk).toFixed(2)};});
  return {rows,compra};
}
function planAvgProd(){let tp=0,thh=0;S.producciones.filter(p=>p.estado!=='anulada'&&(+p.horas||0)>0&&(+p.operarios||0)>0).forEach(p=>{const paq=(p.outputs||[]).reduce((a,o)=>a+(+o.cantidad||0),0);tp+=paq;thh+=(+p.operarios||0)*(+p.horas||0);});return thh>0?tp/thh:0;}

function svgBars(data,color){
  if(!data.length)return '<div style="color:#6b7689;font-size:12px;padding:10px">Sin movimientos</div>';
  data=data.slice(0,8);const max=Math.max(...data.map(d=>d.value))||1;const bw=44,gap=16,h=130,pad=16;const w=data.length*(bw+gap)+pad;
  let bars='';data.forEach((d,i)=>{const bh=Math.max(2,Math.round((d.value/max)*(h-42)));const x=pad/2+i*(bw+gap);const y=h-bh-20;
    bars+=`<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="4" fill="${color}"></rect><text x="${x+bw/2}" y="${y-4}" text-anchor="middle" font-size="11" fill="#1c2536" font-family="Inter">${nf(d.value,d.value<10?1:0)}</text><text x="${x+bw/2}" y="${h-4}" text-anchor="middle" font-size="9" fill="#6b7689" font-family="Inter">${(d.label||'').slice(0,9)}</text>`;});
  return `<svg viewBox="0 0 ${w} ${h}" style="max-width:100%;height:auto">${bars}</svg>`;
}
function groupSum(arr,keyFn,valFn){const m={};arr.forEach(x=>{const k=keyFn(x);m[k]=(m[k]||0)+valFn(x);});return Object.keys(m).map(k=>({label:k,value:m[k]})).sort((a,b)=>b.value-a.value);}
let repF={desde:'',hasta:'',prov:'',prod:'',cli:''},repCur='diario';
const REPS=[['diario','Diario'],['compras','Compras'],['prov','Rinde proveedor'],['merma','Rinde por lote'],['ent','Entregas'],['movim','Movimientos 📦'],['ventas','Ventas y utilidad'],['traza','Trazabilidad'],['pedidos','Pedidos'],['estac','Estacionalidad'],['comp','Comparativo'],['cumpl','Cumplimiento'],['capac','Capacidad h-h'],['novedades','Novedades 🔒']];
function distinct(arr){return [...new Set(arr.filter(Boolean))].sort();}

function prodPrimaryRinde(p){let best=null,bestC=-1;p.outputs.forEach(o=>{const r=rindeDe(o.producto);if(r&&(+o.cantidad||0)>bestC){bestC=+o.cantidad||0;best=r;}});return best;}
function chainRoots(){const roots={};
  S.recepciones.forEach(r=>{if(r.estado==='anulada')return;if(r.origen==='acondicionamiento'||r.origen==='reventa')return;if(!inRange(r.fecha))return;if(repF.prov&&r.proveedor!==repF.prov)return;const root=r.codigo_lote;roots[root]={root,rec:r,prov:r.proveedor||'—',mp:r.materia_prima||'—',frec:r.fecha,kgComp:+r.kilos||0,tot:+r.total||0,kgObt:0,paq:0,prods:new Set(),prodPaq:{},procesos:new Set(),acond:false,primaryProd:''};});
  (S.acond||[]).forEach(a=>{if(a.estado==='anulada')return;const R=roots[rootLote(a.loteSal||'')];if(R){R.acond=true;if(a.proceso)R.procesos.add(a.proceso);}});
  S.producciones.forEach(pr=>{if(pr.estado==='anulada')return;let consumed=[];if((pr.lotes||[]).length){pr.lotes.forEach(l=>{const rt=rootLote(l.loteId||'');if(rt)consumed.push({root:rt,kg:+l.kg||0});});}else if(pr.loteId){consumed.push({root:rootLote(pr.loteId),kg:+pr.mpKg||0});}if(!consumed.length)return;const totKg=consumed.reduce((a,c)=>a+c.kg,0);consumed.forEach(c=>{const R=roots[c.root];if(!R)return;const w=totKg>0?c.kg/totKg:1/consumed.length;(pr.outputs||[]).forEach(ou=>{const cant=(+ou.cantidad||0)*w,kil=(+ou.kilos||0)*w;R.paq+=cant;R.kgObt+=kil;if(ou.producto){R.prods.add(ou.producto);R.prodPaq[ou.producto]=(R.prodPaq[ou.producto]||0)+cant;}});});});
  return Object.values(roots).map(R=>{let best='',bc=-1;Object.entries(R.prodPaq).forEach(([n,c])=>{if(c>bc){bc=c;best=n;}});R.primaryProd=best;return R;}).filter(R=>{if(!repF.prod)return true;return R.mp===repF.prod||R.prods.has(repF.prod);});
}
function costoUnitTotal(producto){const p=S.productos.find(x=>x.nombre===producto);const pid=p?p.id:null;const mp=mpCostoUnit(producto).perUnit;const ins=insumoCostoUnit(producto).tot;const sv=(pid&&S.costos[pid])||{gastos_op:0,mano_obra:0,flete:0,otros:0};return mp+ins+(+sv.gastos_op||0)+(+sv.mano_obra||0)+(+sv.flete||0)+(+sv.otros||0);}
function pedFilt(){return (S.pedidos||[]).filter(p=>inRange(p.fecha)&&(!repF.cli||p.clienteNombre===repF.cli));}
function ventasData(){const out=[];S.entregas.filter(e=>e.estado!=='anulada'&&!e.es_muestra&&inRange(e.fecha)&&(!repF.cli||e.clienteNombre===repF.cli)).forEach(e=>{const gross=e.items.reduce((a,it)=>a+((+it.precio||0)*(+it.cantidad||0)),0);const dAmt=e.descuento_tipo==='pct'?gross*((+e.descuento_valor||0)/100):(e.descuento_tipo==='monto'?Math.min(+e.descuento_valor||0,gross):0);const factor=gross>0?(gross-dAmt)/gross:1;e.items.forEach(it=>{if(repF.prod&&it.producto!==repF.prod)return;const pv=+it.precio||0,cu=costoUnitTotal(it.producto),u=+it.cantidad||0;const venta=pv*u*factor;out.push({cliente:e.clienteNombre,producto:it.producto,fecha:e.fecha,nro:e.numero_remito,u,pv,venta,cu,costo:cu*u,util:venta-cu*u});});});return out.sort((a,b)=>b.venta-a.venta);}
function trazaData(){const out=[];
  const roots=S.recepciones.filter(r=>r.estado!=='anulada'&&r.origen!=='acondicionamiento'&&r.origen!=='reventa'&&inRange(r.fecha)&&(!repF.prov||r.proveedor===repF.prov)&&(!repF.prod||r.materia_prima===repF.prod));
  roots.forEach(r=>{const root=r.codigo_lote;
    const family=S.recepciones.filter(x=>rootLote(x.codigo_lote)===root);const familyCodes=new Set(family.map(x=>x.codigo_lote));
    const ps=S.producciones.filter(p=>p.estado!=='anulada'&&((p.loteId&&rootLote(p.loteId)===root)||(p.lotes||[]).some(l=>rootLote(l.loteId||'')===root)));
    let proc=0,obt=0,paq=0;const prods=new Set();ps.forEach(p=>{proc+=+p.mpKg||0;(p.outputs||[]).forEach(ou=>{obt+=+ou.kilos||0;paq+=+ou.cantidad||0;if(ou.producto)prods.add(ou.producto);});});
    const acs=(S.acond||[]).filter(a=>a.estado!=='anulada'&&rootLote(a.loteSal||'')===root).sort((a,b)=>(a.fecha||'')<(b.fecha||'')?-1:1);
    const codes=new Set();ps.forEach(p=>p.outputs.forEach(ou=>codes.add(ou.code)));
    const desps=S.despachos.filter(d=>d.estado!=='anulada'&&d.items.some(it=>(it.consumido||[]).some(c=>codes.has(c.code))));const dispIds=new Set(desps.map(d=>d.id));
    const chainL=new Set(familyCodes);ps.forEach(p=>{try{const lp=loteDeProd(p);if(lp)chainL.add(lp);}catch(_e){}});
    const ents=S.entregas.filter(e=>e.estado!=='anulada'&&e.items.some(it=>dispIds.has(it.did)||(it.loteRef&&chainL.has(it.loteRef))));
    const clientes=[...new Set(ents.map(e=>e.clienteNombre).filter(Boolean))];const remitos=[...new Set(ents.map(e=>e.numero_remito).filter(Boolean))];
    const fent=ents.length?ents.map(e=>e.fecha).filter(Boolean).sort()[0]||'':'';
    let recorrido='Recep. '+root;acs.forEach(a=>{recorrido+=' → '+(a.proceso||'acond.')+(a.loteSal?' '+a.loteSal:'');});if(ps.length)recorrido+=' → envasado';if(ents.length)recorrido+=' → entrega';
    out.push({lote:root,frec:r.fecha,prov:r.proveedor||'—',mp:r.materia_prima||'—',kg:+r.kilos||0,proc,out:obt,paq:Math.round(paq),prods:[...prods].join(', ')||'—',acond:acs.length>0,recorrido,clientes,remitos,fent});
  });
  out.sort((a,b)=>a.lote<b.lote?-1:1);return out;}

async function downloadReportePDF(){
  const el=$('repSheet');if(!el)return;
  const btn=$('rep_pdf');btn.innerHTML='<span class="spin"></span>Generando...';btn.disabled=true;
  try{
    const canvas=await html2canvas(el,{scale:2,backgroundColor:'#ffffff',useCORS:true});
    const img=canvas.toDataURL('image/png');const {jsPDF}=window.jspdf;const pdf=new jsPDF('p','mm','a4');
    const w=210,h=canvas.height*w/canvas.width;let pos=0,rem=h;
    pdf.addImage(img,'PNG',0,pos,w,h);rem-=297;
    while(rem>0){pdf.addPage();pos-=297;pdf.addImage(img,'PNG',0,pos,w,h);rem-=297;}
    pdf.save('Reporte_FMN_'+($('rep_fecha').value)+'.pdf');
    banner('PDF descargado','');
  }catch(err){banner('Error al generar PDF: '+err.message,'err');}
  btn.innerHTML='⬇ Descargar PDF';btn.disabled=false;
}

function printLoteLabels(){const r=recById(window._loteLbl);if(!r)return;const N=Math.max(1,Math.min(500,+($('ll_n')?$('ll_n').value:1)||1));
  const cfg=etqCfg();const tpl=etqDefaultDesign(cfg,'lote')||etqDefault('lote');const PX=3.78;const cols=Math.max(1,+tpl.cols||1);const gap=+tpl.gapx||0;const gapy=+tpl.gapy||0;const w=Math.round(tpl.w*PX),h=Math.round(tpl.h*PX);

  let rows='';for(let i=0;i<cells.length;i+=cols){let slice=cells.slice(i,i+cols);while(slice.length<cols)slice.push(_empty);rows+=`<div style="display:flex;gap:${Math.round(gap*PX)}px;justify-content:flex-start;page-break-after:always;break-after:page">${slice.join('')}</div>`;}
  const pageW=(tpl.rot?(cols*tpl.h+(cols-1)*gap):(cols*tpl.w+(cols-1)*gap)).toFixed(1),pageH=((tpl.rot?tpl.w:tpl.h)+gapy).toFixed(1);
  let st=document.getElementById('dynpage');if(!st){st=document.createElement('style');st.id='dynpage';document.head.appendChild(st);}st.textContent='@page{size:'+pageW+'mm '+pageH+'mm;margin:0}';
  let pr=document.getElementById('printRoot');if(!pr){pr=document.createElement('div');pr.id='printRoot';document.body.appendChild(pr);}pr.innerHTML=rows;document.body.classList.add('printing-labels');
  barJobs.forEach(j=>{const el=$(j.id);if(el)etqBar(el,j.code,j.w,j.h);});qrJobs.forEach(j=>{const el=$(j.id);if(el)etqQr(el,j.text,j.size);});
  window.print();
  document.body.classList.remove('printing-labels');pr.innerHTML='';}

function trace(code){
  const panel=$('t_panel');if(!code)return notFoundTraz(code);
  const ent=S.entregas.find(x=>x.numero_remito===code||('R-'+x.numero_remito)===code);
  if(ent)return showTraceEntrega(ent);
  let lotes=[],prodsInChain=[];
  if(code.startsWith('L-')){const r=recById(code);if(r){
    const chain=[r];const seen=new Set([r.id]);let changed=true;
    while(changed){changed=false;(S.acond||[]).filter(a=>a.estado!=='anulada').forEach(a=>{const src=recByUuid(a.recepcionId),out=recByUuid(a.recSalId);if(src&&out){if(seen.has(src.id)&&!seen.has(out.id)){chain.push(out);seen.add(out.id);changed=true;}if(seen.has(out.id)&&!seen.has(src.id)){chain.push(src);seen.add(src.id);changed=true;}}});}
    lotes=chain;
    prodsInChain=S.producciones.filter(p=>p.estado!=='anulada'&&(chain.some(x=>p.loteId===x.codigo_lote)||(p.lotes||[]).some(l=>chain.some(x=>l.loteId===x.codigo_lote))));
  }}
  else if(code.startsWith('P-')||code.startsWith('E-')){const p=S.producciones.find(x=>x.id===code);if(p){if(p.id.indexOf('E-')===0){const cons=S.ensConsumos.filter(c=>c.ensamblado_op===p.id);const cl=[...new Set(cons.map(c=>c.codigo_lote))];lotes=cl.map(x=>recById(x)).filter(Boolean);const herb=S.producciones.filter(hp=>hp.estado!=='anulada'&&hp.id!==p.id&&(cl.includes(hp.loteId)||(hp.lotes||[]).some(l=>cl.includes(l.loteId))));prodsInChain=[...herb,p];}else{prodsInChain=[p];lotes=loteObjsDeProd(p);}}}
  else if(code.startsWith('PR-')){const p=prodByCode(code);if(p){prodsInChain=[p];lotes=loteObjsDeProd(p);}}
  else if(code.startsWith('D-')){const d=S.despachos.find(x=>x.id===code);if(d){const codes=new Set();d.items.forEach(it=>(it.consumido||[]).forEach(c=>codes.add(c.code)));prodsInChain=S.producciones.filter(p=>p.estado!=='anulada'&&p.outputs.some(o=>codes.has(o.code)));prodsInChain.forEach(p=>loteObjsDeProd(p).forEach(r=>{if(!lotes.includes(r))lotes.push(r);}));}}
  if(!lotes.length&&!prodsInChain.length)return notFoundTraz(code);
  const codes=new Set();prodsInChain.forEach(p=>p.outputs.forEach(o=>codes.add(o.code)));
  const desps=S.despachos.filter(d=>d.estado!=='anulada'&&d.items.some(it=>(it.consumido||[]).some(c=>codes.has(c.code))));
  const dispIds=new Set(desps.map(d=>d.id));
  const chainLoteRefs=new Set();lotes.forEach(r=>{if(r&&r.codigo_lote)chainLoteRefs.add(r.codigo_lote);});prodsInChain.forEach(p=>{try{const lp=loteDeProd(p);if(lp)chainLoteRefs.add(lp);}catch(_e){}});
  const ents=S.entregas.filter(e=>e.estado!=='anulada'&&e.items.some(it=>dispIds.has(it.did)||(it.loteRef&&chainLoteRefs.has(it.loteRef))));
  let nodes='';
  lotes.forEach(r=>{if(r.origen==='acondicionamiento')return;nodes+=`<div class="node"><div class="when">${fmtD(r.fecha)} · RECEPCIÓN</div><div class="what">${r.materia_prima} — Lote ${r.codigo_lote}</div><div class="det">Proveedor <b>${r.proveedor||'—'}</b> · ${nf(r.kilos,1)}kg${r.recibido_por?` · recibió ${r.recibido_por}`:''}<br>Stock en cámara: <b>${nf(stockLote(r),1)}kg</b></div></div>`;});
  // Acondicionamiento (pelado): muestra el origen (choclo con chala) y la primera merma
  let acondNodes='';
  (S.acond||[]).filter(a=>a.estado!=='anulada'&&lotes.some(r=>r.id===a.recSalId)).forEach(a=>{const src=recByUuid(a.recepcionId);const merma=Math.max(0,a.kgEnt-a.kgSal);const rinde=a.kgEnt>0?a.kgSal/a.kgEnt*100:0;if(src&&!lotes.some(r=>r.id===src.id))acondNodes+=`<div class="node"><div class="when">${fmtD(src.fecha)} · RECEPCIÓN</div><div class="what">${src.materia_prima} — Lote ${src.codigo_lote}</div><div class="det">Proveedor <b>${src.proveedor||'—'}</b> · ${nf(src.kilos,1)}kg</div></div>`;acondNodes+=`<div class="node prod"><div class="when">${fmtD(a.fecha)} · ACONDICIONAMIENTO ${a.id}</div><div class="what">${esc(a.proceso||'Pelado')} — rinde ${nf(rinde,0)}%</div><div class="det">Entrada <b>${nf(a.kgEnt,1)}kg</b>${src?' ('+src.codigo_lote+')':''} → Salida <b>${nf(a.kgSal,1)}kg</b> de ${esc(a.prodSal||'')} (lote <b>${a.loteSal}</b>)<br>Merma (chala): <b>${nf(merma,1)}kg</b></div></div>`;});
  nodes=nodes+acondNodes;
  const descMP=(S.descartes||[]).filter(d=>lotes.some(r=>r.codigo_lote===d.codigo_lote));
  descMP.forEach(d=>{nodes+=`<div class="node disc"><div class="when">${fmtD(d.fecha)} · DESCARTE DE MP ${d.codigo}</div><div class="what">${nf(d.kg,1)}kg de ${d.materia_prima} descartados</div><div class="det">${d.motivo?'Motivo: '+d.motivo:''}${d.registrado_por?' · '+d.registrado_por:''}</div></div>`;});
  prodsInChain.forEach(p=>{const ko=p.outputs.reduce((a,o)=>a+(+o.kilos||0),0);const rend=p.mpKg>0?ko/p.mpKg*100:0;const isEns=p.id.indexOf('E-')===0;const comps=isEns?S.ensConsumos.filter(c=>c.ensamblado_op===p.id):[];const orig=isEns?comps.map(c=>`${c.componente} (${c.codigo_lote})`).join(' + '):((p.lotes&&p.lotes.length)?p.lotes.map(l=>`${l.mp} ${l.loteId}`).join(' + '):p.loteId);nodes+=`<div class="node prod"><div class="when">${fmtD(p.fecha)} · ${isEns?'ENSAMBLADO':'PRODUCCIÓN'} ${p.id}</div><div class="what">${isEns?'Ensamblado de componentes':nf(p.mpKg,1)+'kg de MP · rinde '+nf(rend,0)+'%'}</div><div class="det">Origen: ${orig}<br>${p.outputs.map(o=>`${o.producto}: <b>${nf(o.cantidad)}u</b> · <span class="mono">${o.code}</span>`).join('<br>')}</div></div>`;});
  /* Etiquetado (despachos) omitido de la trazabilidad a pedido del usuario. desps/dispIds se siguen usando para entregas y devoluciones. */
  ents.forEach(e=>{const its=e.items.filter(it=>dispIds.has(it.did)||(it.loteRef&&chainLoteRefs.has(it.loteRef)));const cli=S.clientes.find(c=>c.id===e.cliente_id)||{};nodes+=`<div class="node ent"><div class="when">${fmtD(e.fecha)} · ENTREGA · Remito ${e.numero_remito}</div><div class="what">Cliente: ${e.clienteNombre||''}</div><div class="det">${its.map(it=>`${it.producto}: <b>${nf(it.cantidad)}u</b>`).join('<br>')}<br>CUIT ${cli.cuit||'—'} · ${cli.localidad||''}</div></div>`;});
  const devs=(S.devoluciones||[]).filter(d=>d.estado!=='anulada'&&((d.output_code&&codes.has(d.output_code))||lotes.some(r=>r.codigo_lote===d.lote_ref)||(d.despacho_codigo&&dispIds.has(d.despacho_codigo))));
  devs.forEach(d=>{nodes+=`<div class="node disc"><div class="when">${fmtD(d.fecha)} · DEVOLUCIÓN ${d.codigo}</div><div class="what">${devTipoLabel(d.tipo)} — ${nf(d.cantidad)}u de ${d.producto_nombre}</div><div class="det">Cliente: ${d.cliente_nombre||'—'}${d.reingreso_lote?`<br>Reingresado como MP: <b>${d.reingreso_lote}</b> (${nf(d.kg,1)}kg)`:''}${d.motivo?`<br>Motivo: ${d.motivo}`:''}</div></div>`;});
  const ensOps=[...new Set(S.ensConsumos.filter(c=>codes.has(c.output_code)).map(c=>c.ensamblado_op))];
  ensOps.forEach(op=>{const ap=S.producciones.find(p=>p.id===op);if(!ap||prodsInChain.some(p=>p.id===op))return;const o=ap.outputs[0]||{};nodes+=`<div class="node prod"><div class="when">${fmtD(ap.fecha)} · ENSAMBLADO ${op}</div><div class="what">Se usó en: ${o.producto||''}</div><div class="det">${o.producto}: <b>${nf(o.cantidad)}u</b> · <span class="mono">${o.code}</span></div></div>`;});
  if(!prodsInChain.length)nodes+=`<div class="node prod"><div class="when">PENDIENTE</div><div class="what" style="color:var(--muted)">Aún sin producción registrada</div></div>`;
  const visL=lotes.filter(r=>r.origen!=='acondicionamiento');const titLotes=(visL.length?visL:lotes);
  const titulo=lotes.length?`Lote ${titLotes.map(r=>r.codigo_lote).join(' + ')}`:prodsInChain[0].id;
  panel.innerHTML=`<div class="card"><div class="card-h"><h3>Historia de ${titulo}</h3><span class="tag ok">${prodsInChain.length} producción(es) · ${ents.length} entrega(s)</span></div><div class="tl" style="margin-top:16px">${nodes}</div></div>`;
}
