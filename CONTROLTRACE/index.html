function etqNew(kind){if(!S.etq)etqLoad();const base=etqDefault(kind);const n=(S.etq.designs||[]).filter(x=>x.kind===kind).length+1;const d=Object.assign({id:etqUID(),name:({paquete:'Paquete ',caja:'Caja ',lote:'Lote '}[kind]||'Etiqueta ')+n,kind:kind,isDefault:!(S.etq.designs||[]).some(x=>x.kind===kind&&x.isDefault)},base);S.etq.designs.push(d);etqCur=d.id;S.etqSel=null;cfgEtiquetas();banner('Diseño creado · acordate de Guardar la biblioteca','');}
function etqRename(){const tpl=curDesign();if(!tpl)return;const n=prompt('Nombre del diseño:',tpl.name);if(n===null)return;tpl.name=(n.trim()||tpl.name);cfgEtiquetas();}
function etqDup(){const tpl=curDesign();if(!tpl)return;const d=JSON.parse(JSON.stringify(tpl));d.id=etqUID();d.name=tpl.name+' (copia)';d.isDefault=false;d.elements=(d.elements||[]).map(el=>Object.assign({},el,{id:etqId()}));S.etq.designs.push(d);etqCur=d.id;S.etqSel=null;cfgEtiquetas();banner('Diseño duplicado','');}
function etqMakeDefault(){const tpl=curDesign();if(!tpl)return;(S.etq.designs||[]).forEach(d=>{if(d.kind===tpl.kind)d.isDefault=(d.id===tpl.id);});cfgEtiquetas();banner('Marcado por defecto · Guardá la biblioteca','');}
function etqDelDesign(){const tpl=curDesign();if(!tpl)return;const same=(S.etq.designs||[]).filter(d=>d.kind===tpl.kind);if(same.length<=1)return banner('Debe quedar al menos un diseño de '+tpl.kind,'warn');if(!confirm('¿Borrar el diseño “'+tpl.name+'”? Los productos que lo tengan asignado pasarán a usar el por defecto.'))return;const wasDef=tpl.isDefault;S.etq.designs=(S.etq.designs||[]).filter(d=>d.id!==tpl.id);if(wasDef){const first=S.etq.designs.find(d=>d.kind===tpl.kind);if(first)first.isDefault=true;}const f=S.etq.designs.find(d=>d.kind===tpl.kind)||S.etq.designs[0];etqCur=f?f.id:null;S.etqSel=null;cfgEtiquetas();banner('Diseño borrado · Guardá la biblioteca','');}
function etqRenderCanvas(){const tpl=curDesign();if(!tpl)return;const PX=3.78;const cw=Math.round(tpl.w*PX),ch=Math.round(tpl.h*PX);const cv=$('etqCanvas');if(!cv)return;cv.style.width=cw+'px';cv.style.height=ch+'px';cv.style.transform='scale('+etqZoom+')';const sz=$('etqSizer');if(sz){sz.style.width=Math.round(cw*etqZoom)+'px';sz.style.height=Math.round(ch*etqZoom)+'px';}const {html,barJobs,qrJobs}=renderTplLabel(tpl,etqSample(),'etqc');cv.innerHTML=html;barJobs.forEach(j=>{const el=$(j.id);if(el)etqBar(el,j.code,j.w,j.h);});qrJobs.forEach(j=>{const el=$(j.id);if(el)etqQr(el,j.text,j.size);});
  cv.querySelectorAll('.etqEl').forEach(node=>{node.onpointerdown=e=>etqDragStart(e,node.dataset.id);});
  if(S.etqSel){const sel=cv.querySelector('[data-id="'+S.etqSel+'"]');if(sel)sel.style.outline='2px solid #c9a24b';}
}
function etqSetZoom(z){etqZoom=z;const v=$('etqZoomV');if(v)v.textContent=z+'×';etqRenderCanvas();}
function etqDragStart(e,id){e.preventDefault();etqSelect(id);const tpl=curDesign();if(!tpl)return;const el=tpl.elements.find(x=>x.id===id);if(!el)return;const cv=$('etqCanvas');const sx=e.clientX,sy=e.clientY,ox=el.x,oy=el.y;
  const move=ev=>{let nx=ox+(ev.clientX-sx)/etqZoom,ny=oy+(ev.clientY-sy)/etqZoom;nx=Math.max(0,Math.min(nx,cv.clientWidth-6));ny=Math.max(0,Math.min(ny,cv.clientHeight-6));el.x=Math.round(nx);el.y=Math.round(ny);const node=cv.querySelector('[data-id="'+id+'"]');if(node){node.style.left=el.x+'px';node.style.top=el.y+'px';}const pos=$('etqPos');if(pos)pos.textContent='Posición: '+el.x+', '+el.y+' px';};
  const up=()=>{document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up);};
  document.addEventListener('pointermove',move);document.addEventListener('pointerup',up);
}
function etqSelect(id){S.etqSel=id;const cv=$('etqCanvas');if(cv)cv.querySelectorAll('.etqEl').forEach(n=>n.style.outline=n.dataset.id===id?'2px solid #c9a24b':'1px dashed rgba(0,0,0,.18)');etqRenderProps();}

function etqProp(field,val,re){const tpl=curDesign();if(!tpl)return;const el=tpl.elements.find(x=>x.id===S.etqSel);if(!el)return;el[field]=val;etqRenderCanvas();if(re)etqRenderProps();}
function etqRenderProps(){const box=$('etqProps');if(!box)return;const tpl=curDesign();if(!tpl){box.innerHTML='';return;}const el=tpl.elements.find(x=>x.id===S.etqSel);if(!el){box.innerHTML='<div class="scan-note">Tocá un elemento del lienzo para editar su tamaño, letra y posición. Arrastralo para moverlo.</div>';return;}const tc=ETQ_TYPES.find(t=>t[0]===el.type);const kind=tc?tc[2]:'text';const label=tc?tc[1]:el.type;
  let h=`<div style="font-family:'Space Grotesk';font-weight:600;color:var(--navy);margin-bottom:8px">${label}</div>`;
  if(el.type==='texto')h+=`<label>Texto</label><input value="${esc(el.text||'')}" oninput="etqProp('text',this.value)">`;
  if(kind==='text'){h+=`<label>Tamaño de letra</label><input type="range" min="6" max="40" value="${el.fs||11}" oninput="etqProp('fs',+this.value)">

  if(kind==='bar')h+=`<label>Ancho</label><input type="range" min="60" max="300" value="${el.w||130}" oninput="etqProp('w',+this.value)"><label>Alto</label><input type="range" min="20" max="90" value="${el.h||36}" oninput="etqProp('h',+this.value)">`;
  if(kind==='qr')h+=`<label>Tamaño</label><input type="range" min="40" max="200" value="${el.w||80}" oninput="etqProp('w',+this.value)">`;
  if(kind==='img')h+=`<label>Logo a mostrar</label><select onchange="etqProp('which',this.value,1)"><option value="aizu" ${el.which==='aizu'?'selected':''}>AIZU</option><option value="fmn" ${el.which==='fmn'?'selected':''}>FMN</option><option value="" ${!el.which?'selected':''}>Logo general</option></select><label>Ancho</label><input type="range" min="20" max="300" value="${el.w||70}" oninput="etqProp('w',+this.value)"><label>Alto</label><input type="range" min="20" max="300" value="${el.h||44}" oninput="etqProp('h',+this.value)">`;
  h+=`<div id="etqPos" style="margin-top:8px;font-size:11px;color:var(--muted)">Posición: ${el.x}, ${el.y} px</div>`;
  h+=`<button class="btn btn-danger btn-sm" style="margin-top:10px" onclick="etqDelEl()">🗑 Eliminar</button>`;
  box.innerHTML=h;
}

function dlXLS(filename,rows,hoja){
  const name=filename.replace(/\.(csv|xlsx)$/i,'')+'.xlsx';
  if(typeof XLSX==='undefined'){return dlCSVfallback(filename,rows);}
  try{
    const ws=XLSX.utils.aoa_to_sheet(rows);
    const anchos=(rows[0]||[]).map((_,c)=>{let m=10;rows.forEach(r=>{const v=r[c]==null?'':String(r[c]);if(v.length>m)m=v.length;});return {wch:Math.min(46,m+2)};});
    ws['!cols']=anchos;
    if(rows.length>1)ws['!autofilter']={ref:XLSX.utils.encode_range({s:{r:0,c:0},e:{r:rows.length-1,c:(rows[0]||[]).length-1}})};
    ws['!freeze']={xSplit:0,ySplit:1};
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,(hoja||'Datos').slice(0,31));
    XLSX.writeFile(wb,name);
    banner('Descargado: '+name,'');
  }catch(e){dlCSVfallback(filename,rows);}
}
function dlCSVfallback(filename,rows){const csv=rows.map(r=>r.map(c=>{let v=String(c==null?'':c);if(typeof c==='number')v=v.replace('.',',');return '"'+v.replace(/"/g,'""')+'"';}).join(';')).join('\r\n');const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename.replace(/\.xlsx$/i,'.csv');a.click();banner('Descargado en CSV','');}
function dlCSV(filename,rows){return dlXLS(filename,rows);}

function mpAgg(){const R=S.recepciones.filter(r=>r.estado!=='anulada');const mp={};R.forEach(r=>{const k=r.materia_prima||'—';mp[k]=mp[k]||{comp:0,proc:0,desc:0,caj:0,lotes:[]};mp[k].comp+=+r.kilos||0;mp[k].proc+=kgConsumidoLote(r.codigo_lote)+acondConsumidoLote(r.id);mp[k].desc+=descartadoLote(r.codigo_lote);const stL=stockLote(r);mp[k].caj+=((+r.kilos||0)>0?stL/(+r.kilos)*(+r.cajas||0):0);if(stL>0.001)mp[k].lotes.push(r.codigo_lote);});return mp;}
function prodAgg(){const names=[...new Set(S.producciones.filter(p=>p.estado==='validada').flatMap(p=>p.outputs.map(o=>o.producto)))];const ps={};names.forEach(n=>{const lts=[];lotesDeProducto(n).forEach(l=>{const st=stockLoteProd(n,l);if(st>0.001)lts.push({lote:l,stock:st});});lts.sort((a,b)=>a.lote.localeCompare(b.lote));ps[n]={lotes:lts,stock:lts.reduce((s,x)=>s+x.stock,0)};});return ps;}
function stkData(t,q){
  q=(q||'').trim().toLowerCase();
  const inc=r=>!q||r.some(v=>String(v).toLowerCase().includes(q));
  if(t==='mp'){const mp=mpAgg();
    const rows=Object.entries(mp).filter(([k,v])=>v.comp-v.proc-v.desc>0.001||v.desc>0.001)
      .sort((a,b)=>(b[1].comp-b[1].proc-b[1].desc)-(a[1].comp-a[1].proc-a[1].desc))
      .map(([k,v])=>[artCod(k),k,v.lotes.join(', ')||'—',+v.comp.toFixed(1),+v.proc.toFixed(1),+v.desc.toFixed(1),Math.round(v.caj),+(v.comp-v.proc-v.desc).toFixed(1)]).filter(inc);
    return {titulo:'Stock de materia prima en cámara',head:['Código','Materia prima','N° de lote','Comprado kg','Procesado kg','Descartado kg','Stock cajas','Stock kg'],num:[0,0,0,1,1,1,1,1],dec:[0,0,0,1,1,1,0,1],rows};}
  if(t==='prod'){const ps=prodAgg();const items=Object.entries(ps).filter(([k,v])=>v.stock>0.001).sort((a,b)=>a[0]<b[0]?-1:1);const rows=[],rk=[];let gt=0;items.forEach(([k,v])=>{v.lotes.forEach(x=>{rows.push([artCod(k),k,x.lote,Math.round(x.stock)]);rk.push('d');});rows.push(['',k+' — Total',(v.lotes.length)+' lote(s)',Math.round(v.stock)]);rk.push('s');gt+=v.stock;});if(rows.length){rows.push(['','TOTAL GENERAL','',Math.round(gt)]);rk.push('t');}
    return {titulo:'Stock de productos procesados — por lote (producción cerrada)',head:['Código','Producto','Lote','Stock (u.)'],num:[0,0,0,1],dec:[0,0,0,0],rows,rk};}
  const recs=S.recepciones.filter(r=>r.estado!=='anulada'&&stockLote(r)>0.001);const byM={},ordm=[];recs.forEach(r=>{const k=r.materia_prima||'—';if(!(k in byM)){byM[k]=[];ordm.push(k);}byM[k].push(r);});ordm.sort();const rows=[],rk=[];let gk=0,gc=0;ordm.forEach(k=>{const list=byM[k].slice().sort((a,b)=>a.fecha<b.fecha?-1:1);let sk=0,sc=0;list.forEach(r=>{const kg=+stockLote(r).toFixed(1),cj=Math.round((+r.kilos||0)>0?stockLote(r)/(+r.kilos)*(+r.cajas||0):0);sk+=kg;sc+=cj;gk+=kg;gc+=cj;rows.push([r.codigo_lote,artCod(k),k,r.proveedor||'',fmtD(r.fecha),cj,kg]);rk.push('d');});rows.push(['','',k+' — Total','','',sc,+sk.toFixed(1)]);rk.push('s');});if(rows.length){rows.push(['','','TOTAL GENERAL','','',gc,+gk.toFixed(1)]);rk.push('t');}
  return {titulo:'Stock de materia prima — por lote (PEPS)',head:['Lote','Código','Materia prima','Proveedor','Ingreso','Stock cajas','Stock kg'],num:[0,0,0,0,0,1,1],dec:[0,0,0,0,0,0,1],rows,rk};
}

async function reloadInsumos(){
  const [{data:ins},{data:pi},{data:movs}]=await Promise.all([
    sb.from('insumos').select('*').eq('empresa_id',S.empresaId).order('nombre'),
    sb.from('producto_insumos').select('*').eq('empresa_id',S.empresaId),
    sb.from('insumo_movimientos').select('*').eq('empresa_id',S.empresaId).order('created_at',{ascending:false})
  ]);
  S.insumos=ins||[];
  const insById={};S.insumos.forEach(i=>insById[i.id]=i);const prodById={};S.productos.forEach(p=>prodById[p.id]=p.nombre);
  S.prodInsumos={};(pi||[]).forEach(x=>{const pn=prodById[x.producto_id];if(!pn)return;(S.prodInsumos[pn]=S.prodInsumos[pn]||[]).push({insumo_id:x.insumo_id,nombre:(insById[x.insumo_id]||{}).nombre||'?',unidad:(insById[x.insumo_id]||{}).unidad||'',costo:+(insById[x.insumo_id]||{}).costo||0,cantidad:+x.cantidad||0,momento:x.momento||'produccion',base:x.base||'unidad'});});
  S.insumoMovs=movs||[];
}
async function consumirInsumos(opCode,outputs){
  const delta={};outputs.forEach(o=>{(S.prodInsumos[o.producto]||[]).filter(r=>(r.momento||'produccion')==='produccion').forEach(r=>{delta[r.insumo_id]=(delta[r.insumo_id]||0)+(+o.cantidad||0)*(+r.cantidad||0);});});
  for(const id in delta){if(delta[id]<=0)continue;const ins=S.insumos.find(x=>x.id===id);const nuevo=(ins?+ins.stock:0)-delta[id];
    await sb.from('insumos').update({stock:nuevo}).eq('id',id).eq('empresa_id',S.empresaId);
    await sb.from('insumo_movimientos').insert({empresa_id:S.empresaId,insumo_id:id,tipo:'consumo',cantidad:delta[id],fecha:today(),referencia:opCode,nota:'producción'});
    if(ins)ins.stock=nuevo;}
}
async function consumirInsumosDespachoManual(dCode,list){for(const it of list){if(it.qty<=0)continue;const ins=S.insumos.find(x=>x.id===it.insumo_id);const nuevo=(ins?+ins.stock:0)-it.qty;await sb.from('insumos').update({stock:nuevo}).eq('id',it.insumo_id).eq('empresa_id',S.empresaId);await sb.from('insumo_movimientos').insert({empresa_id:S.empresaId,insumo_id:it.insumo_id,tipo:'consumo',cantidad:it.qty,fecha:today(),referencia:dCode,nota:'despacho'});if(ins)ins.stock=nuevo;}}
async function restaurarInsumos(opCode){
  const {data:movs}=await sb.from('insumo_movimientos').select('*').eq('empresa_id',S.empresaId).eq('referencia',opCode).eq('tipo','consumo');
  const agg={};(movs||[]).forEach(m=>agg[m.insumo_id]=(agg[m.insumo_id]||0)+(+m.cantidad||0));
  for(const id in agg){const ins=S.insumos.find(x=>x.id===id);const nuevo=(ins?+ins.stock:0)+agg[id];await sb.from('insumos').update({stock:nuevo}).eq('id',id).eq('empresa_id',S.empresaId);if(ins)ins.stock=nuevo;}
  if(movs&&movs.length)await sb.from('insumo_movimientos').delete().eq('empresa_id',S.empresaId).eq('referencia',opCode).eq('tipo','consumo');
}

async function reloadCostos(){const {data}=await sb.from('costos_producto').select('*').eq('empresa_id',S.empresaId);S.costos={};(data||[]).forEach(c=>{S.costos[c.producto_id]={gastos_op:+c.gastos_op||0,mano_obra:+c.mano_obra||0,flete:+c.flete||0,otros:+c.otros||0,precio_venta:+c.precio_venta||0};});}
const COSTO_N=5;
function recientesMateria(materia){return S.recepciones.filter(r=>r.estado!=='anulada'&&r.materia_prima===materia&&+r.precio_kilo>0).sort((a,b)=>((b.fecha||'').localeCompare(a.fecha||''))||((b.codigo_lote||'').localeCompare(a.codigo_lote||''))).slice(0,COSTO_N);}
function avgPriceKg(materia){let kg=0,tot=0;recientesMateria(materia).forEach(r=>{kg+=+r.kilos||0;tot+=(+r.kilos||0)*(+r.precio_kilo||0);});return kg>0?tot/kg:0;}
function descartadoMateria(materia){return (S.descartes||[]).filter(d=>d.estado!=='anulada'&&d.materia_prima===materia).reduce((s,d)=>s+(+d.kg||0),0);}
function adjPriceKg(materia){const base=avgPriceKg(materia);if(base<=0)return 0;let kgAll=0;S.recepciones.filter(r=>r.estado!=='anulada'&&r.materia_prima===materia).forEach(r=>{kgAll+=+r.kilos||0;});const usable=kgAll-descartadoMateria(materia);const factor=(kgAll>0.001&&usable>0.001)?kgAll/usable:1;return base*factor;}
function insumoCostoUnit(prodNombre){const p=S.productos.find(x=>x.nombre===prodNombre);const uxc=(p&&+p.unidades_por_caja)||1;let tot=0;const det=[];(S.prodInsumos[prodNombre]||[]).forEach(r=>{let cu;if(r.momento==='despacho'&&r.base==='caja')cu=r.cantidad*r.costo/uxc;else cu=r.cantidad*r.costo;tot+=cu;det.push({nombre:r.nombre,cu});});return {tot,det};}
function mpCostoUnit(prodNombre){let cost=0,units=0;
  S.producciones.filter(p=>p.estado!=='anulada'&&p.outputs.some(o=>o.producto===prodNombre)).forEach(p=>{
    const consumed=(p.lotes&&p.lotes.length)?p.lotes:[{loteId:p.loteId,kg:p.mpKg}];
    const mpCostProd=consumed.reduce((s,l)=>{const r=recById(l.loteId);const mat=r?r.materia_prima:'';return s+(+l.kg||0)*adjPriceKg(mat);},0);
    const totOutKg=p.outputs.reduce((s,o)=>s+(+o.kilos||0),0);
    const pOuts=p.outputs.filter(o=>o.producto===prodNombre);
    const pKg=pOuts.reduce((s,o)=>s+(+o.kilos||0),0);
    const pUnits=pOuts.reduce((s,o)=>s+(+o.cantidad||0),0);
    const share=totOutKg>0?pKg/totOutKg:(p.outputs.length?1/p.outputs.length:0);
    cost+=mpCostProd*share;units+=pUnits;});
  if(units>0)return {perUnit:cost/units,metodo:'real · precio prom. ajustado por descarte'};
  const receta=S.recetas[prodNombre]||[];
  if(receta.length){const c=receta.reduce((s,r)=>s+r.cantidad*adjPriceKg(r.mp),0);return {perUnit:c,metodo:'teórico · precio ajustado por descarte'};}
  const p=S.productos.find(x=>x.nombre===prodNombre);
  if(p&&+p.rinde>0){return {perUnit:0,metodo:'sin precio de MP cargado'};}
  return {perUnit:0,metodo:'sin datos'};
}
function viewCosteo(){const prods=[...S.productos].sort((a,b)=>a.nombre<b.nombre?-1:1);
  (($('cfg_body')||$('view'))).innerHTML=`<div class="card"><div class="card-h"><h3>Costeo de productos</h3><div style="display:flex;gap:6px">${_mBtns('costo')}</div></div>

function costeoPanel(){const prod=$('co_prod').value;const p=S.productos.find(x=>x.nombre===prod)||{};const pid=p.id;
  const ins=insumoCostoUnit(prod);const mp=mpCostoUnit(prod);const sv=S.costos[pid]||{gastos_op:0,mano_obra:0,flete:0,otros:0,precio_venta:0};
  $('co_panel').innerHTML=`
   <div class="kpis" style="grid-template-columns:repeat(2,1fr);margin-bottom:8px">
     <div class="kpi steel"><div class="lab">🥬 Costo MP / unidad</div><div class="val" id="co_mpv">${money(mp.perUnit)}</div><div class="un">${mp.metodo}</div></div>
     <div class="kpi gold"><div class="lab">📦 Costo insumos / unidad</div><div class="val" id="co_insv">${money(ins.tot)}</div><div class="un">${ins.det.length?ins.det.map(d=>d.nombre+': '+money(d.cu)).join(' · '):'sin receta de insumos'}</div></div>
   </div>
   <p class="hint" style="margin-top:6px">Valores manuales por unidad:</p>
   <div class="g2"><div><label>Gastos operacionales</label><input type="number" id="co_go" step="0.01" value="${sv.gastos_op}" oninput="costeoCalc()"></div><div><label>Mano de obra</label><input type="number" id="co_mo" step="0.01" value="${sv.mano_obra}" oninput="costeoCalc()"></div></div>
   <div class="g2"><div><label>Flete</label><input type="number" id="co_fl" step="0.01" value="${sv.flete}" oninput="costeoCalc()"></div><div><label>Otros gastos</label><input type="number" id="co_ot" step="0.01" value="${sv.otros}" oninput="costeoCalc()"></div></div>
   <label>Precio de venta de referencia (por unidad)</label><input type="number" id="co_pv" step="0.01" value="${sv.precio_venta}" oninput="costeoCalc()">
   <div id="co_result" style="margin-top:16px"></div>
   <button class="btn btn-gold" id="co_save" style="margin-top:14px" onclick="saveCosteo('${pid}')">Guardar costeo</button>`;
  window._coAuto={mp:mp.perUnit,ins:ins.tot};costeoCalc();}
function costeoCalc(){const a=window._coAuto||{mp:0,ins:0};const go=+$('co_go').value||0,mo=+$('co_mo').value||0,fl=+$('co_fl').value||0,ot=+$('co_ot').value||0,pv=+$('co_pv').value||0;
  const total=a.mp+a.ins+go+mo+fl+ot;const margen=pv-total;const margenPct=pv>0?margen/pv*100:0;
  $('co_result').innerHTML=`<table><tbody>
   <tr><td>Costo materia prima</td><td class="mono" style="text-align:right">${money(a.mp)}</td></tr>
   <tr><td>Costo insumos</td><td class="mono" style="text-align:right">${money(a.ins)}</td></tr>
   <tr><td>Gastos operacionales</td><td class="mono" style="text-align:right">${money(go)}</td></tr>
   <tr><td>Mano de obra</td><td class="mono" style="text-align:right">${money(mo)}</td></tr>
   <tr><td>Flete</td><td class="mono" style="text-align:right">${money(fl)}</td></tr>
   <tr><td>Otros gastos</td><td class="mono" style="text-align:right">${money(ot)}</td></tr>
   <tr style="border-top:2px solid var(--ink)"><td><b>Costo total / unidad</b></td><td class="mono" style="text-align:right"><b>${money(total)}</b></td></tr>
   <tr><td>Precio de venta</td><td class="mono" style="text-align:right">${money(pv)}</td></tr>
   <tr><td><b>Margen</b></td><td class="mono" style="text-align:right;color:${margen>=0?'var(--sage)':'var(--clay)'}"><b>${money(margen)} (${nf(margenPct,1)}%)</b></td></tr>
   </tbody></table>`;}
async function saveCosteo(pid){if(!pid)return banner('Producto inválido','warn');$('co_save').innerHTML='<span class="spin"></span>Guardando...';$('co_save').disabled=true;
  try{const upd={empresa_id:S.empresaId,producto_id:pid,gastos_op:+$('co_go').value||0,mano_obra:+$('co_mo').value||0,flete:+$('co_fl').value||0,otros:+$('co_ot').value||0,precio_venta:+$('co_pv').value||0};
    const {error}=await sb.from('costos_producto').upsert(upd,{onConflict:'producto_id'});if(error)throw error;
    S.costos[pid]={gastos_op:upd.gastos_op,mano_obra:upd.mano_obra,flete:upd.flete,otros:upd.otros,precio_venta:upd.precio_venta};banner('Costeo guardado','');
  }catch(err){banner('Error: '+err.message,'err');}
  $('co_save').innerHTML='Guardar costeo';$('co_save').disabled=false;}

function editDev(c){const d=S.devoluciones.find(x=>x.codigo===c);if(!d||d.estado==='anulada')return;
  if(d.tipo==='reingreso_mp'){modal(`<h3>Editar devolución ${d.codigo}</h3><p class="hint">Reingreso como materia prima. Para cambiar el destino, anulá y registrá de nuevo.</p><div class="g2"><div><label>Fecha</label><input type="date" id="edv_fecha" value="${d.fecha}"></div><div><label>Cantidad (u)</label><input type="number" id="edv_cant" step="1" value="${d.cantidad}"></div></div>${d.kg?`<label>Kilos</label><input type="number" id="edv_kg" step="0.01" value="${d.kg}">`:''}<label>Motivo</label><input id="edv_mot" value="${esc(d.motivo||'')}"><label>PIN de supervisor</label><input type="password" id="edv_pin" autocomplete="off"><div class="row"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-gold" id="edv_save" onclick="saveEditDev('${c}')">Guardar</button></div>`);return;}

  modal(`<h3>Editar devolución ${d.codigo}</h3><p class="hint">Repartí las unidades devueltas de <b>${esc(d.producto_nombre||'')}</b>${d.lote_ref?` · lote ${esc(d.lote_ref)}`:''} entre lo que <b>vuelve a stock</b> y lo que se <b>descarta</b>. Podés dejar una en 0.</p>
   <label>Fecha</label><input type="date" id="edv_fecha" value="${d.fecha}">

function edvSplitCalc(orig){const pt=Math.round(+($('edv_pt')?$('edv_pt').value:0)||0),desc=Math.round(+($('edv_desc')?$('edv_desc').value:0)||0);const el=$('edv_sum');if(!el)return;const tot=pt+desc;el.innerHTML=`↩️ ${nf(pt)} a stock · 🗑️ ${nf(desc)} a descarte · total <b>${nf(tot)}</b> u (devuelto original ${nf(orig)} u).`+(tot!==orig?` <span style="color:var(--clay)">⚠️ distinto al original</span>`:'');}
async function saveEditDev(c){const d=S.devoluciones.find(x=>x.codigo===c);if(!d)return;if(!authOK($('edv_pin').value,'editar_devolucion',c,'Edición de devolución'))return;
  const b=$('edv_save');if(b){b.innerHTML='<span class="spin"></span>...';b.disabled=true;}
  try{
    if(d.tipo==='reingreso_mp'){const upd={fecha:$('edv_fecha').value,cantidad:Math.round(+$('edv_cant').value||0),motivo:$('edv_mot').value.trim()};if($('edv_kg'))upd.kg=+$('edv_kg').value||0;const {error}=await sb.from('devoluciones').update(upd).eq('empresa_id',S.empresaId).eq('id',d.id);if(error)throw error;}
    else{
      const pt=Math.round(+($('edv_pt')?$('edv_pt').value:0)||0),desc=Math.round(+($('edv_desc')?$('edv_desc').value:0)||0);
      if(pt+desc<=0)throw new Error('Indicá al menos una cantidad (stock o descarte)');
      const fecha=$('edv_fecha').value,motivo=$('edv_mot').value.trim();
      const splits=[];if(pt>0)splits.push({tipo:'reingreso_pt',cant:pt});if(desc>0)splits.push({tipo:'descarte',cant:desc});
      const prim=splits[0];
      const {error:eu}=await sb.from('devoluciones').update({fecha,motivo,tipo:prim.tipo,cantidad:prim.cant,kg:0,reingreso_lote:null,materia_prima:null}).eq('empresa_id',S.empresaId).eq('id',d.id);if(eu)throw eu;
      for(let k=1;k<splits.length;k++){const s=splits[k];const {data:num,error:en}=await sb.rpc('siguiente_numero',{p_tipo:'dev'});if(en)throw en;const codigo='DEV-'+pad(num);const {error:ei}=await sb.from('devoluciones').insert({empresa_id:S.empresaId,codigo,fecha,cliente_id:d.cliente_id||null,cliente_nombre:d.cliente_nombre||'',despacho_codigo:d.despacho_codigo||null,output_code:d.output_code||null,producto_nombre:d.producto_nombre,cantidad:s.cant,lote_ref:d.lote_ref||null,tipo:s.tipo,materia_prima:null,kg:0,reingreso_lote:null,motivo});if(ei)throw ei;}
    }
    await reloadDevoluciones();await reloadRecepciones();closeModal();banner('Devolución actualizada','');render();
  }catch(err){banner('Error: '+err.message,'err');const b2=$('edv_save');if(b2){b2.innerHTML='Guardar';b2.disabled=false;}}
}
function anularDev(c){const d=S.devoluciones.find(x=>x.codigo===c);if(!d||d.estado==='anulada')return;const efecto=d.tipo==='reingreso_pt'?'Se quita el reingreso al stock de producto terminado.':d.tipo==='reingreso_mp'?('Se anula el lote de reingreso '+esc(d.reingreso_lote||'')+' (su stock desaparece).'):'Sin efecto en stock (era descarte).';modal(`<h3>🔒 Anular devolución ${d.codigo}</h3><p class="hint">${efecto}</p><label>PIN de supervisor</label><input type="password" id="andv_pin" autocomplete="off"><div class="row"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-danger" id="andv_save" onclick="doAnularDev('${c}')">Anular</button></div>`);}
async function doAnularDev(c){const d=S.devoluciones.find(x=>x.codigo===c);if(!d)return;if(!authOK($('andv_pin').value,'anular_devolucion',c,'Anulación de devolución'))return;$('andv_save').innerHTML='<span class="spin"></span>...';$('andv_save').disabled=true;try{const {error}=await sb.from('devoluciones').update({estado:'anulada'}).eq('empresa_id',S.empresaId).eq('id',d.id);if(error)throw error;if(d.tipo==='reingreso_mp'&&d.reingreso_lote){await sb.from('recepciones').update({estado:'anulada'}).eq('empresa_id',S.empresaId).eq('codigo_lote',d.reingreso_lote);}await reloadDevoluciones();await reloadRecepciones();closeModal();banner('Devolución anulada','warn');render();}catch(err){banner('Error: '+err.message,'err');$('andv_save').innerHTML='Anular';$('andv_save').disabled=false;}}
function detalleAcond(c){const a=(S.acond||[]).find(x=>x.id===c);if(!a)return;const merma=Math.max(0,a.kgEnt-a.kgSal);const rinde=a.kgEnt>0?a.kgSal/a.kgEnt*100:0;modal(`<h3>Acondicionamiento ${a.id}</h3><div style="font-size:13px;line-height:1.9"><b>Fecha:</b> ${fmtD(a.fecha)}<br><b>Proceso:</b> ${esc(a.proceso||'Pelado')}<br><b>Materia prima:</b> ${esc(a.materia||'—')}<br><b>Entrada:</b> ${nf(a.kgEnt,1)} kg<br><b>Salida:</b> ${nf(a.kgSal,1)} kg de ${esc(a.prodSal||'')} · lote ${esc(a.loteSal||'—')}<br><b>Cajas salida:</b> ${nf(a.cajasSal)}<br><b>Merma:</b> ${nf(merma,1)} kg · Rinde ${nf(rinde,0)}%<br><b>Operarios:</b> ${nf(a.operarios)} · <b>Horas:</b> ${nf(a.horas,1)}<br><b>Estado:</b> ${a.estado==='anulada'?'<span class="tag out">Anulada</span>':'<span class="tag ok">Activa</span>'}</div><div class="row"><button class="btn btn-gold" onclick="closeModal()">Cerrar</button></div>`);}
function editAcond(c){const a=(S.acond||[]).find(x=>x.id===c);if(!a||a.estado==='anulada')return;modal(`<h3>Editar acondicionamiento ${a.id}</h3><div class="g2"><div><label>Fecha</label><input type="date" id="eda_fecha" value="${a.fecha}"></div><div><label>Proceso</label><input id="eda_proc" value="${esc(a.proceso||'Pelado')}"></div></div><div class="g2"><div><label>Kg entrada</label><input type="number" id="eda_ent" step="0.01" value="${a.kgEnt}"></div><div><label>Kg salida</label><input type="number" id="eda_sal" step="0.01" value="${a.kgSal}"></div></div><div class="g2"><div><label>Cajas salida</label><input type="number" id="eda_cajas" value="${a.cajasSal}"></div><div><label>Operarios</label><input type="number" id="eda_op" value="${a.operarios||''}"></div></div><label>Horas</label><input type="number" step="0.1" id="eda_hs" value="${a.horas||''}"><div class="scan-note" style="margin:4px 0">Cambiar los kg de salida también ajusta el stock del lote pelado.</div><label>PIN de supervisor</label><input type="password" id="eda_pin" autocomplete="off"><div class="row"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-gold" id="eda_save" onclick="saveEditAcond('${c}')">Guardar</button></div>`);}
async function saveEditAcond(c){const a=(S.acond||[]).find(x=>x.id===c);if(!a)return;if(!authOK($('eda_pin').value,'editar_acondicionamiento',c,'Edición de acondicionamiento'))return;const kgSal=+$('eda_sal').value||0,cajasSal=+$('eda_cajas').value||0;$('eda_save').innerHTML='<span class="spin"></span>...';$('eda_save').disabled=true;try{const {error}=await sb.from('acondicionamientos').update({fecha:$('eda_fecha').value,proceso:$('eda_proc').value.trim(),kg_entrada:+$('eda_ent').value||0,kg_salida:kgSal,cajas_salida:cajasSal,operarios:+$('eda_op').value||0,horas:+$('eda_hs').value||0}).eq('empresa_id',S.empresaId).eq('id',a.uuid);if(error)throw error;await reloadAcond();if(a.recSalId){await recalcPeladoRec(a.recSalId);}await reloadRecepciones();closeModal();banner('Acondicionamiento actualizado','');render();}catch(err){banner('Error: '+err.message,'err');$('eda_save').innerHTML='Guardar';$('eda_save').disabled=false;}}

function devPickDesp(){const v=$('dv_desp').value;if(v===''){return;}const d=despForDev()[+v];$('dv_prod').value=d.producto||'';$('dv_prod').dataset.out=d.outputCode||'';$('dv_prod').dataset.lote=d.lote||'';$('dv_prod').dataset.dcode=d.code||'';if(!$('dv_cant').value)$('dv_cant').value=d.cant||'';devKg();}
function devScan(){const i=$('dv_scan');if(!i)return;let v=(i.value||'').trim();if(!v)return;try{const o=JSON.parse(v);v=o.lote||o.op||o.code||v;}catch(e){}v=fixCode(v);const nv=normCode(v);const list=despForDev();let idx=list.findIndex(d=>(d.lotesAll||[]).some(l=>normCode(l)===nv)||normCode(d.code)===nv||(d.outputs||[]).some(oc=>normCode(oc)===nv));if(idx<0)idx=list.findIndex(d=>(d.lotesAll||[]).some(l=>normCode(l).includes(nv))||normCode(d.code).includes(nv));if(idx<0)return banner('No encontré un despacho para "'+v+'"','warn');const sel=$('dv_desp');if(sel){sel.value=String(idx);devPickDesp();i.value='';banner('Despacho '+list[idx].code+' · lote '+list[idx].lote+' seleccionado','');}}
function devKg(){const tipo=$('dv_tipo').value;if(tipo==='reingreso_pt')return;const prod=$('dv_prod').value;const info=prodInfo(prod);const cant=+$('dv_cant').value||0;const kgEl=$('dv_kg');if(kgEl&&!kgEl.dataset.touch)kgEl.value=+(cant*(info.contenido||0)).toFixed(3);}
function devTipo(){const t=$('dv_tipo').value;const ex=$('dv_extra');
  if(t==='reingreso_mp'){const prod=$('dv_prod').value;const mpGuess=(S.prodMP[prod]&&S.prodMP[prod][0])||'';ex.innerHTML=`<div class="note" style="margin:8px 0">El producto se desempaca y vuelve a cámara como materia prima. Se crea un lote nuevo de reingreso. Los insumos (envases/etiquetas) ya consumidos no se recuperan.</div><div class="g2"><div><label>Materia prima</label>${apair('dv_mp','mp','Buscar MP por código o nombre…',mpGuess,'','')}</div><div><label>Kilos a reingresar</label><input type="number" id="dv_kg" step="0.01" oninput="this.dataset.touch=1"></div></div>`;devKg();}
  else if(t==='descarte'){ex.innerHTML=`<div class="note" style="margin:8px 0">Se registra como descarte. No vuelve al stock. Queda en la trazabilidad para respaldo y nota de crédito.</div><label>Kilos descartados (opcional)</label><input type="number" id="dv_kg" step="0.01" oninput="this.dataset.touch=1">`;devKg();}
  else{ex.innerHTML=`<div class="note" style="margin:8px 0">Las unidades vuelven al stock de producto terminado bajo el mismo lote y quedan disponibles para re-despachar.</div>`;}
}
async function saveDev(){const cant=Math.round(+$('dv_cant').value||0);const prod=$('dv_prod').value.trim();const tipo=$('dv_tipo').value;
  if(!prod)return banner('Indicá el producto','warn');if(cant<=0)return banner('Indicá la cantidad','warn');
  const cli=S.clientes.find(c=>c.id===$('dv_cli').value)||{};
  $('dv_save').innerHTML='<span class="spin"></span>Registrando...';$('dv_save').disabled=true;
  try{
    const {data:num,error:e1}=await sb.rpc('siguiente_numero',{p_tipo:'dev'});if(e1)throw e1;
    const codigo='DEV-'+pad(num);const fecha=$('dv_fecha').value;
    let reingreso_lote=null;const mp=$('dv_mp')?$('dv_mp').value.trim():null;const kg=$('dv_kg')?+$('dv_kg').value||0:0;
    if(tipo==='reingreso_mp'){
      if(!mp)throw new Error('Indicá la materia prima del reingreso');if(kg<=0)throw new Error('Indicá los kilos a reingresar');
      const {data:ln,error:e2}=await sb.rpc('siguiente_numero',{p_tipo:'lote'});if(e2)throw e2;reingreso_lote='L-'+pad(ln);
      const {error:e3}=await sb.from('recepciones').insert({empresa_id:S.empresaId,codigo_lote:reingreso_lote,fecha,proveedor:'Reingreso devolución '+codigo,materia_prima:mp,cajas:0,kilos:kg,precio_kilo:0,total:0,estado:'activa',recibido_por:'Devolución'});
      if(e3)throw e3;
    }
    const {error:e4}=await sb.from('devoluciones').insert({empresa_id:S.empresaId,codigo,fecha,cliente_id:cli.id||null,cliente_nombre:cli.razon_social||'',despacho_codigo:$('dv_prod').dataset.dcode||null,output_code:$('dv_prod').dataset.out||null,producto_nombre:prod,cantidad:cant,lote_ref:$('dv_prod').dataset.lote||null,tipo,materia_prima:mp,kg,reingreso_lote,motivo:$('dv_motivo').value.trim()});
    if(e4)throw e4;
    await reloadDevoluciones();
    await reloadEnsamblados();
    await reloadDescartes();if(tipo==='reingreso_mp')await reloadRecepciones();
    banner('Devolución '+codigo+' registrada','');render();
  }catch(err){banner('Error: '+err.message,'err');$('dv_save').innerHTML='Registrar devolución';$('dv_save').disabled=false;}
}

function cargaStart(){const id=$('cg_sel').value;if(!id){cargaState=null;$('cg_panel').innerHTML='';return;}const e=S.entregas.find(x=>x.id===id);let groups;if(e.es_muestra){const em={},eo=[],normL=[];e.items.forEach(it=>{const k=it.producto||'';if(esMuestraCaja(k)){if(!(k in em)){em[k]={producto:k,units:0,lotes:[]};eo.push(k);}em[k].units+=(+it.cantidad||0);if(it.loteRef)em[k].lotes.push(it.loteRef);}else{if(it.loteRef)normL.push(it.loteRef);}});groups=eo.map(k=>({producto:k,units:em[k].units,esperado:remCajasProd(k,em[k].units),lotes:em[k].lotes}));if(e.items.some(it=>!esMuestraCaja(it.producto)))groups.push({producto:'Muestras varias (1 paq. c/u)',units:0,esperado:1,lotes:normL});}else{const gm={},ord=[];e.items.forEach(it=>{const k=it.producto||'';if(!(k in gm)){gm[k]={producto:k,units:0,lotes:[]};ord.push(k);}gm[k].units+=(+it.cantidad||0);if(it.loteRef)gm[k].lotes.push(it.loteRef);});groups=ord.map(k=>({producto:k,units:gm[k].units,esperado:remCajasProd(k,gm[k].units),lotes:gm[k].lotes}));}cargaState={entregaId:id,groups,loaded:groups.map(()=>0),extras:[]};cargaRender();}
function cargaRender(){const e=S.entregas.find(x=>x.id===cargaState.entregaId);if(!e)return;const G=cargaState.groups||[];
  const rows=G.map((g,i)=>{const exp=g.esperado;const ld=cargaState.loaded[i];const ok=ld===exp;return `<tr><td>${esc(g.producto)}</td><td class="mono">${esc(g.lotes.join(', ')||'—')}</td><td class="mono">${exp}</td><td class="mono"><b style="color:${ok?'var(--sage)':ld>exp?'var(--clay)':'var(--ink)'}">${ld}</b></td><td style="white-space:nowrap"><button class="btn btn-ghost btn-sm" onclick="cargaAdj(${i},-1)">−</button> <button class="btn btn-ghost btn-sm" onclick="cargaAdj(${i},1)">+</button></td><td>${ok?'✅':ld>exp?'⚠️ sobra':'⏳'}</td></tr>`;}).join('');
  const totExp=G.reduce((s,g)=>s+g.esperado,0);const totLd=cargaState.loaded.reduce((a,b)=>a+b,0);
  $('cg_panel').innerHTML=`<div style="margin:12px 0"><label>Escanear QR de caja</label><input id="cg_scan" placeholder="el lector escribe acá y suma 1 caja" autocomplete="off"></div>
   <div style="overflow:auto"><table><thead><tr><th>Producto</th><th>Lote</th><th>Esperadas</th><th>Cargadas</th><th>Ajuste</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
   ${cargaState.extras.length?`<div class="note" style="margin-top:10px">⚠️ <b>${cargaState.extras.length} caja(s) escaneada(s) que no pertenecen a este remito:</b> ${cargaState.extras.join(', ')}</div>`:''}
   <div class="scan-note" style="margin-top:8px">Total cargado: <b>${totLd}</b> / ${totExp} cajas</div>
   <button class="btn btn-gold" style="margin-top:12px" onclick="cargaValidar()">✓ Validar e imprimir remito</button>`;
  const sc=$('cg_scan');if(sc){sc.focus();sc.addEventListener('keydown',ev=>{if(ev.key==='Enter'){cargaScan(sc.value);sc.value='';}});}
}
function cargaScan(txt){if(!txt)return;let lote='';try{const o=JSON.parse(txt);lote=(o.lote||'').toString();}catch(e){lote=txt.trim();}
  lote=fixCode(lote);const nl=normCode(lote);
  const G=cargaState.groups||[];let idx=-1;
  const coincide=g=>g.lotes.some(l=>normCode(l)===nl||(l||'').split('+').some(x=>normCode(x)===nl));
  G.forEach((g,i)=>{if(idx<0&&coincide(g)&&cargaState.loaded[i]<g.esperado)idx=i;});
  if(idx<0)G.forEach((g,i)=>{if(idx<0&&coincide(g))idx=i;});
  if(idx>=0){cargaState.loaded[idx]++;banner('Caja sumada: '+G[idx].producto,'');}
  else{cargaState.extras.push(lote||'?');banner('Caja no pertenece a este remito','warn');}
  cargaRender();
}
function cargaAdj(i,d){cargaState.loaded[i]=Math.max(0,cargaState.loaded[i]+d);cargaRender();}
function cargaDifs(){const G=cargaState.groups||[];const dif=[];G.forEach((g,i)=>{const exp=g.esperado,ld=cargaState.loaded[i];if(ld!==exp)dif.push({producto:g.producto,esperado:exp,cargado:ld});});return dif;}
function cargaValidar(){const dif=cargaDifs();const hayDif=dif.length>0||cargaState.extras.length>0;
  if(!hayDif)return cargaGuardar(false,'');
  modal(`<h3>Hay diferencias en la carga</h3><p class="hint">${dif.map(d=>`${d.producto}: esperadas ${d.esperado}, cargadas ${d.cargado}`).join('<br>')}${cargaState.extras.length?`<br>${cargaState.extras.length} caja(s) ajenas`:''}</p><label>PIN del supervisor para autorizar</label><input type="password" id="cg_pin" autocomplete="off"><label>Nota (motivo de la diferencia)</label><input id="cg_nota" placeholder="ej: faltó 1 caja, se despacha igual"><div class="row"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-gold" onclick="cargaPinOk()">Autorizar y validar</button></div>`);
}
function cargaPinOk(){const nota=$('cg_nota').value.trim();if(!authOK($('cg_pin').value,'validar_carga_dif',null,'Validó carga con diferencias'+(nota?': '+nota:'')))return;closeModal();cargaGuardar(true,nota);}
async function cargaGuardar(forzado,nota){const e=S.entregas.find(x=>x.id===cargaState.entregaId);const dif=cargaDifs();
  const validado={carga:true,at:new Date().toISOString(),by:S.nombre||'',forzado,dif,extras:cargaState.extras,nota};
  const {error}=await sb.from('entregas').update({validado}).eq('id',e.id).eq('empresa_id',S.empresaId);
  if(error)return banner('Error: '+error.message,'err');
  const remData={nro:e.numero_remito,fecha:e.fecha,cliData:S.clientes.find(c=>c.id===e.cliente_id)||{},items:e.items,oc:e.orden_compra,muestra:e.es_muestra};
  await reloadEntregas();cargaState=null;banner(forzado?'Carga validada con diferencias · imprimí el remito':'Carga validada ✓ · imprimí el remito','');render();
  renderRemito(remData);
}

async function reloadEnsamblados(){const {data}=await sb.from('ensamblado_consumos').select('*').eq('empresa_id',S.empresaId);S.ensConsumos=(data||[]).map(c=>({ensamblado_op:c.ensamblado_op,componente:c.componente,output_code:c.output_code,codigo_lote:c.codigo_lote,cantidad:+c.cantidad||0}));}
function loteOrigenOutput(prod){return prod.loteId||((prod.lotes&&prod.lotes[0])?prod.lotes[0].loteId:'')||prod.id;}
function alocarProductoPEPS(prodNombre,unidades){const outs=[];S.producciones.filter(p=>p.estado!=='anulada'&&p.id.indexOf('E-')!==0).sort((a,b)=>a.fecha<b.fecha?-1:1).forEach(p=>{p.outputs.filter(o=>o.producto===prodNombre).forEach(o=>{outs.push({o,prod:p});});});
  const asign=[];let rem=unidades;for(const x of outs){const av=stockOut(x.o);if(av<=0)continue;const take=Math.min(av,rem);if(take<=0)break;asign.push({output_code:x.o.code,codigo_lote:loteOrigenOutput(x.prod),fecha:x.prod.fecha,cantidad:take});rem-=take;if(rem<=0)break;}return {asign,falta:Math.max(0,rem)};}
function viewEns(){const ensProds=S.productos.filter(p=>p.tipo==='comp_ensamblado');
  if(!ensProds.length){$('view').innerHTML=`<div class="card"><div class="empty" style="padding:30px"><div style="font-size:36px">🌿</div><h3>Sin productos de ensamblado</h3><p>Marcá un producto como compuesto de ensamblado y cargá su receta de componentes.</p></div></div>`;return;}

   <p class="hint">Arma un pack a partir de productos ya terminados. La receta viene por defecto pero podés <b>editarla o sustituir</b> componentes si falta stock. Cada componente se toma del lote más antiguo (PEPS) y queda trazado.</p>
   <div class="g2"><div><label>Producto a ensamblar</label>${apair('en_prod','','Buscar producto a ensamblar…',(ensProds[0]?ensProds[0].nombre:''),'','ensLoadReceta()',apArrProd(ensProds))}</div><div><label>Cantidad de packs</label><input type="number" id="en_paq" min="1" oninput="ensCalc()"></div></div>

}
function ensLoadReceta(){const prod=$('en_prod').value;window._ensReceta=(S.componentes[prod]||[]).map(r=>({componente:r.componente,cantidad:r.cantidad}));ensRenderReceta();ensCalc();}
function ensRenderReceta(){const rec=window._ensReceta||[];const opts=[...S.productos].sort((a,b)=>a.nombre<b.nombre?-1:1).map(p=>p.nombre);

function ensRecComp(i,v){window._ensReceta[i].componente=v;ensCalc();}
function ensRecQty(i,v){window._ensReceta[i].cantidad=+v||0;ensCalc();}

function ensRecAdd(){const opts=[...S.productos].sort((a,b)=>a.nombre<b.nombre?-1:1);window._ensReceta.push({componente:opts[0]?opts[0].nombre:'',cantidad:1});ensRenderReceta();ensCalc();}
function ensRows(){const ops=S.producciones.filter(p=>p.id.indexOf('E-')===0&&p.estado!=='anulada').slice(0,12);return ops.map(p=>{const o=p.outputs[0]||{};const comps=S.ensConsumos.filter(c=>c.ensamblado_op===p.id);return `<tr><td class="mono">${p.id}</td><td>${fmtD(p.fecha)}</td><td>${(o.producto||'').slice(0,20)}</td><td class="mono">${nf(o.cantidad||0)}</td><td style="font-size:11px">${comps.map(c=>c.componente.split(' ')[0]+' '+c.codigo_lote).join(' · ')}</td></tr>`;}).join('')||'<tr><td colspan=5 class=empty>Sin ensamblados</td></tr>';}
function ensCalc(){const paq=+$('en_paq').value||0;const receta=window._ensReceta||[];
  if(!receta.length){$('en_calc').innerHTML='';return;}
  let html='<div style="font-size:13px;line-height:1.8">',ok=true;
  receta.forEach(r=>{if(!r.componente||r.cantidad<=0)return;const nec=paq*r.cantidad;const {asign,falta}=alocarProductoPEPS(r.componente,nec);if(falta>0)ok=false;

async function guardarReceta(){const prod=$('en_prod').value;const rec=(window._ensReceta||[]).filter(r=>r.componente&&r.cantidad>0);const pid=prodIdByName(prod);
  if(!pid)return banner('Producto inválido','warn');

async function generarEnsamblado(){const prod=$('en_prod').value;const paq=+$('en_paq').value||0;const fecha=$('en_fecha').value;const info=prodInfo(prod);
  if(paq<=0)return banner('Indicá la cantidad de packs','warn');

  const consumos=[];for(const r of receta){const nec=paq*r.cantidad;const {asign,falta}=alocarProductoPEPS(r.componente,nec);if(falta>0)return banner('No alcanza el stock de '+r.componente+' (faltan '+nf(falta)+'u). Sustituí ese componente.','warn');asign.forEach(a=>consumos.push({componente:r.componente,output_code:a.output_code,codigo_lote:a.codigo_lote,cantidad:a.cantidad}));}
  $('en_gen').innerHTML='<span class="spin"></span>Generando...';$('en_gen').disabled=true;

    const {data:nP,error:e2}=await sb.rpc('siguiente_numero',{p_tipo:'prod'});if(e2)throw e2;const prCode='PR-'+pad(nP);
    const kilos=+(paq*(info.contenido||0)).toFixed(3);
    const {data:pRow,error:e3}=await sb.from('producciones').insert({empresa_id:S.empresaId,codigo_op:codigo,recepcion_id:null,fecha,mp_kg:kilos,operarios:0,estado:'validada',validado_at:new Date().toISOString()}).select('id').single();
    if(e3)throw e3;

    if(e4)throw e4;
    const rows=consumos.map(c=>({empresa_id:S.empresaId,ensamblado_op:codigo,componente:c.componente,output_code:c.output_code,codigo_lote:c.codigo_lote,cantidad:c.cantidad}));
    const {error:e5}=await sb.from('ensamblado_consumos').insert(rows);if(e5)throw e5;
    await reloadProducciones();await reloadEnsamblados();
    await consumirInsumos(codigo,[{producto:prod,cantidad:paq}]);await reloadInsumos();
    banner('Ensamblado '+codigo+' generado · '+paq+' packs','');render();
  }catch(err){banner('Error: '+err.message,'err');$('en_gen').innerHTML='🌿 Generar ensamblado';$('en_gen').disabled=false;}
}

function nextCorrCod(list,fallbackPrefix){const rx=/^([A-Za-z]+)[-_ ]?([0-9]+)$/;const groups={};(list||[]).forEach(o=>{const c=(o.codigo||'').trim();const m=c.match(rx);if(!m)return;const pre=m[1].toUpperCase();const g=groups[pre]||(groups[pre]={count:0,max:0,width:0});g.count++;const nn=parseInt(m[2],10);if(nn>g.max)g.max=nn;if(m[2].length>g.width)g.width=m[2].length;});let pre=(fallbackPrefix||'').toUpperCase(),best=null;Object.keys(groups).forEach(k=>{if(!best||groups[k].count>best.count){best=groups[k];pre=k;}});const width=best?Math.max(best.width,3):3;const next=(best?best.max:0)+1;return pre+String(next).padStart(width,'0');}

function apairNom(key){const src=apSrc(key);const fi=$(key+'__f');const q=(fi?fi.value:'').trim().toLowerCase();const matches=q?src.filter(o=>(o.nombre||'').toLowerCase().includes(q)||(o.cod||'').toLowerCase().includes(q)):src;window._mselCur[key]=matches;const l=$(key+'__l');if(!l)return;const cap=matches.slice(0,60);l.innerHTML=cap.map((o,i)=>`<div class="msel-i" onmousedown="apairPickN('${key}',${i})">${o.cod?'<span style="font-family:monospace;color:var(--muted);font-size:11px">'+esc(o.cod)+'</span>&nbsp;&nbsp;':''}${esc(o.nombre)}</div>`).join('')+(matches.length===0?'<div class="msel-none">Sin coincidencias.</div>':'')+(matches.length>60?'<div class="msel-m">+'+(matches.length-60)+' más… seguí escribiendo</div>':'');l.style.display='block';}
function apairSet(key,o){const h=$(key),fi=$(key+'__f'),cd=$(key+'__cod');const _old=h?h.value:'';if(fi)fi.value=o.nombre;if(cd)cd.value=o.cod||'';if(h){h.value=(apVal(o)+'');h.dataset.id=o.id||'';if(_old!==h.value){try{h.dispatchEvent(new Event('change',{bubbles:true}));}catch(e){}}}if(MSEL_PICK[key]){try{MSEL_PICK[key]();}catch(e){}}}
function apairPickN(key,i){const o=(window._mselCur[key]||[])[i];if(!o)return;const l=$(key+'__l');if(l)l.style.display='none';apairSet(key,o);}
function apairCodInput(key){const cd=$(key+'__cod');if(!cd)return;const cod=(cd.value||'').trim().toUpperCase();if(!cod)return;const o=apSrc(key).find(x=>(x.cod||'').toUpperCase()===cod);if(o)apairSet(key,o);}
function apairCodEnter(key){const cd=$(key+'__cod');if(!cd)return;const cod=(cd.value||'').trim().toUpperCase();if(!cod)return;const o=apSrc(key).find(x=>(x.cod||'').toUpperCase()===cod);if(o)apairSet(key,o);}
function apairNomBlur(key){setTimeout(()=>{const l=$(key+'__l');if(l)l.style.display='none';const fi=$(key+'__f');if(!fi)return;const _q=(fi.value||'').trim().toLowerCase();const h=$(key),cd=$(key+'__cod');const o=apSrc(key).find(x=>(x.nombre||'').toLowerCase()===_q);if(o){apairSet(key,o);}else if(fi.value.trim()===''){if(h){const _old=h.value;h.value='';h.dataset.id='';if(cd)cd.value='';if(_old!==''){try{h.dispatchEvent(new Event('change',{bubbles:true}));}catch(e){}}}}else{const cur=h?h.value:'';const o2=apSrc(key).find(x=>((apVal(x))+'')===(cur+''));fi.value=o2?o2.nombre:'';if(cd)cd.value=o2?o2.cod:'';}},200);}

function mselSrcFor(key){if(MSEL_SRC[key]){try{return MSEL_SRC[key]()||[];}catch(e){return [];}}const _a=(window._mselSrcArr||{})[key];if(_a)return _a;const k=(window._mselKind||{})[key];try{if(k==='prod')return prodPickSrc();if(k==='mp')return mpMaster();if(k==='cli')return cliPickSrc();if(k==='prov')return provPickSrc();}catch(e){}return [];}
function _mselDisp(key,cur){cur=(cur==null?'':cur);if(cur==='')return '';try{const _s=mselSrcFor(key);const _h=_s.find(o=>((oval(o))+'')===(cur+'')||((o.v+'')===(cur+'')));if(_h)return _h.v;}catch(e){}return cur;}
function msel(key,ph,cur){cur=cur||'';const disp=_mselDisp(key,cur);return `<div class="msel"><input type="hidden" id="${key}" value="${esc(cur)}"><input class="msel-f" id="${key}__f" autocomplete="off" placeholder="${esc(ph||'Buscar…')}" value="${esc(disp)}" oninput="mselFilter('${key}')" onfocus="mselFilter('${key}')" onblur="mselBlur('${key}')"><div class="msel-list" id="${key}__l" style="display:none"></div></div>`;}
function mpick(key,kind,ph,cur,cls,onch,arr){window._mselKind=window._mselKind||{};window._mselKind[key]=kind;if(arr){window._mselSrcArr=window._mselSrcArr||{};window._mselSrcArr[key]=arr;}cur=(cur==null?'':cur);const disp=_mselDisp(key,cur);return `<div class="msel"><input type="hidden" id="${key}"${cls?` class="${cls}"`:''}${onch?` onchange="${onch}"`:''} value="${esc(cur)}"><input class="msel-f" id="${key}__f" autocomplete="off" placeholder="${esc(ph||'Buscar…')}" value="${esc(disp)}" oninput="mselFilter('${key}')" onfocus="mselFilter('${key}')" onblur="mselBlur('${key}')"><div class="msel-list" id="${key}__l" style="display:none"></div></div>`;}
function mselFilter(key){const src=mselSrcFor(key);const fi=$(key+'__f');const q=(fi?fi.value:'').trim().toLowerCase();const matches=q?src.filter(o=>(o.v||'').toLowerCase().includes(q)):src;window._mselCur[key]=matches;const l=$(key+'__l');if(!l)return;const cap=matches.slice(0,60);l.innerHTML=cap.map((o,i)=>`<div class="msel-i" onmousedown="mselPick('${key}',${i})">${esc(o.v)}</div>`).join('')+(matches.length>60?`<div class="msel-m">+${matches.length-60} más… seguí escribiendo para filtrar</div>`:'')+(matches.length===0?`<div class="msel-none">Sin coincidencias.</div>`:'');l.style.display='block';}
function mselPick(key,i){const o=(window._mselCur[key]||[])[i];if(!o)return;const h=$(key);const fi=$(key+'__f');if(fi)fi.value=o.v;const l=$(key+'__l');if(l)l.style.display='none';if(h){const _old=h.value;h.value=(oval(o)+'');h.dataset.id=o.id||'';if(_old!==h.value){try{h.dispatchEvent(new Event('change',{bubbles:true}));}catch(e){}}}if(MSEL_PICK[key]){try{MSEL_PICK[key]();}catch(e){}}}
function mselBlur(key){setTimeout(()=>{const l=$(key+'__l');if(l)l.style.display='none';const fi=$(key+'__f'),h=$(key);if(fi&&h){const src=mselSrcFor(key);const _q=fi.value.trim().toLowerCase();const hit=src.find(o=>(o.v||'').toLowerCase()===_q||(o.nombre!=null&&(o.nombre+'').toLowerCase()===_q)||((oval(o)+'').toLowerCase()===_q));const _old=h.value;if(hit){h.value=(oval(hit)+'');h.dataset.id=hit.id||'';fi.value=hit.v;}else{h.value='';h.dataset.id='';}if(_old!==h.value){try{h.dispatchEvent(new Event('change',{bubbles:true}));}catch(e){}}}},200);}

// ---- MATERIAS PRIMAS (maestro) ----
function mpDerived(){const set=new Set();(S.materias||[]).forEach(n=>{if(n)set.add((''+n).toUpperCase());});(S.recepciones||[]).forEach(r=>{if(r.materia_prima&&r.origen!=='reventa')set.add((''+r.materia_prima).toUpperCase());});(S.descartes||[]).forEach(d=>{if(d.materia_prima)set.add((''+d.materia_prima).toUpperCase());});return [...set].sort().map(n=>({v:n,id:''}));}
function mpMaster(){const m=S.materiasPrimas;if(m&&m.length)return m.filter(x=>x.activo!==false).map(x=>({v:x.codigo?`[${x.codigo}] ${(x.nombre||'').toUpperCase()}`:(x.nombre||'').toUpperCase(),id:x.id,nombre:(x.nombre||'').toUpperCase()}));return mpDerived();}
async function reloadMaterias(){try{const {data,error}=await sb.from('materias_primas').select('*').eq('empresa_id',S.empresaId).order('nombre');if(error)throw error;S.materiasPrimas=data||[];}catch(e){S.materiasPrimas=null;}}
let cfgMatQ='';
function cfgMat(){const has=Array.isArray(S.materiasPrimas);const q=cfgMatQ.toLowerCase();
  const base=has?S.materiasPrimas.slice():mpDerived().map(o=>({nombre:o.v,activo:true,_derived:true}));
  const list=base.filter(m=>!q||(m.nombre||'').toLowerCase().includes(q)||(m.codigo||'').toLowerCase().includes(q));
  $('cfg_body').innerHTML=`${has?'':`<div class="note" style="margin-bottom:12px;border-left:4px solid #e0b83a"><b>Falta migrar.</b> Todavía no existe la tabla <code>materias_primas</code>. Estás viendo la lista derivada (solo lectura). Corré <code>materias_primas_setup.sql</code> en Supabase para poder dar de alta y editar materias primas.</div>`}
   <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap"><input id="mt_q" placeholder="Buscar por código o nombre..." value="${esc(cfgMatQ)}" oninput="cfgMatQ=this.value;cfgMat();setTimeout(()=>{const i=document.getElementById('mt_q');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length);}},0)" style="flex:1;min-width:180px">${has?`<input id="mt_cod" placeholder="Código (ej: ACE01)" style="width:110px" onkeydown="if(event.key==='Enter')addMateria()"><input id="mt_nom" placeholder="Nueva materia prima (ej: ACELGA)" style="flex:1;min-width:160px" onkeydown="if(event.key==='Enter')addMateria()"><button class="btn btn-gold btn-sm" onclick="addMateria()">+ Agregar</button>`:''} ${_mBtns('mat')}</div>
   <div style="overflow:auto"><table><thead><tr><th>Código</th><th>Materia prima</th><th>Estado</th><th></th></tr></thead><tbody>${list.map(m=>`<tr style="${m.activo===false?'opacity:.5':''}"><td class="mono" style="font-size:11px;color:var(--muted)">${m.codigo||'—'}</td><td>${esc((m.nombre||'').toUpperCase())}</td><td><span class="tag ${m.activo===false?'out':'ok'}">${m.activo===false?'Inactiva':'Activa'}</span></td><td style="white-space:nowrap">${(has&&!m._derived)?`<button class="btn btn-ghost btn-sm" onclick="editMateria('${m.id}')">Editar</button> <button class="btn btn-ghost btn-sm" onclick="toggleMateria('${m.id}')">${m.activo===false?'Activar':'Baja'}</button>`:'<span class="hint">—</span>'}</td></tr>`).join('')||'<tr><td colspan=4 class=empty>Sin materias primas</td></tr>'}</tbody></table></div>
   <p class="hint" style="margin-top:8px">${list.length} materia(s) prima(s). En Recepción la materia prima se elige desde esta lista (no se puede tipear una nueva).</p>`;}
async function addMateria(){const nom=($('mt_nom')?$('mt_nom').value.trim().toUpperCase():'');const cod=($('mt_cod')?$('mt_cod').value.trim().toUpperCase():'');if(!nom)return banner('Indicá el nombre','warn');if(!cod)return banner('Indicá el código (ej: ESP01)','warn');if((S.materiasPrimas||[]).some(m=>(m.nombre||'').toUpperCase()===nom))return banner('Ya existe esa materia prima','warn');if(_artCodeTaken(cod,null))return banner('Ese código ya está usado por otro artículo (producto o MP) — elegí otro','warn');const {error}=await sb.from('materias_primas').insert({empresa_id:S.empresaId,nombre:nom,codigo:cod});if(error)return banner('Error: '+error.message,'err');await reloadMaterias();banner('Materia prima '+cod+' · '+nom+' agregada','');cfgMat();}
function editMateria(id){const m=(S.materiasPrimas||[]).find(x=>x.id===id);if(!m)return;modal(`<h3>Editar materia prima</h3><p class="hint">Podés corregir el nombre. El código <b>no debería cambiarse</b> una vez que está en uso — es la clave de sincronización con CONTROL PLUS.</p><div style="display:grid;grid-template-columns:120px 1fr;gap:8px;margin-bottom:8px"><div><label>Código</label><input id="mt_ed_cod" value="${esc((m.codigo||'').toUpperCase())}" style="font-family:monospace;font-weight:700"></div><div><label>Nombre</label><input id="mt_ed" value="${esc((m.nombre||'').toUpperCase())}"></div></div><div class="row"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-gold" onclick="saveMateria('${id}')">Guardar</button></div>`);}
async function saveMateria(id){const nom=$('mt_ed').value.trim().toUpperCase();const cod=($('mt_ed_cod')?$('mt_ed_cod').value.trim().toUpperCase():'');if(!nom)return banner('Indicá el nombre','warn');if(cod&&_artCodeTaken(cod,id))return banner('Ese código ya está usado por otro artículo — elegí otro','warn');const upd={nombre:nom};if(cod)upd.codigo=cod;const {error}=await sb.from('materias_primas').update(upd).eq('id',id).eq('empresa_id',S.empresaId);if(error)return banner('Error: '+error.message,'err');await reloadMaterias();closeModal();banner('Materia prima guardada','');cfgMat();}
async function toggleMateria(id){const m=(S.materiasPrimas||[]).find(x=>x.id===id);await sb.from('materias_primas').update({activo:m.activo===false}).eq('id',id).eq('empresa_id',S.empresaId);await reloadMaterias();banner('Materia prima actualizada','');cfgMat();}

// ---- UNIFICAR DUPLICADOS (proveedores / materias primas) ----
let unifTipo='prov';
function unifData(tipo){
  if(tipo==='prov'){return (S.proveedores||[]).map(p=>({v:p.nombre,id:p.id,act:p.activo!==false,uso:(S.recepciones||[]).filter(r=>(r.proveedor||'')===p.nombre).length}));}
  const rows={};const key=n=>(''+n).toUpperCase();
  const bump=(n,f)=>{if(!n)return;const k=key(n);rows[k]=rows[k]||{v:k,id:'',act:true,rec:0,rcp:0,dsc:0,aj:0};rows[k][f]++;};
  (S.recepciones||[]).forEach(r=>{if(r.materia_prima&&r.origen!=='reventa')bump(r.materia_prima,'rec');});
  (S.descartes||[]).forEach(d=>{if(d.materia_prima)bump(d.materia_prima,'dsc');});
  (S.ajustes||[]).forEach(a=>{if(a.tipo==='mp'&&a.item)bump(a.item,'aj');});
  Object.values(S.recetas||{}).forEach(arr=>arr.forEach(x=>{if(x.mp)bump(x.mp,'rcp');}));
  (Array.isArray(S.materiasPrimas)?S.materiasPrimas:[]).forEach(m=>{if(m.nombre){const k=key(m.nombre);rows[k]=rows[k]||{v:k,id:'',act:true,rec:0,rcp:0,dsc:0,aj:0};rows[k].id=m.id;rows[k].act=m.activo!==false;}});
  return Object.values(rows).map(o=>({v:o.v,id:o.id,act:o.act,uso:o.rec+o.rcp+o.dsc+o.aj}));
}
function cfgUnif(){const tipo=unifTipo;const data=unifData(tipo).sort((a,b)=>(a.v||'').localeCompare(b.v||''));
  const seg=(v,l)=>`<button class="btn ${tipo===v?'btn-gold':'btn-ghost'} btn-sm" onclick="unifTipo='${v}';cfgUnif()">${l}</button>`;
  $('cfg_body').innerHTML=`<p class="hint">Unificá registros que son <b>la misma cosa</b>. Tildá los repetidos, marcá cuál es el <b>correcto</b> (destino): todas las operaciones de los demás se reasignan al destino y esos quedan dados de baja. Requiere PIN de supervisor. La acción queda en Novedades.</p>
   <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">${seg('prov','Proveedores')} ${seg('mp','Materias primas')}<input id="uf_q" placeholder="Buscar coincidencia (ej: 291)…" oninput="unifFilter()" style="flex:1;min-width:180px"></div>
   <div style="overflow:auto"><table><thead><tr><th style="text-align:center">Fusionar</th><th style="text-align:center">Destino ✓</th><th>${tipo==='prov'?'Proveedor':'Materia prima'}</th><th style="text-align:right">Uso</th><th></th></tr></thead><tbody>${data.map(o=>`<tr style="${o.act?'':'opacity:.5'}"><td style="text-align:center"><input type="checkbox" class="uf_ck" data-v="${esc(o.v)}" data-id="${esc(o.id||'')}" style="width:auto"></td><td style="text-align:center"><input type="radio" name="uf_dest" value="${esc(o.v)}" data-id="${esc(o.id||'')}" style="width:auto"></td><td>${esc(o.v)}</td><td class="mono" style="text-align:right">${o.uso}</td><td>${o.act?'':'<span class="tag out">baja</span>'}</td></tr>`).join('')||'<tr><td colspan=5 class=empty>Sin registros</td></tr>'}</tbody></table></div>
   <div class="g2" style="margin-top:12px"><div><label>PIN del supervisor</label><input type="password" id="uf_pin" autocomplete="off"></div><div style="display:flex;align-items:end"><button class="btn btn-gold" id="uf_go" onclick="doUnif()">Unificar seleccionados</button></div></div>
   <p class="hint" style="margin-top:8px">El "Uso" indica cuántas operaciones referencian cada registro. Fusionar no borra operaciones: solo las reapunta al destino.</p>`;}
function unifFilter(){const q=(($('uf_q')?$('uf_q').value:'')||'').toLowerCase();document.querySelectorAll('.uf_ck').forEach(c=>{const tr=c.closest('tr');if(!tr)return;const v=(c.dataset.v||'').toLowerCase();tr.style.display=(!q||v.includes(q))?'':'none';});}
async function doUnif(){const tipo=unifTipo;const cks=[...document.querySelectorAll('.uf_ck:checked')].map(c=>({v:c.dataset.v,id:c.dataset.id}));const destEl=document.querySelector('input[name=uf_dest]:checked');
  if(!destEl)return banner('Marcá cuál es el registro correcto (destino)','warn');
  const dest=destEl.value;const sources=cks.filter(c=>c.v!==dest);
  if(!sources.length)return banner('Tildá al menos un duplicado distinto del destino','warn');
  if(!authOK($('uf_pin').value,'unificar_dup',(tipo==='prov'?'Proveedor':'MP')+' → '+dest,'Unificó '+sources.map(s=>s.v).join(', ')+' en "'+dest+'"'))return;
  const b=$('uf_go');if(b){b.innerHTML='<span class="spin"></span>Unificando...';b.disabled=true;}
  try{
    for(const s of sources){
      if(tipo==='prov'){
        await sb.from('recepciones').update({proveedor:dest}).eq('empresa_id',S.empresaId).eq('proveedor',s.v);
        if(s.id)await sb.from('proveedores').update({activo:false}).eq('empresa_id',S.empresaId).eq('id',s.id);
      }else{
        await sb.from('recepciones').update({materia_prima:dest}).eq('empresa_id',S.empresaId).eq('materia_prima',s.v);
        await sb.from('producto_materias').update({materia_prima:dest}).eq('empresa_id',S.empresaId).eq('materia_prima',s.v);
        try{await sb.from('descartes').update({materia_prima:dest}).eq('empresa_id',S.empresaId).eq('materia_prima',s.v);}catch(e){}
        try{await sb.from('ajustes_stock').update({item:dest}).eq('empresa_id',S.empresaId).eq('tipo','mp').eq('item',s.v);}catch(e){}
        if(s.id){try{await sb.from('materias_primas').update({activo:false}).eq('empresa_id',S.empresaId).eq('id',s.id);}catch(e){}}
      }
    }
    await reloadCatalogo();await reloadRecepciones();if(typeof reloadDescartes==='function')await reloadDescartes();if(typeof reloadAjustes==='function')await reloadAjustes();
    banner('Unificado: '+sources.length+' registro(s) → "'+dest+'"','');cfgUnif();
  }catch(err){banner('Error: '+err.message,'err');const b2=$('uf_go');if(b2){b2.innerHTML='Unificar seleccionados';b2.disabled=false;}}
}

async function reloadDescartes(){const {data}=await sb.from('descartes').select('*').eq('empresa_id',S.empresaId).order('created_at',{ascending:false});S.descartes=data||[];}
async function reloadNovedades(){try{const {data,error}=await sb.from('novedades').select('*').eq('empresa_id',S.empresaId).order('created_at',{ascending:false});if(error)throw error;S.novedades=data||[];}catch(e){S.novedades=null;}}
async function reloadAjustes(){try{const {data,error}=await sb.from('ajustes_stock').select('*').eq('empresa_id',S.empresaId).order('created_at',{ascending:false});if(error)throw error;S.ajustes=data||[];}catch(e){S.ajustes=[];}}
function ajMPitems(){return [...new Set(S.recepciones.filter(r=>r.estado!=='anulada').map(r=>r.materia_prima))].filter(Boolean).sort();}
function ajPTitems(){const set=new Set();S.producciones.forEach(p=>{if(p.estado==='validada')(p.outputs||[]).forEach(o=>set.add(o.producto));});return [...set].sort();}
function ajPickLotes(arr){const shown=arr.filter(x=>x.stock>0.001);shown.sort((a,b)=>((a.fecha||'').localeCompare(b.fecha||''))||String(a.lote).localeCompare(String(b.lote)));return shown;}
function ajGrid(tipo){const out=[];if(tipo==='mp'){ajMPitems().forEach(it=>{const arr=S.recepciones.filter(r=>r.estado!=='anulada'&&r.materia_prima===it).map(r=>({lote:r.codigo_lote,stock:stockLote(r),fecha:r.fecha,ord:(r.fecha||'')+'|'+(r.created_at||'')}));const lotes=ajPickLotes(arr);if(lotes.length)out.push({item:it,lotes,un:'kg',dec:1});});}else{ajPTitems().forEach(it=>{const arr=lotesDeProducto(it).map(l=>{const p=S.producciones.find(x=>x.estado==='validada'&&loteDeProd(x)===l&&x.outputs.some(o=>o.producto===it));const f=p?p.fecha:'';return {lote:l,stock:stockLoteProd(it,l),fecha:f,ord:(f||'')+'|'+l};});const lotes=ajPickLotes(arr);if(lotes.length)out.push({item:it,lotes,un:'u',dec:0});});}return out;}
function ajRow(a){const cant=(+a.cantidad||0);const un=a.tipo==='mp'?'kg':'u';const dec=un==='kg'?1:0;return `<tr style="${a.estado==='anulada'?'opacity:.5':''}"><td class="mono">${esc(a.codigo||'')}</td><td>${fmtD(a.fecha)}</td><td>${a.tipo==='mp'?'MP':'PT'}</td><td class="mono" style="font-size:11px;color:var(--muted)">${esc(artCod(a.item))}</td><td>${esc((a.item||'').slice(0,16))}</td><td class="mono">${esc(a.lote||'—')}</td><td class="mono"><span class="tag ${cant>=0?'ok':'out'}">${cant>=0?'+':''}${nf(cant,dec)} ${un}</span></td><td>${esc((a.motivo||'').slice(0,20))}</td><td>${esc(a.autorizado_por||'—')}</td><td style="white-space:nowrap"><button class="btn btn-ghost btn-sm" onclick="detalleAjuste('${a.codigo}')" title="Ver">🔍</button>${a.estado!=='anulada'?` <button class="btn btn-ghost btn-sm" onclick="editAjuste('${a.codigo}')" title="Editar">✎</button> <button class="btn btn-danger btn-sm" onclick="anularAjuste('${a.codigo}')" title="Anular">✕</button>`:' <span class="tag out">Anulado</span>'}</td></tr>`;}
function ajMatch(a){const q=(window._ajQ||'').trim().toLowerCase();if(!q)return true;const hay=[a.codigo,a.item,artCod(a.item),a.lote,a.motivo,a.autorizado_por].map(x=>(x==null?'':x)+'').join(' ').toLowerCase();return hay.indexOf(q)>=0;}
function ajFilt(){return (S.ajustes||[]).filter(a=>(window._ajVerAnul||a.estado!=='anulada')&&enPeriodo(a.fecha,'ajuste')&&ajMatch(a));}
function ajListRows(){return ajFilt().slice(0,400).map(a=>ajRow(a)).join('')||'<tr><td colspan=10 class=empty>Sin ajustes para el filtro</td></tr>';}
function ajRenderList(){const tb=$('aj_listbody');if(tb)tb.innerHTML=ajListRows();const c=$('aj_listcount');if(c){const n=ajFilt().length;c.textContent=n+' ajuste(s)'+(n>400?' \u00b7 mostrando 400':'');}}
function viewAjuste(){const tipo=window._ajTipo||'mp';const grid=ajGrid(tipo);window._ajRows=[];let idx=0;let rows='';
  grid.forEach(g=>{g.lotes.forEach((l,j)=>{const i=idx++;const _r=S.recepciones.find(x=>x.codigo_lote===l.lote);const kgc=(tipo==='mp'&&_r&&_r.cajas>0&&_r.kilos>0)?_r.kilos/_r.cajas:0;const cajasNow=kgc>0?l.stock/kgc:0;window._ajRows.push({tipo,item:g.item,lote:l.lote,un:g.un,dec:g.dec,stock:l.stock,kgCaja:kgc});const bt=j===0?'border-top:2px solid var(--line);':'';const stockCell=tipo==='mp'?(nf(l.stock,1)+' kg'+(kgc>0?' · '+nf(cajasNow,1)+' cj':'')):(nf(l.stock,g.dec)+' '+g.un);const inputCell=tipo==='mp'?`<div style="display:flex;gap:4px"><input type="number" step="0.01" id="aj_d${i}" placeholder="±kg" title="Ajuste en kilos" style="width:68px;padding:5px 6px;border:1px solid var(--line);border-radius:7px" oninput="ajSetKg(${i})">${kgc>0?`<input type="number" step="0.01" id="aj_c${i}" placeholder="±cj" title="Ajuste en cajas (se prorratea a kilos)" style="width:62px;padding:5px 6px;border:1px solid var(--line);border-radius:7px" oninput="ajSetCajas(${i})">`:''}</div>`:`<input type="number" step="0.01" id="aj_d${i}" placeholder="+/−" style="width:88px;padding:5px 6px;border:1px solid var(--line);border-radius:7px" oninput="ajPrev(${i})">`;rows+=`<tr><td class="mono" style="${bt};font-size:11px;color:var(--muted)">${j===0?esc(artCod(g.item)):''}</td><td style="${bt}">${j===0?`<b>${esc(g.item)}</b>`:''}</td><td class="mono" style="${bt}">${esc(l.lote)}${l.stock<=0.001?' <span class="tag out">0</span>':''}</td><td class="mono" style="text-align:right;${bt}">${stockCell}</td><td style="${bt}">${inputCell}</td><td class="mono" id="aj_r${i}" style="text-align:right;color:var(--muted);${bt}">${stockCell}</td></tr>`;});});
  const seg=(v,lbl)=>`<button class="btn ${tipo===v?'btn-gold':'btn-ghost'} btn-sm" onclick="window._ajTipo='${v}';viewAjuste()">${lbl}</button>`;
  $('view').innerHTML=`<div class="card" style="margin-bottom:16px"><div class="card-h"><h3>Ajuste de stock por lote</h3><div style="display:flex;gap:8px">${seg('mp','Materia prima (kg)')} ${seg('pt','Producto terminado (u)')}</div></div>
    <p class="hint">Planilla de conteo: cargá el +/− solo en los lotes que difieran del físico (dejá vacío el resto). Un motivo y un PIN aplican todo junto. Se listan los lotes con stock y, por ítem, el último procesado aunque esté en 0.</p>
    <div style="overflow:auto"><table><thead><tr><th>Código</th><th>${tipo==='mp'?'Materia prima':'Producto'}</th><th>Lote</th><th style="text-align:right">Stock actual</th><th>Ajuste</th><th style="text-align:right">Queda</th></tr></thead><tbody>${rows||'<tr><td colspan=6 class=empty>Sin lotes para mostrar</td></tr>'}</tbody></table></div>
    <div class="g2" style="margin-top:14px"><div><label>Motivo (aplica a todo el ajuste)</label><input id="aj_motivo" placeholder="ej: conteo físico mensual"></div><div><label>PIN del supervisor</label><input type="password" id="aj_pin" autocomplete="off"></div></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px"><span class="hint" id="aj_pending">Sin cambios</span><button class="btn btn-gold" id="aj_apply" onclick="saveAjusteBulk()">Aplicar ajustes</button></div>
    </div>
    <div class="card"><div class="card-h"><h3>Ajustes registrados</h3>${periodSelect('ajuste')}</div><div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center"><input id="aj_q" placeholder="Buscar por código, artículo, lote o motivo..." value="${esc(window._ajQ||'')}" oninput="window._ajQ=this.value;ajRenderList()" style="flex:1;min-width:200px"><label style="display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;white-space:nowrap"><input type="checkbox" id="aj_veranul" ${window._ajVerAnul?'checked':''} onchange="window._ajVerAnul=this.checked;ajRenderList()" style="width:auto"> Ver anulados</label></div><div style="overflow:auto"><table><thead><tr><th>Código</th><th>Fecha</th><th>Tipo</th><th>Cód. art.</th><th>Ítem</th><th>Lote</th><th>Cantidad</th><th>Motivo</th><th>Autorizó</th><th></th></tr></thead><tbody id="aj_listbody">${ajListRows()}</tbody></table></div><div class="hint" id="aj_listcount" style="margin-top:8px">${ajFilt().length} ajuste(s)</div></div>`;
}
function ajSetKg(i){const row=window._ajRows&&window._ajRows[i];if(!row)return;const dk=+($('aj_d'+i)?$('aj_d'+i).value:0)||0;const c=$('aj_c'+i);if(c&&row.kgCaja>0)c.value=dk?+(dk/row.kgCaja).toFixed(2):'';ajPrev(i);}
function ajSetCajas(i){const row=window._ajRows&&window._ajRows[i];if(!row)return;const dc=+($('aj_c'+i)?$('aj_c'+i).value:0)||0;const d=$('aj_d'+i);if(d&&row.kgCaja>0)d.value=dc?+(dc*row.kgCaja).toFixed(2):'';ajPrev(i);}
function ajPrev(i){const row=window._ajRows&&window._ajRows[i];if(!row)return;const el0=$('aj_d'+i);const d=el0?(+el0.value||0):0;const nv=row.stock+d;const el=$('aj_r'+i);if(el){el.textContent=(row.tipo==='mp')?(nf(nv,1)+' kg'+(row.kgCaja>0?' · '+nf(nv/row.kgCaja,1)+' cj':'')):(nf(nv,row.dec)+' '+row.un);el.style.color=nv<-0.001?'var(--clay)':(d!==0?'var(--ink)':'var(--muted)');el.style.fontWeight=d!==0?'700':'400';}const n=(window._ajRows||[]).filter((r,k)=>{const e=$('aj_d'+k);return e&&Math.abs(+e.value||0)>0.0001;}).length;const c=$('aj_pending');if(c)c.textContent=n?(n+' lote(s) con cambios'):'Sin cambios';}
async function saveAjusteBulk(){const mot=($('aj_motivo')?$('aj_motivo').value:'').trim();const changes=[];(window._ajRows||[]).forEach((r,i)=>{const e=$('aj_d'+i);const d0=e?(+e.value||0):0;const d=r.tipo==='pt'?Math.round(d0):d0;if(Math.abs(d)>0.0001)changes.push(Object.assign({},r,{delta:d}));});
  if(!changes.length)return banner('No cargaste ningún ajuste','warn');
  if(!mot)return banner('El motivo es obligatorio','warn');
  for(const c of changes){if(c.stock+c.delta<-0.001)return banner('El lote '+c.lote+' quedaría negativo ('+nf(c.stock+c.delta,c.dec)+' '+c.un+')','warn');}
  const auth=pinAuth($('aj_pin').value);if(!auth)return banner('PIN incorrecto','err');
  const btn=$('aj_apply');if(btn){btn.innerHTML='<span class="spin"></span>Aplicando...';btn.disabled=true;}
  try{const done=[];for(const c of changes){const {data:num,error:e1}=await sb.rpc('siguiente_numero',{p_tipo:'ajuste'});if(e1)throw e1;const codigo='AJ-'+pad(num);const {error}=await sb.from('ajustes_stock').insert({empresa_id:S.empresaId,codigo,fecha:today(),tipo:c.tipo,item:c.item,lote:c.lote,cantidad:c.delta,motivo:mot,estado:'activo',registrado_por:S.nombre||'',autorizado_por:auth.nombre});if(error)throw error;done.push(c);}
    const resumen=done.map(c=>`${c.item} ${c.lote} ${c.delta>=0?'+':''}${nf(c.delta,c.dec)}${c.un}`).join('; ');
    logNovedad('ajuste_stock','('+done.length+' lote'+(done.length>1?'s':'')+')','Ajuste masivo ('+(changes[0].tipo==='mp'?'MP':'PT')+') · '+mot+' · '+resumen.slice(0,380),auth);
    await reloadAjustes();banner(done.length+' ajuste'+(done.length>1?'s':'')+' aplicado'+(done.length>1?'s':''),'');render();
  }catch(err){banner('Error: '+err.message,'err');const b2=$('aj_apply');if(b2){b2.innerHTML='Aplicar ajustes';b2.disabled=false;}}
}
function detalleAjuste(c){const a=(S.ajustes||[]).find(x=>x.codigo===c);if(!a)return;const un=a.tipo==='mp'?'kg':'u',dec=un==='kg'?1:0,cant=+a.cantidad||0;modal(`<h3>Ajuste ${esc(a.codigo||'')}</h3><div style="font-size:13px;line-height:1.9"><b>Fecha:</b> ${fmtD(a.fecha)}<br><b>Tipo:</b> ${a.tipo==='mp'?'Materia prima (kg)':'Producto terminado (u)'}<br><b>Ítem:</b> ${esc(a.item||'—')}<br><b>Lote:</b> ${esc(a.lote||'—')}<br><b>Cantidad:</b> ${cant>=0?'+':''}${nf(cant,dec)} ${un}<br><b>Motivo:</b> ${esc(a.motivo||'—')}<br><b>Autorizó:</b> ${esc(a.autorizado_por||'—')}<br><b>Registró:</b> ${esc(a.registrado_por||'—')}<br><b>Estado:</b> ${a.estado==='anulada'?'<span class="tag out">Anulado</span>':'<span class="tag ok">Activo</span>'}</div><div class="row"><button class="btn btn-gold" onclick="closeModal()">Cerrar</button></div>`);}
function anularAjuste(c){const a=(S.ajustes||[]).find(x=>x.codigo===c);if(!a||a.estado==='anulada')return;const un=a.tipo==='mp'?'kg':'u',dec=un==='kg'?1:0,cant=+a.cantidad||0;modal(`<h3>🔒 Anular ajuste ${esc(a.codigo||'')}</h3><p class="hint">Se revierte el efecto de <b>${cant>=0?'+':''}${nf(cant,dec)} ${un}</b> sobre el lote <b>${esc(a.lote||'—')}</b>. El stock vuelve a su valor previo.</p><label>PIN del supervisor</label><input type="password" id="anaj_pin" autocomplete="off"><div class="row"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-danger" id="anaj_save" onclick="doAnularAjuste('${c}')">Anular</button></div>`);}
async function doAnularAjuste(c){const a=(S.ajustes||[]).find(x=>x.codigo===c);if(!a)return;if(!authOK($('anaj_pin').value,'anular_ajuste',c,'Anulación de ajuste '+c))return;$('anaj_save').innerHTML='<span class="spin"></span>...';$('anaj_save').disabled=true;try{const {error}=await sb.from('ajustes_stock').update({estado:'anulada'}).eq('empresa_id',S.empresaId).eq('id',a.id);if(error)throw error;await reloadAjustes();closeModal();banner('Ajuste anulado · stock revertido','warn');render();}catch(err){banner('Error: '+err.message,'err');$('anaj_save').innerHTML='Anular';$('anaj_save').disabled=false;}}
function editAjuste(c){const a=(S.ajustes||[]).find(x=>x.codigo===c);if(!a||a.estado==='anulada')return;const un=a.tipo==='mp'?'kg':'u',dec=un==='kg'?1:0,cant=+a.cantidad||0;
  modal(`<h3>\u270e Editar ajuste ${esc(a.codigo||'')}</h3><p class="hint">Corregí la cantidad del ajuste sobre <b>${esc(a.item||'\u2014')}</b> \u00b7 lote <b>${esc(a.lote||'\u2014')}</b>. Un valor <b>positivo</b> suma stock y uno <b>negativo</b> lo resta. El stock se recalcula solo. Requiere PIN de supervisor.</p>
   <div class="g2"><div><label>Cantidad del ajuste (${un}) \u00b7 usá \u2212 para restar</label><input type="number" step="${dec?'0.01':'1'}" id="edaj_cant" value="${cant}"></div><div><label>Motivo</label><input id="edaj_mot" value="${esc(a.motivo||'')}" placeholder="motivo del ajuste"></div></div>
   <label>PIN del supervisor</label><input type="password" id="edaj_pin" autocomplete="off"><div class="row"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-gold" id="edaj_save" onclick="doEditAjuste('${c}')">Guardar cambios</button></div>`);}
async function doEditAjuste(c){const a=(S.ajustes||[]).find(x=>x.codigo===c);if(!a)return;const un=a.tipo==='mp'?'kg':'u',dec=un==='kg'?1:0;
  let nv=+($('edaj_cant')?$('edaj_cant').value:NaN);if(isNaN(nv))return banner('Indicá la cantidad del ajuste','warn');nv=a.tipo==='pt'?Math.round(nv):+nv.toFixed(3);
  const mot=($('edaj_mot')?$('edaj_mot').value.trim():'')||a.motivo||'';const prev=+a.cantidad||0;
  if(!authOK($('edaj_pin').value,'editar_ajuste',c,'Editar ajuste '+c+' ('+(a.item||'')+' lote '+(a.lote||'\u2014')+'): '+(prev>=0?'+':'')+nf(prev,dec)+' \u2192 '+(nv>=0?'+':'')+nf(nv,dec)+' '+un+(mot?(' \u00b7 '+mot):'')))return;

  catch(err){banner('Error: '+err.message,'err');const b2=$('edaj_save');if(b2){b2.innerHTML='Guardar cambios';b2.disabled=false;}}}
function viewDescarte(){const lotes=S.recepciones.filter(r=>r.estado!=='anulada'&&stockLote(r)>0.001).sort((a,b)=>a.fecha<b.fecha?-1:1);
  const perdidaTotal=(S.descartes||[]).reduce((s,d)=>s+(+d.kg||0)*avgPriceKg(d.materia_prima),0);

     <div class="kpi gold"><div class="lab">💸 Pérdida por descarte</div><div class="val">${money(perdidaTotal)}</div><div class="un">valor de la MP descartada</div></div>
     <div class="kpi steel"><div class="lab">🗑️ Descartes</div><div class="val">${(S.descartes||[]).length}</div><div class="un">registros</div></div>
   </div>
   <div class="card" style="margin-bottom:16px"><div class="card-h"><h3>Registrar descarte de materia prima</h3></div>
   <p class="hint">Cuando una MP en cámara se pierde (vencida, dañada, cadena de frío), registrala acá. Baja del stock, suma como pérdida y se absorbe en el costo promedio del kilo. Requiere PIN del supervisor.</p>

async function saveDescarte(){const cl=$('ds_lote').value;const kg=+$('ds_kg').value||0;
  if(!cl)return banner('Elegí un lote','warn');if(kg<=0)return banner('Indicá los kilos','warn');
  if(!authOK($('ds_pin').value,'descarte',cl,'Descarte de '+nf(kg,1)+'kg · '+($('ds_motivo').value.trim()||'')))return;
  const r=S.recepciones.find(x=>x.codigo_lote===cl);const disp=r?stockLote(r):0;
  if(kg>disp+0.001)return banner('Solo hay '+nf(disp,1)+'kg disponibles en ese lote','warn');
  $('ds_save').innerHTML='<span class="spin"></span>Registrando...';$('ds_save').disabled=true;
  try{const {data:num,error:e1}=await sb.rpc('siguiente_numero',{p_tipo:'descarte'});if(e1)throw e1;
    const codigo='DESC-'+pad(num);
    const {error}=await sb.from('descartes').insert({empresa_id:S.empresaId,codigo,fecha:$('ds_fecha').value,codigo_lote:cl,materia_prima:r?r.materia_prima:'',kg,motivo:$('ds_motivo').value.trim(),registrado_por:S.nombre||''});
    if(error)throw error;
    await reloadDescartes();banner('Descarte '+codigo+' registrado','');render();
  }catch(err){banner('Error: '+err.message,'err');$('ds_save').innerHTML='Registrar descarte';$('ds_save').disabled=false;}
}

// ---- ARRANQUE: sesión persistente ----
(async()=>{ await boot(); })();
</script>
