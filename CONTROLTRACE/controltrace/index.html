  @page{size:A4;margin:10mm}

const esc=s=>(s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const nf=(n,d=0)=>(+n||0).toLocaleString('es-AR',{minimumFractionDigits:d,maximumFractionDigits:d});
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function addDays(f,n){if(!f)return '';const d=new Date(f+'T00:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
const fmtD=f=>f?String(f).slice(0,10).split('-').reverse().join('/'):'—';
const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
function diaRel(f){if(!f)return '—';const t=today();if(f===t)return 'Hoy';if(f===addDays(t,1))return 'Mañana';if(f===addDays(t,-1))return 'Ayer';const d=new Date(f+'T00:00:00');return DIAS[d.getDay()].replace(/^./,c=>c.toUpperCase());}
function fechaLarga(f){if(!f)return '—';return diaRel(f)+' '+fmtD(f);}
function fmtTs(ts){if(!ts)return '—';const d=new Date(ts);if(isNaN(d))return '—';return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function banner(t,k){const b=$('banner');b.textContent=t;b.className='banner show'+(k?' '+k:'');clearTimeout(b._t);b._t=setTimeout(()=>b.className='banner',k==='err'?6000:2800);}
function modal(html){$('modal').innerHTML=html;$('modalBg').classList.add('show');setTimeout(()=>{const f=$('modal').querySelector('input:not([type=hidden]):not([type=checkbox]),select');if(f)f.focus();},60);}
function closeModal(){$('modalBg').classList.remove('show');}
$('modalBg').addEventListener('mousedown',e=>{if(e.target===$('modalBg'))closeModal();});
function errMsg(e){const m=(e&&(e.message||e.details))||String(e||'');if(/docs_|function .* does not exist|PGRST202|Could not find the function|relation .* does not exist|PGRST205/i.test(m)&&!/permiso|motivo|no encontrad|no tiene/i.test(m))return 'Falta correr docs_etapa1_setup.sql en Supabase';return m;}
function esAdmin(){return ADMINS.includes(S.rol);}
function lsGet(k,d){try{const v=localStorage.getItem(k);return v==null?d:v;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}

// Enter pasa de campo en campo (en el modal y en los filtros); en el último dispara el botón principal
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'){if($('modalBg').classList.contains('show'))closeModal();else if($('visor').classList.contains('show'))cerrarVisor();return;}
  if(ev.key!=='Enter'||ev.defaultPrevented||ev.isComposing)return;
  const t=ev.target;if(!t||!['INPUT','SELECT'].includes(t.tagName))return;
  const scope=t.closest('.modal')||t.closest('.frm');if(!scope)return;
  ev.preventDefault();
  const fs=[...scope.querySelectorAll('input:not([type=hidden]):not([disabled]),select:not([disabled])')].filter(x=>x.offsetParent!==null);
  const i=fs.indexOf(t);
  if(i>=0&&i<fs.length-1){fs[i+1].focus();if(fs[i+1].select&&fs[i+1].type!=='checkbox')try{fs[i+1].select();}catch(e){}}
  else{const b=scope.querySelector('.btn-gold:not([disabled])');if(b)b.click();}
});

// ── par Cód. + Nombre (se escribe el código y Enter, o se busca por nombre y se elige) ──
const PAIR={};
function pairHTML(key,list,curVal,onch,ph){
  PAIR[key]={list,onch};const hit=list.find(o=>o.val===curVal);
  return `<div class="pair"><input class="in pc" id="${key}_c" placeholder="Cód." value="${esc(hit?hit.cod:'')}" autocomplete="off" onkeydown="if(event.key==='Enter')pairCod('${key}')" onblur="pairCod('${key}',1)">
  <div class="pn-w"><input class="in" id="${key}_n" placeholder="${esc(ph||'Buscar por nombre…')}" value="${esc(hit?hit.nom:'')}" autocomplete="off" oninput="pairList('${key}')" onfocus="pairList('${key}')" onblur="setTimeout(()=>pairBlur('${key}'),180)" onkeydown="pairKey(event,'${key}')"><div class="pl" id="${key}_l"></div></div><input type="hidden" id="${key}" value="${esc(curVal||'')}"></div>`;}
function pairSet(key,o){const P=PAIR[key];$(key+'_c').value=o?o.cod:'';$(key+'_n').value=o?o.nom:'';const old=$(key).value;$(key).value=o?o.val:'';$(key+'_l').style.display='none';if(old!==$(key).value&&P.onch)P.onch(o?o.val:'');}
function pairCod(key,quiet){const v=$(key+'_c').value.trim().toUpperCase();if(!v){if(!quiet)return;if($(key).value&&!$(key+'_n').value.trim())pairSet(key,null);return;}const o=PAIR[key].list.find(x=>(x.cod||'').toUpperCase()===v);if(o)pairSet(key,o);else if(!quiet)banner('No hay ningún código '+v,'warn');}
function pairList(key){const q=$(key+'_n').value.trim().toLowerCase();const L=PAIR[key].list.filter(o=>!q||o.nom.toLowerCase().includes(q)||(o.cod||'').toLowerCase().includes(q)).slice(0,60);PAIR[key].cur=L;PAIR[key].hi=-1;
  const el=$(key+'_l');el.innerHTML=L.map((o,i)=>`<div onmousedown="pairPick('${key}',${i})"><span class="pcod">${esc(o.cod||'')}</span>${esc(o.nom)}</div>`).join('')||'<div style="color:var(--muted);cursor:default">Sin coincidencias</div>';el.style.display='block';}
function pairPick(key,i){const o=(PAIR[key].cur||[])[i];if(o)pairSet(key,o);}
function pairKey(ev,key){const P=PAIR[key];if(!P.cur)return;const items=$(key+'_l').children;
  if(ev.key==='ArrowDown'||ev.key==='ArrowUp'){ev.preventDefault();P.hi=Math.max(0,Math.min(P.cur.length-1,(P.hi||0)+(ev.key==='ArrowDown'?1:-1)));[...items].forEach((d,i)=>d.classList.toggle('hi',i===P.hi));}
  else if(ev.key==='Enter'&&$(key+'_l').style.display==='block'&&P.cur.length){const o=P.cur[P.hi>=0?P.hi:0];if(o)pairSet(key,o);}}
function pairBlur(key){const el=$(key+'_l');if(el)el.style.display='none';const n=$(key+'_n');if(!n)return;const q=n.value.trim().toLowerCase();if(!q){if($(key).value)pairSet(key,null);return;}const o=PAIR[key].list.find(x=>x.nom.toLowerCase()===q);if(o)pairSet(key,o);else{const h=PAIR[key].list.find(x=>x.val===$(key).value);n.value=h?h.nom:'';$(key+'_c').value=h?h.cod:'';}}

// ── listas: 8 por página, selector por fila y barra de acciones arriba ──
const G={};
function grid(cid,key,cols,rows,acts){
  const st=G[key]||(G[key]={pag:1,sel:null});st.args=[cid,key,cols,rows,acts];
  const pags=Math.max(1,Math.ceil(rows.length/PP));st.pag=Math.min(Math.max(1,st.pag),pags);
  if(st.sel&&!rows.some(r=>r._k===st.sel))st.sel=null;
  const sel=rows.find(r=>r._k===st.sel);const A=sel?acts(sel):[];window['_ga_'+key]=A;
  const vis=rows.slice((st.pag-1)*PP,st.pag*PP);
  const bar=`<div class="gx-bar"><div class="gx-pager"><button class="btn btn-ghost btn-sm" ${st.pag<=1?'disabled':''} onclick="gridPag('${key}',-1)">◀</button><b>Pág. ${st.pag} de ${pags}</b><button class="btn btn-ghost btn-sm" ${st.pag>=pags?'disabled':''} onclick="gridPag('${key}',1)">▶</button><span class="gx-n">${rows.length} registro${rows.length===1?'':'s'}</span></div>
   <div class="gx-acts">${sel?`<span class="gx-who">${esc(sel._lbl||'')}</span>`+(A.length?A.map((a,i)=>`<button class="btn ${a.cls||'btn-ghost'}" ${a.dis?'disabled':''} onclick="gridDo('${key}',${i})">${a.lbl}</button>`).join(''):'<span class="gx-hint">Sin acciones para este registro</span>'):'<span class="gx-hint">☝️ Seleccioná un registro de la lista</span>'}</div></div>`;
  const body=vis.map(r=>`<tr class="gx-r${r._k===st.sel?' gx-on':''}" onclick="gridSel('${key}','${esc(r._k)}')"><td class="gx-sel"><input type="radio" name="gx_${key}" ${r._k===st.sel?'checked':''} aria-label="Seleccionar"></td>${cols.map(c=>`<td class="${c.cls||''}">${c.f(r)}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${cols.length+1}" class="empty">Sin registros</td></tr>`;
  $(cid).innerHTML=bar+`<div class="tscroll"><table><thead><tr><th></th>${cols.map(c=>`<th class="${c.cls||''}">${c.h}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div>`;}
function gridRedraw(key){const st=G[key];if(st&&st.args&&$(st.args[0]))grid(...st.args);}
function gridSel(key,k){G[key].sel=k;gridRedraw(key);}
function gridPag(key,d){G[key].pag+=d;G[key].sel=null;gridRedraw(key);}
function gridDo(key,i){const a=(window['_ga_'+key]||[])[i];if(a&&!a.dis)a.fn();}

// ── estado de una publicación ──
function vigente(p){return !p.vigente_hasta||String(p.vigente_hasta).slice(0,10)>=today();}
function estadoPub(p){if(p.estado==='retirado')return 'retirado';if(!vigente(p))return 'vencido';return 'publicado';}
function estadoTag(p){const e=estadoPub(p);const c=S.cambios[p.id];
  let h=e==='publicado'?'<span class="tag t-ok">Publicado</span>':e==='vencido'?'<span class="tag t-mut">Vencido</span>':'<span class="tag t-out">Retirado</span>';
  if(e!=='retirado'&&c){if(c.existe===false)h+=' <span class="tag t-out" title="El pedido o plan original ya no existe">origen borrado</span>';else if(c.cambiado)h+=' <span class="tag t-warn" title="El origen cambió desde que se publicó">⚠ cambió</span>';}
  return h;}
function rolesTxt(roles){return (!roles||!roles.length)?'Todos':roles.map(r=>ROL_LABEL[r]||r).join(', ');}
function pubDeOrigen(tipo,id){return S.pubs.find(p=>p.tipo===tipo&&p.origen_id===id);}

async function loadPubs(){
  const {data,error}=await sb.from('docs_publicaciones').select('*').eq('empresa_id',S.empresaId).order('fecha_ref',{ascending:true});
  if(error){if(/docs_publicaciones|PGRST205|does not exist/i.test(error.message||''))S.sqlOk=false;else throw error;S.pubs=[];}else{S.pubs=data||[];}
  await loadLineas();

}
// v3: líneas de producción (Trace v175). La línea de cada orden se toma de su plan de origen.
async function loadLineas(){try{const {data,error}=await sb.from('lineas_produccion').select('id,nombre,activo,orden').eq('empresa_id',S.empresaId);S.lineas=error?[]:(data||[]).sort((a,b)=>((+a.orden||0)-(+b.orden||0))||String(a.nombre).localeCompare(b.nombre));}catch(e){S.lineas=[];}
  const ids=[...new Set(S.pubs.filter(p=>p.tipo==='orden_produccion'&&p.origen_id).map(p=>p.origen_id))];S.planLin={};
  for(let i=0;i<ids.length;i+=100){try{const {data}=await sb.from('planes_produccion').select('id,linea_id,capacidad').eq('empresa_id',S.empresaId).in('id',ids.slice(i,i+100));(data||[]).forEach(x=>S.planLin[x.id]={id:x.linea_id||'',nombre:(lineaNom(x.linea_id)||(x.capacidad&&x.capacidad.linea)||'')});}catch(e){}}}
function lineaNom(id){const l=(S.lineas||[]).find(x=>x.id===id);return l?l.nombre:'';}
function lineasUsadas(){const m={};S.pubs.forEach(p=>{const l=pubLinea(p);if(l.id)m[l.id]=l.nombre;});(S.lineas||[]).filter(l=>l.activo!==false).forEach(l=>m[l.id]=l.nombre);return Object.keys(m).map(id=>({id,nombre:m[id]})).sort((a,b)=>{const ia=(S.lineas||[]).findIndex(x=>x.id===a.id),ib=(S.lineas||[]).findIndex(x=>x.id===b.id);return (ia<0?99:ia)-(ib<0?99:ib)||a.nombre.localeCompare(b.nombre);});}
function pubLinea(p){if(!p||p.tipo!=='orden_produccion')return {id:'',nombre:''};const c=p.contenido||{};if(c.linea&&(c.linea.id||c.linea.nombre))return {id:c.linea.id||'',nombre:c.linea.nombre||lineaNom(c.linea.id)};const x=S.planLin[p.origen_id];return x?{id:x.id,nombre:x.nombre}:{id:'',nombre:''};}
function planLineaRow(pl){return pl?{id:pl.linea_id||'',nombre:lineaNom(pl.linea_id)||(pl.capacidad&&pl.capacidad.linea)||''}:{id:'',nombre:''};}
function conLinea(c,lin){return (lin&&lin.nombre)?Object.assign({},c,{_linea:lin.nombre}):c;}
function pasaLinea(p,lid){if(!lid)return true;if(p.tipo!=='orden_produccion')return false;return pubLinea(p).id===lid;}
function linSeg(k,fn){const L=lineasUsadas();if(!L.length)return '';return `<div class="seg"><button class="btn btn-sm ${!F[k]?'btn-gold':'btn-ghost'}" onclick="F.${k}='';${fn}()">Todas las líneas</button>${L.map(l=>`<button class="btn btn-sm ${F[k]===l.id?'btn-gold':'btn-ghost'}" onclick="F.${k}='${l.id}';${fn}()">🏭 ${esc(l.nombre)}</button>`).join('')}</div>`;}
async function loadLecturas(){
  S.leidas={};S.lectCnt={};if(!S.sqlOk){S.lectOk=false;return;}
  const {data,error}=await sb.from('docs_lecturas').select('publicacion_id,version,leido_at').eq('empresa_id',S.empresaId).eq('usuario_id',S.uid);
  if(error){S.lectOk=false;return;}S.lectOk=true;
  (data||[]).forEach(l=>{const x=S.leidas[l.publicacion_id];if(!x||l.version>x.v)S.leidas[l.publicacion_id]={v:l.version,at:l.leido_at};});
  if(S.puede){try{const all=await sbAll(()=>sb.from('docs_lecturas').select('publicacion_id,version,usuario_id').eq('empresa_id',S.empresaId));
    const ver={};S.pubs.forEach(p=>ver[p.id]=p.version);all.forEach(l=>{if(ver[l.publicacion_id]===l.version)S.lectCnt[l.publicacion_id]=(S.lectCnt[l.publicacion_id]||0)+1;});}catch(e){}}
}
function leidaActual(p){const x=S.leidas[p.id];return !!(x&&x.v>=p.version);}
function lectTag(p){if(!S.lectOk)return '';const x=S.leidas[p.id];if(x&&x.v>=p.version)return '<span class="tag t-ok">✅ Visto</span>';if(x)return '<span class="tag t-warn" title="Se publicó una versión nueva desde que lo leíste">🔄 Actualizado</span>';return '<span class="tag t-nav">🆕 Nuevo</span>';}
async function sbAll(build){const out=[];for(let from=0;;from+=1000){const {data,error}=await build().range(from,from+999);if(error)throw error;out.push(...(data||[]));if(!data||data.length<1000)break;}return out;}
async function loadOrigenes(){
  if(!S.clientes.length){const {data}=await sb.from('clientes').select('id,codigo,razon_social').eq('empresa_id',S.empresaId).order('razon_social');S.clientes=data||[];}
  if(S.pedidos==null){
    const desde=addDays(today(),-30);
    const [a,b]=await Promise.all([
      sbAll(()=>sb.from('pedidos').select('*').eq('empresa_id',S.empresaId).eq('estado','pendiente').order('fecha',{ascending:false})),
      sbAll(()=>sb.from('pedidos').select('*').eq('empresa_id',S.empresaId).gte('fecha',desde).order('fecha',{ascending:false}))]);
    const m={};[...a,...b].forEach(p=>m[p.id]=p);S.pedidos=Object.values(m);
    S.pedItems={};const ids=S.pedidos.map(p=>p.id);
    for(let i=0;i<ids.length;i+=100){const {data}=await sb.from('pedido_items').select('pedido_id,paquetes').eq('empresa_id',S.empresaId).in('pedido_id',ids.slice(i,i+100));(data||[]).forEach(it=>{S.pedItems[it.pedido_id]=(S.pedItems[it.pedido_id]||0)+(+it.paquetes||0);});}
  }
  if(S.planes==null){const {data,error}=await sb.from('planes_produccion').select('*').eq('empresa_id',S.empresaId).order('created_at',{ascending:false}).limit(80);S.planes=error?[]:(data||[]);S.planesErr=error?errMsg(error):'';}
}

// ══════════════ MURO ══════════════
let _muroT=null;
function setupNote(){if(S.sqlOk&&!S.lectOk&&S.puede)return `<div class="note">ℹ️ Para activar la <b>confirmación de lectura</b> corré <b>docs_etapa2_setup.sql</b> en Supabase → SQL Editor y recargá. Todo lo demás ya funciona.</div>`;return S.sqlOk?'':`<div class="note">⚠️ Para empezar a usar CONTROL DOCS hay que correr <b>docs_etapa1_setup.sql</b> en Supabase → SQL Editor (una sola vez) y recargar esta página.</div>`;}
function viewMuro(){
  const t=today();
  let L=S.pubs.filter(p=>estadoPub(p)==='publicado');
  if(F.muroTipo!=='todos')L=L.filter(p=>p.tipo===F.muroTipo);
  if(F.muroLinea)L=L.filter(p=>pasaLinea(p,F.muroLinea));
  const fr=p=>String(p.fecha_ref||'').slice(0,10);
  if(F.muroCuando==='hoy')L=L.filter(p=>fr(p)===t);
  else if(F.muroCuando==='manana')L=L.filter(p=>fr(p)===addDays(t,1));
  else if(F.muroCuando==='proximos')L=L.filter(p=>!fr(p)||fr(p)>=t);
  L.sort((a,b)=>fr(a).localeCompare(fr(b))||(a.tipo===b.tipo?0:a.tipo==='orden_produccion'?-1:1)||pubLinea(a).nombre.localeCompare(pubLinea(b).nombre)||String(a.titulo).localeCompare(b.titulo));
  const seg=(k,v,l)=>`<button class="btn btn-sm ${F[k]===v?'btn-gold':'btn-ghost'}" onclick="F.${k}='${v}';viewMuro()">${l}</button>`;
  $('view').innerHTML=setupNote()+`<div class="filters">
    <div class="seg">${seg('muroTipo','todos','Todos')}${seg('muroTipo','pedido','📋 Pedidos')}${seg('muroTipo','orden_produccion','🗓️ Órdenes de producción')}</div>
    <div class="seg">${seg('muroCuando','hoy','Hoy')}${seg('muroCuando','manana','Mañana')}${seg('muroCuando','proximos','Próximos')}${seg('muroCuando','todas','Todas')}</div>
    ${linSeg('muroLinea','viewMuro')}
    <button class="btn btn-ghost btn-sm" style="margin-left:auto" onclick="go('pantalla')">📺 Modo pantalla</button></div>
   ${L.length?`<div class="wall">${L.map(cardHTML).join('')}</div>`:`<div class="card"><div class="empty">📭 No hay documentos publicados para este filtro.${S.puede?'<br><br><button class="btn btn-gold" onclick="go(\'publicar\')">📤 Publicar un documento</button>':''}</div></div>`}`;
  clearInterval(_muroT);_muroT=setInterval(async()=>{if(cur!=='muro'||document.hidden||$('visor').classList.contains('show')||$('modalBg').classList.contains('show'))return;try{await loadPubs();buildNav();viewMuro();}catch(e){}},60000);
}
function cardHTML(p){const c=p.contenido||{};const op=p.tipo==='orden_produccion';const fr=String(p.fecha_ref||'').slice(0,10);
  const tot=op?`<span><b>${nf(c.total)}</b> a producir</span><span><b>${(c.items||[]).length}</b> productos</span>`:`<span><b>${nf(c.total_unidades)}</b> unidades</span><span><b>${nf(c.total_cajas)}</b> cajas</span>`;
  const ch=S.puede&&S.cambios[p.id]&&S.cambios[p.id].cambiado?' <span class="tag t-warn">⚠ cambió</span>':'';
  const nuevo=S.lectOk&&!leidaActual(p);
  return `<div class="dcard${op?' op':''}${nuevo?' nuevo':''}" onclick="verPub('${p.id}')" role="button" tabindex="0" onkeydown="if(event.key==='Enter')verPub('${p.id}')">
   <div class="k">${op?'🗓️ Orden de producción':'📋 Pedido'}${op&&pubLinea(p).nombre?`<span class="lin-chip">🏭 ${esc(pubLinea(p).nombre)}</span>`:''}</div>
   <div class="tt">${esc(c.codigo||p.origen_codigo||'')}</div>
   ${op?`<div class="cl">Producir el ${esc(fechaLarga(c.fecha_produccion))}</div>`:`<div class="cl">${esc((c.cliente&&c.cliente.nombre)||'—')}</div>`}
   <div class="when">Entrega: <b>${esc(fechaLarga(fr))}</b>${!op&&c.orden_compra?' · OC '+esc(c.orden_compra):''}</div>
   <div class="tot">${tot}</div>
   <div class="meta">${lectTag(p)}<span>v${p.version} · ${fmtTs(p.publicado_at)}</span>${S.puede?`<span class="tag t-nav">Para: ${esc(rolesTxt(p.roles))}</span>`:''}${ch}</div></div>`;}

// ══════════════ VISOR GRANDE ══════════════
function verPub(id){const p=S.pubs.find(x=>x.id===id);if(!p)return;abrirVisor(conLinea(p.contenido||{},pubLinea(p)),{version:p.version,publicado_at:p.publicado_at,por:p.publicado_por_nombre,pubId:p.id});}
// Arma el documento (lo usan el visor y el modo pantalla). o.items = renglones a mostrar, o.pag/o.pags = página
function docHTML(c,o){o=o||{};const e=S.empresa||{};const logo=(e.etiqueta_config&&e.etiqueta_config.logo)||'';const op=c.tipo==='orden_produccion';
  const items=o.items||c.items||[];const ultima=!o.pags||o.pag===o.pags;
  const pg=o.pags>1?`<span class="pt-pag">Pág. ${o.pag} de ${o.pags}</span>`:'';
  const head=`<div class="vz-h"><div class="vz-emp">${logo?`<img src="${logo}" alt="">`:''}<div><b>${esc(e.razon_social||'')}</b><br>CONTROL DOCS</div></div>
   <div class="vz-type"><div class="k">${op?'Orden de producción':'Pedido'}</div><div class="c">${esc(c.codigo||'')}${pg}</div></div></div>`;
  const _lin=op?(c._linea||(c.linea&&c.linea.nombre)||''):'';
  let info,tabla;
  if(op){
    info=`<div class="vz-info">${_lin?`<div><div class="l">Línea</div><div class="v big"><span class="vz-lin">🏭 ${esc(_lin)}</span></div></div>`:''}<div><div class="l">Producir el</div><div class="v big">${esc(fechaLarga(c.fecha_produccion))}</div></div><div><div class="l">Entrega</div><div class="v">${esc(fechaLarga(c.fecha_entrega))}</div></div></div>`;
    tabla=`<div class="tscroll"><table><thead><tr><th class="cdh">Cód.</th><th>Producto</th><th class="num">Cantidad a producir</th></tr></thead><tbody>${items.map(it=>`<tr><td class="cd">${esc(it.codigo||'')}</td><td>${esc(it.producto)}</td><td class="q">${nf(it.producir)}</td></tr>`).join('')||'<tr><td colspan="3">Sin productos</td></tr>'}</tbody>
     <tfoot>${ultima?`<tr><td class="cd"></td><td>TOTAL</td><td class="q">${nf(c.total)}</td></tr>`:`<tr><td class="cd"></td><td colspan="2" style="color:var(--muted)">Continúa en la página siguiente…</td></tr>`}</tfoot></table></div>`;
  }else{
    const cl=c.cliente||{};
    info=`<div class="vz-info"><div style="grid-column:span 2"><div class="l">Cliente</div><div class="v big">${esc(cl.nombre||'—')}</div>${cl.codigo||cl.localidad?`<div style="font-size:.6em;color:var(--muted)">${esc([cl.codigo,cl.localidad].filter(Boolean).join(' · '))}</div>`:''}</div>
     <div><div class="l">Entrega</div><div class="v big">${esc(fechaLarga(c.fecha_entrega))}</div></div>${c.orden_compra?`<div><div class="l">Orden de compra</div><div class="v">${esc(c.orden_compra)}</div></div>`:''}</div>`;
    tabla=`<div class="tscroll"><table><thead><tr><th class="cdh">Cód.</th><th>Producto</th><th class="num">Unidades</th><th class="num">Cajas</th></tr></thead><tbody>${items.map(it=>`<tr><td class="cd">${esc(it.codigo||'')}</td><td>${esc(it.producto)}</td><td class="q">${nf(it.unidades)}</td><td class="q">${nf(it.cajas)}</td></tr>`).join('')||'<tr><td colspan="4">Sin artículos</td></tr>'}</tbody>
     <tfoot>${ultima?`<tr><td class="cd"></td><td>TOTAL</td><td class="q">${nf(c.total_unidades)}</td><td class="q">${nf(c.total_cajas)}</td></tr>`:`<tr><td class="cd"></td><td colspan="3" style="color:var(--muted)">Continúa en la página siguiente…</td></tr>`}</tfoot></table></div>`;
  }
  const meta=o.meta||{};
  const pie=meta.preview?'<span>Vista previa · todavía no publicado</span>':`<span>Versión ${meta.version||1}${meta.anterior?' (anterior)':''} · publicado ${fmtTs(meta.publicado_at)}${meta.por?' por '+esc(meta.por):''}</span>`;
  return `<div class="vz">${head}${info}${tabla}<div class="vz-foot">${pie}<span>${op?'':'Documento sin valores · '}${esc(fmtD(today()))}</span></div>${o.extra||''}</div>`;}
function readBarHTML(pubId){const p=S.pubs.find(x=>x.id===pubId);if(!p||!S.lectOk||estadoPub(p)!=='publicado')return '';
  const x=S.leidas[p.id];
  if(x&&x.v>=p.version)return `<div class="vz-read" id="vzRead"><span class="ok">✅ Leíste este documento</span><span style="color:var(--muted)">${fmtTs(x.at)} · versión ${p.version}</span></div>`;
  return `<div class="vz-read" id="vzRead"><button class="btn btn-gold" onclick="doLeido('${p.id}')">✅ Leí este documento</button><span style="color:var(--muted)">${x?'🔄 Hay una versión nueva desde que lo leíste: revisala y confirmá.':'Confirmá que lo leíste para que quede registrado.'}</span></div>`;}
async function doLeido(id){const b=document.querySelector('#vzRead .btn');if(b){b.disabled=true;b.textContent='⏳ Guardando…';}
  const {data,error}=await sb.rpc('docs_marcar_leido',{p_pub:id});
  if(error){if(b){b.disabled=false;b.textContent='✅ Leí este documento';}return banner('No se pudo registrar la lectura: '+errMsg(error),'err');}
  S.leidas[id]={v:(data&&data.version)||((S.pubs.find(x=>x.id===id)||{}).version||1),at:(data&&data.leido_at)||new Date().toISOString()};
  const r=$('vzRead');if(r)r.outerHTML=readBarHTML(id);buildNav();if(cur==='muro')viewMuro();banner('Lectura registrada ✓');}
function abrirVisor(c,meta){meta=meta||{};const v=$('visor');v.style.setProperty('--vz',lsGet('docs_vz','22')+'px');const op=c.tipo==='orden_produccion';
  v.innerHTML=`<div class="vz-bar"><button class="btn" onclick="cerrarVisor()">✕ Cerrar</button><span class="lbl">${op?'Orden de producción':'Pedido'} ${esc(c.codigo||'')}${op&&c._linea?' · 🏭 '+esc(c._linea):''}</span><span class="sp"></span>
   <button class="btn" onclick="vzFont(-2)" title="Letra más chica">A−</button><button class="btn" onclick="vzFont(2)" title="Letra más grande">A+</button>
   <button class="btn" onclick="vzFull()">⛶ Pantalla completa</button><button class="btn" onclick="window.print()">🖨️ Imprimir</button>${meta.preview&&meta.onPub?'<button class="btn btn-gold" onclick="vzPub()">📤 Publicar</button>':''}</div>
   ${meta.preview?'<div class="vz-prev">VISTA PREVIA — así lo va a ver la gente cuando lo publiques</div>':''}
   ${docHTML(c,{meta,extra:(meta.pubId&&!meta.anterior)?readBarHTML(meta.pubId):''})}`;
  window._vzPub=meta.onPub||null;v.classList.add('show');v.scrollTop=0;document.body.style.overflow='hidden';}
function vzPub(){const f=window._vzPub;cerrarVisor();if(f)f();}
function cerrarVisor(){$('visor').classList.remove('show');document.body.style.overflow='';try{if(document.fullscreenElement)document.exitFullscreen();}catch(e){}}
function vzFont(d){const v=$('visor');let s=parseInt(getComputedStyle(v).getPropertyValue('--vz'))||22;s=Math.max(14,Math.min(48,s+d));v.style.setProperty('--vz',s+'px');lsSet('docs_vz',String(s));}
function vzFull(){const v=$('visor');try{if(document.fullscreenElement)document.exitFullscreen();else if(v.requestFullscreen)v.requestFullscreen();else banner('Este navegador no permite pantalla completa','warn');}catch(e){banner('No se pudo poner en pantalla completa','warn');}}

// ══════════════ PUBLICAR ══════════════
async function viewPublicar(){
  $('view').innerHTML=setupNote()+'<div class="card"><div class="empty">⏳ Cargando pedidos y planes…</div></div>';
  try{await loadOrigenes();}catch(e){$('view').innerHTML=setupNote()+`<div class="note">No se pudieron cargar los datos: ${esc(errMsg(e))}</div>`;return;}
  const seg=(v,l)=>`<button class="btn btn-sm ${F.pedTab===v?'btn-gold':'btn-ghost'}" onclick="F.pedTab='${v}';viewPublicar()">${l}</button>`;
  const cliList=S.clientes.map(c=>({cod:c.codigo||'',nom:c.razon_social||'',val:c.id}));
  $('view').innerHTML=setupNote()+`<div class="card"><div class="card-h"><h3>Elegí qué publicar</h3><div class="seg">${seg('pedido','📋 Pedidos (sin valores)')}${seg('orden_produccion','🗓️ Órdenes de producción')}</div></div>
   ${F.pedTab==='pedido'?`<p class="hint">Pedidos pendientes y de los últimos 30 días. Al publicar se saca una <b>foto sin precios</b>. Si después el pedido cambia, te avisamos para republicarlo.</p>
   <div class="filters frm"><div class="f" style="min-width:300px;flex:1">Cliente${pairHTML('fcli',[{cod:'',nom:'— Todos —',val:''}].concat(cliList),F.pedCli,v=>{F.pedCli=v;drawPedidos();},'Buscar cliente…')}</div>
     <div class="f">N° de pedido<input class="in" id="fq" style="width:150px" placeholder="PED-…" value="${esc(F.pedQ)}" oninput="F.pedQ=this.value;drawPedidos()"></div>
     <label class="chk" style="padding-bottom:9px"><input type="checkbox" ${F.pedEntregados?'checked':''} onchange="F.pedEntregados=this.checked;drawPedidos()"> Incluir entregados</label></div>`
   :`<p class="hint">Planes de producción guardados en CONTROL TRACE. La orden muestra <b>solo productos y cantidades a producir</b>${(S.lineas||[]).length?' y la <b>línea</b> a la que corresponde':''}.</p>${S.planesErr?`<div class="note">${esc(S.planesErr)}</div>`:''}${(S.lineas||[]).length?`<div class="filters">${linSeg('pubLinea','drawPlanes')}</div>`:''}`}
   <div id="lst"></div></div>`;
  if(F.pedTab==='pedido')drawPedidos();else drawPlanes();
}
function cliNom(id){const c=S.clientes.find(x=>x.id===id);return c?c.razon_social:'—';}
function cliCod(id){const c=S.clientes.find(x=>x.id===id);return c?(c.codigo||''):'';}
function docsBadge(tipo,id){const p=pubDeOrigen(tipo,id);if(!p)return '<span class="tag t-mut">No publicado</span>';return `<span class="tag t-nav">v${p.version}</span> `+estadoTag(p);}
function drawPedidos(){
  const q=(F.pedQ||'').trim().toUpperCase();
  let L=(S.pedidos||[]).filter(p=>(F.pedEntregados||p.estado==='pendiente')&&(!F.pedCli||p.cliente_id===F.pedCli)&&(!q||String(p.codigo||'').toUpperCase().includes(q)));
  const ent=p=>String(p.fecha_entrega||p.fecha||'').slice(0,10);
  L.sort((a,b)=>ent(a).localeCompare(ent(b))||String(a.codigo).localeCompare(b.codigo));
  const rows=L.map(p=>Object.assign({_k:p.id,_lbl:p.codigo},p));
  grid('lst','ped',[
    {h:'Pedido',f:r=>`<b>${esc(r.codigo)}</b>${r.orden_compra?`<br><span class="cod">OC ${esc(r.orden_compra)}</span>`:''}`},
    {h:'Entrega',f:r=>`${esc(diaRel(ent(r)))}<br><span class="cod">${fmtD(ent(r))}</span>`},
    {h:'Cliente',f:r=>`${cliCod(r.cliente_id)?`<span class="cod">${esc(cliCod(r.cliente_id))}</span> `:''}${esc(cliNom(r.cliente_id))}`},
    {h:'Unid.',cls:'num',f:r=>nf(S.pedItems[r.id]||0)},
    {h:'Estado',f:r=>r.estado==='pendiente'?'<span class="tag t-warn">Pendiente</span>':'<span class="tag t-ok">Entregado</span>'},
    {h:'En DOCS',f:r=>docsBadge('pedido',r.id)}],rows,r=>{const pub=pubDeOrigen('pedido',r.id);return [
      {lbl:'👁 Vista previa',fn:()=>previa('pedido',r.id)},
      {lbl:pub?'🔁 Republicar':'📤 Publicar',cls:'btn-gold',fn:()=>pubModal('pedido',r.id,pub)},
      ...(pub?[{lbl:'🗂️ Ver publicación',fn:()=>verPub(pub.id)}]:[])];});
}
function drawPlanes(){
  const ent=p=>String(p.fecha_entrega||(p.fecha?addDays(String(p.fecha).slice(0,10),1):'')).slice(0,10);
  if(F.pedTab==='orden_produccion'&&document.querySelector('#view .filters')&&(S.lineas||[]).length){const f=document.querySelector('#view .filters');f.innerHTML=linSeg('pubLinea','drawPlanes');}
  const rows=(S.planes||[]).filter(p=>!F.pubLinea||(p.linea_id||'')===F.pubLinea).map(p=>{const it=(Array.isArray(p.plan)?p.plan:[]).filter(x=>(+x.producir||0)>0);return Object.assign({_k:p.id,_lbl:p.codigo+(planLineaRow(p).nombre?' · '+planLineaRow(p).nombre:''),_n:it.length,_t:it.reduce((a,x)=>a+(+x.producir||0),0)},p);});
  rows.sort((a,b)=>ent(b).localeCompare(ent(a)));
  grid('lst','plan',[
    {h:'Plan',f:r=>`<b>${esc(r.codigo||'—')}</b>`},
    ...((S.lineas||[]).length?[{h:'Línea',f:r=>planLineaRow(r).nombre?`<span class="tag t-nav">🏭 ${esc(planLineaRow(r).nombre)}</span>`:'<span class="cod">Todas</span>'}]:[]),
    {h:'Producción',f:r=>`${esc(diaRel(String(r.fecha||'').slice(0,10)))}<br><span class="cod">${fmtD(r.fecha)}</span>`},
    {h:'Entrega',f:r=>`${esc(diaRel(ent(r)))}<br><span class="cod">${fmtD(ent(r))}</span>`},
    {h:'Productos',cls:'num',f:r=>nf(r._n)},
    {h:'A producir',cls:'num',f:r=>`<b>${nf(r._t)}</b>`},
    {h:'Plan',f:r=>r.confirmado?'<span class="tag t-ok">Confirmado</span>':'<span class="tag t-warn">Proyectado</span>'},
    {h:'En DOCS',f:r=>docsBadge('orden_produccion',r.id)}],rows,r=>{const pub=pubDeOrigen('orden_produccion',r.id);return [
      {lbl:'👁 Vista previa',fn:()=>previa('orden_produccion',r.id)},
      {lbl:pub?'🔁 Republicar':'📤 Publicar',cls:'btn-gold',dis:!r._n,fn:()=>pubModal('orden_produccion',r.id,pub)},
      ...(pub?[{lbl:'🗂️ Ver publicación',fn:()=>verPub(pub.id)}]:[])];});
}
async function snap(tipo,id){const fn=tipo==='pedido'?'docs_snap_pedido':'docs_snap_plan';const {data,error}=await sb.rpc(fn,{p_id:id});if(error)throw error;return data;}
async function previa(tipo,id){try{let c=await snap(tipo,id);if(tipo==='orden_produccion')c=conLinea(c,planLineaRow((S.planes||[]).find(x=>x.id===id)));abrirVisor(c,{preview:true,onPub:()=>pubModal(tipo,id,pubDeOrigen(tipo,id))});}catch(e){banner('No se pudo armar la vista previa: '+errMsg(e),'err');}}
function pubModal(tipo,id,pub){
  let def='',titulo='';
  if(tipo==='pedido'){const p=(S.pedidos||[]).find(x=>x.id===id);if(p){titulo='Pedido '+p.codigo+' · '+cliNom(p.cliente_id);def=addDays(String(p.fecha_entrega||p.fecha||'').slice(0,10),1);}}
  else{const p=(S.planes||[]).find(x=>x.id===id);if(p){titulo='Orden de producción '+(p.codigo||'')+(planLineaRow(p).nombre?' · '+planLineaRow(p).nombre:'');def=addDays(String(p.fecha_entrega||(p.fecha?addDays(String(p.fecha).slice(0,10),1):'')).slice(0,10),1);}}
  if(pub&&!titulo)titulo=pub.titulo;
  const roles=pub?(pub.roles||[]):[];const todos=!roles.length;
  modal(`<h3>${pub?'🔁 Republicar':'📤 Publicar'} en el muro</h3><p class="hint"><b>${esc(titulo)}</b>${pub?`<br>Se reemplaza la versión ${pub.version} por una nueva foto actualizada (la anterior queda en el historial).`:''}</p>
   <label class="lb">¿Quién lo ve?</label>
   <label class="chk"><input type="checkbox" id="pm_todos" ${todos?'checked':''} onchange="pmTodos()"> <b>Todos los roles</b></label>
   <div class="rolgrid" id="pm_roles">${ROLES.map(r=>`<label class="chk"><input type="checkbox" data-rol="${r}" ${todos||roles.includes(r)?'checked':''} ${todos?'disabled':''}> ${ROL_LABEL[r]}</label>`).join('')}</div>
   <div class="hint" style="margin:4px 0 0">Los administradores y quienes publican ven todo siempre.</div>
   <label class="lb">Visible hasta</label><input class="in" type="date" id="pm_vig" value="${esc(pub&&pub.vigente_hasta&&!def?String(pub.vigente_hasta).slice(0,10):def)}">
   <div class="hint" style="margin:4px 0 0">Por defecto: el día siguiente a la entrega. Después pasa a <b>Vencido</b> y deja de verse en el muro.</div>
   <div class="row"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-gold" id="pm_ok" onclick="doPublicar('${tipo}','${id}')">${pub?'🔁 Republicar':'📤 Publicar'}</button></div>`);}
function pmTodos(){const on=$('pm_todos').checked;document.querySelectorAll('#pm_roles input').forEach(c=>{c.disabled=on;if(on)c.checked=true;});}
async function doPublicar(tipo,id){
  const todos=$('pm_todos').checked;const roles=todos?[]:[...document.querySelectorAll('#pm_roles input:checked')].map(c=>c.dataset.rol);
  if(!todos&&!roles.length)return banner('Elegí al menos un rol (o Todos)','warn');
  const vig=$('pm_vig').value||null;if(vig&&vig<today())return banner('La fecha "visible hasta" no puede ser anterior a hoy','warn');
  const b=$('pm_ok');b.disabled=true;b.textContent='⏳ Publicando…';
  const {data,error}=await sb.rpc('docs_publicar',{p_tipo:tipo,p_id:id,p_roles:roles,p_vigente:vig});
  if(error){b.disabled=false;b.textContent='📤 Publicar';return banner('No se pudo publicar: '+errMsg(error),'err');}
  closeModal();await loadPubs();buildNav();banner((data&&data.version>1?'Republicado (v'+data.version+')':'Publicado en el muro')+' ✓');
  if(cur==='publicar'){if(F.pedTab==='pedido')drawPedidos();else drawPlanes();}else go(cur);}

// ══════════════ PUBLICACIONES (gestión) ══════════════
function viewPubs(){
  const seg=(k,v,l)=>`<button class="btn btn-sm ${F[k]===v?'btn-gold':'btn-ghost'}" onclick="F.${k}='${v}';viewPubs()">${l}</button>`;
  const ch=Object.values(S.cambios).filter(c=>c.cambiado&&c.existe!==false).length;
  $('view').innerHTML=setupNote()+`<div class="card"><div class="card-h"><h3>Todo lo publicado</h3></div>
   ${ch?`<div class="note">⚠️ <b>${ch} publicación(es)</b> cambiaron en su origen (pedido o plan editado). Seleccionalas y tocá <b>Republicar</b> para que el muro muestre lo actual.</div>`:''}
   <div class="filters"><div class="seg">${seg('pubEstado','activas','Publicadas')}${seg('pubEstado','vencido','Vencidas')}${seg('pubEstado','retirado','Retiradas')}${seg('pubEstado','todas','Todas')}</div>
    <div class="seg">${seg('pubTipo','todos','Todos')}${seg('pubTipo','pedido','Pedidos')}${seg('pubTipo','orden_produccion','Órdenes')}</div></div>
   <div id="lst"></div></div>`;
  let L=S.pubs.slice();
  if(F.pubEstado==='activas')L=L.filter(p=>estadoPub(p)==='publicado');else if(F.pubEstado!=='todas')L=L.filter(p=>estadoPub(p)===F.pubEstado);
  if(F.pubTipo!=='todos')L=L.filter(p=>p.tipo===F.pubTipo);
  L.sort((a,b)=>{const ca=S.cambios[a.id]&&S.cambios[a.id].cambiado?0:1,cb=S.cambios[b.id]&&S.cambios[b.id].cambiado?0:1;return ca-cb||String(b.fecha_ref||'').localeCompare(String(a.fecha_ref||''));});
  const rows=L.map(p=>Object.assign({_k:p.id,_lbl:p.origen_codigo||p.titulo},p));
  grid('lst','pubs',[
    {h:'Tipo',f:r=>r.tipo==='pedido'?'📋 Pedido':'🗓️ Orden'},
    {h:'Documento',f:r=>`<b>${esc(r.titulo)}</b>${pubLinea(r).nombre?` <span class="tag t-nav">🏭 ${esc(pubLinea(r).nombre)}</span>`:''}`},
    {h:'Entrega',f:r=>`${esc(diaRel(String(r.fecha_ref||'').slice(0,10)))}<br><span class="cod">${fmtD(r.fecha_ref)}</span>`},
    {h:'Versión',cls:'num',f:r=>'v'+r.version},
    {h:'Estado',f:r=>estadoTag(r)+(r.estado==='retirado'&&r.motivo_retiro?`<br><span class="cod">${esc(r.motivo_retiro)}</span>`:'')},
    {h:'Para',f:r=>esc(rolesTxt(r.roles))},
    ...(S.lectOk?[{h:'Leído',cls:'num',f:r=>`<b>${nf(S.lectCnt[r.id]||0)}</b><br><span class="cod">v${r.version}</span>`}]:[]),
    {h:'Publicó',f:r=>`${esc(r.publicado_por_nombre||'—')}<br><span class="cod">${fmtTs(r.publicado_at)}</span>`}],rows,r=>{const c=S.cambios[r.id];const borrado=c&&c.existe===false;const e=estadoPub(r);return [
      {lbl:'👁 Ver',fn:()=>verPub(r.id)},
      {lbl:(c&&c.cambiado&&!borrado)?'🔁 Republicar (cambió)':'🔁 Republicar',cls:(c&&c.cambiado&&!borrado)?'btn-gold':'btn-ghost',dis:borrado,fn:()=>{loadOrigenesQuiet();pubModal(r.tipo,r.origen_id,r);}},
      ...(e!=='retirado'?[{lbl:'✕ Retirar',cls:'btn-danger',fn:()=>retirarModal(r)}]:[]),
      ...(S.lectOk?[{lbl:'👥 Lecturas',fn:()=>lecturas(r)}]:[]),
      ...(r.version>1?[{lbl:'🕘 Historial',fn:()=>historial(r)}]:[])];});
}
async function lecturas(p){const {data,error}=await sb.rpc('docs_lecturas_pub',{p_pub:p.id});
  if(error)return banner('No se pudieron leer las lecturas: '+errMsg(error),'err');
  const L=data||[];const ok=L.filter(x=>x.al_dia).length;
  modal(`<h3>👥 Lecturas · ${esc(p.titulo)}</h3><p class="hint">Versión actual: <b>v${p.version}</b> · para <b>${esc(rolesTxt(p.roles))}</b>. Leyeron <b>${ok}</b> de ${L.length}.</p>
   <div class="tscroll"><table><thead><tr><th>Usuario</th><th>Rol</th><th>Estado</th></tr></thead><tbody>
   ${L.map(x=>`<tr><td>${esc(x.nombre||'—')}</td><td>${esc(ROL_LABEL[x.rol]||x.rol||'—')}</td><td>${x.al_dia?`<span class="tag t-ok">✅ Leyó</span> <span class="cod">${fmtTs(x.leido_at)}</span>`:x.version?`<span class="tag t-warn">🔄 Leyó la v${x.version}</span> <span class="cod">${fmtTs(x.leido_at)}</span>`:'<span class="tag t-mut">⏳ Pendiente</span>'}</td></tr>`).join('')||'<tr><td colspan="3" class="empty">Sin usuarios en la audiencia</td></tr>'}
   </tbody></table></div><div class="row"><button class="btn btn-gold" onclick="closeModal()">Cerrar</button></div>`);}
function loadOrigenesQuiet(){if(S.pedidos==null||S.planes==null)loadOrigenes().catch(()=>{});}
function retirarModal(p){modal(`<h3>✕ Retirar del muro</h3><p class="hint"><b>${esc(p.titulo)}</b><br>Deja de verse en el muro. No se borra: queda en <b>Retiradas</b> y en Novedades.</p>
   <div class="frm"><label class="lb">Motivo</label><input class="in" id="rt_mot" placeholder="ej: el pedido se reprogramó"></div>
   <div class="row"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-gold" id="rt_ok" onclick="doRetirar('${p.id}')">Retirar</button></div>`);}
async function doRetirar(id){const m=$('rt_mot').value.trim();if(!m)return banner('Indicá el motivo','warn');const b=$('rt_ok');b.disabled=true;
  const {error}=await sb.rpc('docs_retirar',{p_pub:id,p_motivo:m});if(error){b.disabled=false;return banner('No se pudo retirar: '+errMsg(error),'err');}
  closeModal();await loadPubs();buildNav();banner('Retirado del muro');viewPubs();}
async function historial(p){const {data,error}=await sb.from('docs_versiones').select('*').eq('publicacion_id',p.id).order('version',{ascending:false});
  if(error)return banner('No se pudo leer el historial: '+errMsg(error),'err');window._hist=data||[];
  modal(`<h3>🕘 Historial · ${esc(p.titulo)}</h3><div class="tscroll"><table><thead><tr><th>Versión</th><th>Publicado</th><th>Por</th><th></th></tr></thead><tbody>
   <tr><td><b>v${p.version}</b> <span class="tag t-ok">actual</span></td><td>${fmtTs(p.publicado_at)}</td><td>${esc(p.publicado_por_nombre||'—')}</td><td><button class="btn btn-ghost btn-sm" onclick="closeModal();verPub('${p.id}')">👁 Ver</button></td></tr>
   ${window._hist.map((h,i)=>`<tr><td>v${h.version}</td><td>${fmtTs(h.publicado_at)}</td><td>${esc(h.publicado_por_nombre||'—')}</td><td><button class="btn btn-ghost btn-sm" onclick="verHist(${i})">👁 Ver</button></td></tr>`).join('')}</tbody></table></div>
   <div class="row"><button class="btn btn-gold" onclick="closeModal()">Cerrar</button></div>`);}
function verHist(i){const h=window._hist[i];if(!h)return;closeModal();abrirVisor(conLinea(h.contenido||{},S.planLin[(S.pubs.find(x=>x.id===h.publicacion_id)||{}).origen_id]),{version:h.version,publicado_at:h.publicado_at,por:h.publicado_por_nombre,anterior:true});}

// ══════════════ MODO PANTALLA (TV del galpón) ══════════════
const PT={cfg:null,slides:[],i:0,t:null,clk:null,poll:null,lock:null,paused:false,mouseT:null,dirty:false};
function ptCfgDef(){return {tipo:'todos',cuando:'hoyman',seg:20,fs:28,linea:''};}
function ptParse(q){const c=ptCfgDef();try{const u=new URLSearchParams(q||'');if(u.get('tipo'))c.tipo=u.get('tipo');if(u.get('linea'))c.linea=u.get('linea');if(u.get('cuando'))c.cuando=u.get('cuando');if(+u.get('seg'))c.seg=Math.max(5,Math.min(300,+u.get('seg')));if(+u.get('fs'))c.fs=Math.max(16,Math.min(64,+u.get('fs')));}catch(e){}return c;}
function ptURL(c){const q={tipo:c.tipo,cuando:c.cuando,seg:c.seg,fs:c.fs,auto:1};if(c.linea)q.linea=c.linea;return location.origin+location.pathname+'#pantalla?'+new URLSearchParams(q).toString();}
function viewPantalla(){const c=PT.cfg||(PT.cfg=Object.assign(ptCfgDef(),JSON.parse(lsGet('docs_pt','{}')||'{}')));
  const o=(id,list,v)=>`<select class="in" id="${id}">${list.map(([a,b])=>`<option value="${a}"${String(a)===String(v)?' selected':''}>${b}</option>`).join('')}</select>`;
  $('view').innerHTML=setupNote()+`<div class="card frm"><div class="card-h"><h3>📺 Modo pantalla</h3></div>
   <p class="hint">Para una TV o monitor en el galpón: muestra los documentos publicados en grande, uno tras otro, sin menú. Si un documento no entra en la pantalla, lo parte en páginas solas. Se actualiza solo cada minuto y la pantalla no se apaga.</p>
   <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px">
    <div><label class="lb">Qué mostrar</label>${o('pt_tipo',[['todos','Pedidos y órdenes'],['pedido','Solo pedidos'],['orden_produccion','Solo órdenes de producción']],c.tipo)}</div>
    ${lineasUsadas().length?`<div><label class="lb">Línea de producción</label>${o('pt_linea',[['','Todas las líneas']].concat(lineasUsadas().map(l=>[l.id,'🏭 '+l.nombre+' (solo sus órdenes)'])),c.linea||'')}</div>`:''}
    <div><label class="lb">Entregas de</label>${o('pt_cuando',[['hoy','Hoy'],['hoyman','Hoy y mañana'],['proximos','Hoy en adelante']],c.cuando)}</div>
    <div><label class="lb">Segundos por página</label>${o('pt_seg',[[10,'10 s'],[15,'15 s'],[20,'20 s'],[30,'30 s'],[45,'45 s'],[60,'1 minuto']],c.seg)}</div>
    <div><label class="lb">Tamaño de letra</label>${o('pt_fs',[[22,'Normal'],[28,'Grande'],[34,'Muy grande'],[42,'Enorme']],c.fs)}</div>
   </div>
   <div class="row" style="justify-content:flex-start"><button class="btn btn-gold" onclick="ptDesdeForm()">▶ Iniciar modo pantalla</button></div></div>
   <div class="card"><div class="card-h"><h3>Para dejarlo fijo en una TV</h3></div>
   <ol class="hint" style="padding-left:18px;margin:0 0 12px">
    <li>En la TV (o la PC conectada a la TV) entrá a CONTROL MAX con un usuario propio para la pantalla. Conviene crearlo en <b>Configuración MAX → Usuarios</b> con rol <b>Preparador</b>: así ve lo mismo que el galpón.</li>
    <li>Abrí esta dirección y guardala como favorito o página de inicio: arranca sola en modo pantalla con la configuración de arriba.</li>
    <li>La primera vez tocá la pantalla una vez para que pase a pantalla completa (el navegador lo exige).</li></ol>
   <div class="urlbox"><span id="pt_url" style="flex:1">${esc(ptURL(c))}</span><button class="btn btn-ghost btn-sm" onclick="ptCopiar()">📋 Copiar</button></div>
   <p class="hint" style="margin:10px 0 0">En pantalla: <b>→ / ←</b> pasan de documento, <b>espacio</b> pausa, <b>Esc</b> sale. Con el mouse aparece el botón <b>Salir</b>. Lo que se ve en la TV no cuenta como lectura de nadie.</p></div>`;
  ['pt_tipo','pt_cuando','pt_seg','pt_fs','pt_linea'].filter(id=>$(id)).forEach(id=>$(id).addEventListener('change',()=>{ptLeerForm();$('pt_url').textContent=ptURL(PT.cfg);}));}
function ptLeerForm(){PT.cfg={tipo:$('pt_tipo').value,cuando:$('pt_cuando').value,seg:+$('pt_seg').value,fs:+$('pt_fs').value,linea:$('pt_linea')?$('pt_linea').value:''};lsSet('docs_pt',JSON.stringify(PT.cfg));}
function ptDesdeForm(){ptLeerForm();ptStart(PT.cfg,true);}
function ptCopiar(){const t=$('pt_url').textContent;try{navigator.clipboard.writeText(t).then(()=>banner('Dirección copiada ✓'),()=>banner('Copiala a mano: seleccioná el texto','warn'));}catch(e){banner('Copiala a mano: seleccioná el texto','warn');}}
function ptDocs(){const c=PT.cfg,t=today();const fr=p=>String(p.fecha_ref||'').slice(0,10);
  let L=S.pubs.filter(p=>estadoPub(p)==='publicado');
  if(c.tipo!=='todos')L=L.filter(p=>p.tipo===c.tipo);
  if(c.linea)L=L.filter(p=>pasaLinea(p,c.linea));
  if(c.cuando==='hoy')L=L.filter(p=>fr(p)===t);else if(c.cuando==='hoyman')L=L.filter(p=>fr(p)===t||fr(p)===addDays(t,1));else L=L.filter(p=>!fr(p)||fr(p)>=t);
  return L.sort((a,b)=>fr(a).localeCompare(fr(b))||(a.tipo===b.tipo?0:a.tipo==='orden_produccion'?-1:1)||pubLinea(a).nombre.localeCompare(pubLinea(b).nombre)||String(a.titulo).localeCompare(b.titulo));}
// Parte un documento en páginas que entren en la pantalla
function ptPaginar(p){const st=$('pantStage');const c=conLinea(p.contenido||{},pubLinea(p));const items=c.items||[];
  st.innerHTML=docHTML(c,{meta:{version:p.version,publicado_at:p.publicado_at,por:p.publicado_por_nombre}});
  const vz=st.querySelector('.vz');const H=st.clientHeight;
  if(!items.length||vz.offsetHeight<=H)return [{p,items,pag:1,pags:1}];
  const rows=[...vz.querySelectorAll('tbody tr')];const top=vz.getBoundingClientRect().top;
  const r0=rows[0].getBoundingClientRect().top-top;const rl=rows[rows.length-1].getBoundingClientRect().bottom-top;
  const tail=vz.offsetHeight-rl;const avail=Math.max(40,H-r0-tail-14);
  const pages=[];let curr=[],h=0;
  rows.forEach((tr,i)=>{const rh=tr.getBoundingClientRect().height;if(curr.length&&h+rh>avail){pages.push(curr);curr=[];h=0;}curr.push(items[i]);h+=rh;});
  if(curr.length)pages.push(curr);
  return pages.map((it,k)=>({p,items:it,pag:k+1,pags:pages.length}));}
function ptBuild(){PT.slides=[];ptDocs().forEach(p=>{PT.slides.push(...ptPaginar(p));});PT.dirty=false;}
function ptShow(){clearTimeout(PT.t);const st=$('pantStage');const n=PT.slides.length;
  if(!n){st.innerHTML=`<div class="pt-empty"><div style="font-size:60px">📭</div><div class="big">Sin documentos para mostrar</div><div style="font-size:20px">${PT.cfg.cuando==='hoy'?'No hay entregas publicadas para hoy.':PT.cfg.cuando==='hoyman'?'No hay entregas publicadas para hoy ni mañana.':'No hay documentos publicados.'}</div><div style="font-size:15px">La pantalla se actualiza sola cada minuto.</div></div>`;$('ptN').textContent='';ptProg(0);return;}
  if(PT.i>=n)PT.i=0;if(PT.i<0)PT.i=n-1;
  const s=PT.slides[PT.i];const docs=[...new Set(PT.slides.map(x=>x.p.id))];const di=docs.indexOf(s.p.id)+1;
  st.innerHTML=docHTML(conLinea(s.p.contenido||{},pubLinea(s.p)),{items:s.items,pag:s.pag,pags:s.pags,meta:{version:s.p.version,publicado_at:s.p.publicado_at,por:s.p.publicado_por_nombre}});
  $('ptN').textContent=`Documento ${di} de ${docs.length}`+(s.pags>1?` · pág. ${s.pag}/${s.pags}`:'')+(PT.paused?' · ⏸ pausa':'');
  if(PT.paused)return ptProg(0);
  ptProg(PT.cfg.seg);
  PT.t=setTimeout(()=>{PT.i++;if(PT.i>=PT.slides.length){PT.i=0;if(PT.dirty)ptBuild();}ptShow();},PT.cfg.seg*1000);}
function ptProg(seg){const i=$('ptProg');if(!i)return;i.style.transition='none';i.style.width='0';void i.offsetWidth;if(seg){i.style.transition='width '+seg+'s linear';i.style.width='100%';}}
function ptClock(){const d=new Date();const c=$('ptClk');if(c)c.textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');const f=$('ptFecha');if(f)f.innerHTML=DIAS[d.getDay()].replace(/^./,x=>x.toUpperCase())+'<br>'+fmtD(today());}
async function ptWake(){try{if('wakeLock' in navigator){PT.lock=await navigator.wakeLock.request('screen');}}catch(e){}}
async function ptStart(cfg,gesto){PT.cfg=cfg;PT.i=0;PT.paused=false;
  let el=$('pant');if(!el){el=document.createElement('div');el.id='pant';document.body.appendChild(el);}
  const e=S.empresa||{};
  el.innerHTML=`<div class="pt-strip"><span class="pt-t">CONTROL DOCS</span><span class="pt-e">${esc(e.razon_social||'')}${cfg.linea&&lineaNom(cfg.linea)?' · 🏭 '+esc(lineaNom(cfg.linea)):''}</span><span class="sp"></span><span class="pt-n" id="ptN"></span>
   <button class="btn btn-sm" onclick="ptMove(-1)">◀</button><button class="btn btn-sm" onclick="ptPausa()">⏯</button><button class="btn btn-sm" onclick="ptMove(1)">▶</button><button class="btn btn-sm" onclick="ptStop()">✕ Salir</button>
   <span class="pt-d" id="ptFecha"></span><span class="pt-clk" id="ptClk"></span></div><div class="pt-prog"><i id="ptProg"></i></div><div id="pantStage"></div>`;
  $('pantStage').style.setProperty('--vz',cfg.fs+'px');
  el.classList.add('show');document.body.style.overflow='hidden';
  el.onmousemove=()=>{el.classList.add('mouse');clearTimeout(PT.mouseT);PT.mouseT=setTimeout(()=>el.classList.remove('mouse'),3000);};
  if(gesto){try{if(el.requestFullscreen&&!document.fullscreenElement)await el.requestFullscreen();}catch(x){}}
  else{const h=document.createElement('div');h.className='pt-hint';h.id='ptHint';h.textContent='👆 Tocá la pantalla para verla completa';el.appendChild(h);el.addEventListener('click',ptFsClick);}
  ptWake();ptClock();clearInterval(PT.clk);PT.clk=setInterval(ptClock,15000);
  clearInterval(PT.poll);PT.poll=setInterval(ptRefresh,60000);
  ptBuild();ptShow();}
async function ptFsClick(){const el=$('pant');const h=$('ptHint');if(h)h.remove();el.removeEventListener('click',ptFsClick);try{if(el.requestFullscreen&&!document.fullscreenElement)await el.requestFullscreen();}catch(e){}}
async function ptRefresh(){try{const prev=JSON.stringify(ptDocs().map(p=>p.id+':'+p.version));await loadPubs();const now=JSON.stringify(ptDocs().map(p=>p.id+':'+p.version));
  if(prev!==now){if(!PT.slides.length){ptBuild();PT.i=0;ptShow();}else PT.dirty=true;}}catch(e){}}
function ptMove(d){if(!PT.slides.length)return;PT.i+=d;if(PT.i>=PT.slides.length){PT.i=0;if(PT.dirty)ptBuild();}ptShow();}
function ptPausa(){PT.paused=!PT.paused;ptShow();}
function ptStop(){clearTimeout(PT.t);clearInterval(PT.clk);clearInterval(PT.poll);try{if(PT.lock)PT.lock.release();}catch(e){}PT.lock=null;
  try{if(document.fullscreenElement)document.exitFullscreen();}catch(e){}
  const el=$('pant');if(el){el.classList.remove('show');el.innerHTML='';}document.body.style.overflow='';
  try{history.replaceState(null,'','#pantalla');}catch(e){}go('pantalla');}
document.addEventListener('keydown',ev=>{const el=$('pant');if(!el||!el.classList.contains('show'))return;
  if(ev.key==='ArrowRight'){ev.preventDefault();ptMove(1);}else if(ev.key==='ArrowLeft'){ev.preventDefault();ptMove(-1);}else if(ev.key===' '){ev.preventDefault();ptPausa();}else if(ev.key==='Escape'){ev.preventDefault();ptStop();}},true);
document.addEventListener('visibilitychange',()=>{const el=$('pant');if(!document.hidden&&el&&el.classList.contains('show'))ptWake();});
let _ptRz=null;window.addEventListener('resize',()=>{const el=$('pant');if(!el||!el.classList.contains('show'))return;clearTimeout(_ptRz);_ptRz=setTimeout(()=>{const id=PT.slides[PT.i]&&PT.slides[PT.i].p.id;ptBuild();const k=PT.slides.findIndex(x=>x.p.id===id);PT.i=k<0?0:k;ptShow();},400);});

// ══════════════ INICIO ══════════════
function lock(msg){$('splash').innerHTML=`<div style="font-size:34px">🔒</div><div style="font-size:17px;font-weight:800">${msg}</div><a href="/portal.html" style="color:var(--gold);margin-top:8px">← Volver al portal CONTROL MAX</a>`;}
async function init(){
  $('buildLbl').textContent=BUILD;
  const {data:{session}}=await sb.auth.getSession();
  if(!session||!session.user){location.href='/portal.html';return;}
  const {data:perfil,error:pe}=await sb.from('perfiles').select('nombre,rol,empresa_id,activo').eq('id',session.user.id).single();
  if(pe||!perfil||perfil.activo===false){location.href='/portal.html';return;}
  S.uid=session.user.id;S.empresaId=perfil.empresa_id;S.rol=(perfil.rol||'').toLowerCase();S.nombre=perfil.nombre||session.user.email;
  const {data:emp}=await sb.from('empresas').select('*').eq('id',S.empresaId).single();S.empresa=emp||{};
  // plan y permisos de módulo (Configuración MAX)
  const mods=S.empresa.modulos;if(mods&&typeof mods==='object'&&mods.docs===false)return lock('CONTROL DOCS no está en el plan de tu empresa');
  const pm=S.empresa.permisos_max&&S.empresa.permisos_max.modulos;
  if(!esAdmin()&&pm&&Array.isArray(pm[S.rol])&&!pm[S.rol].includes('docs'))return lock('Tu rol no tiene acceso a CONTROL DOCS');
  const r=await sb.rpc('docs_puede_publicar');
  if(r.error){S.puede=false;if(/docs_puede_publicar|PGRST202|does not exist|Could not find/i.test(r.error.message||''))S.sqlOk=false;}else S.puede=!!r.data;
  await loadPubs();
  $('empName').textContent=S.empresa.razon_social||'';$('whoName').textContent=S.nombre;$('whoRole').textContent=(ROL_LABEL[S.rol]||S.rol)+(S.puede?' · publica':'');
  $('splash').style.display='none';$('app').style.display='block';
  const hh=(location.hash||'').slice(1);const h=hh.split('?')[0];
  if(h==='pantalla'&&/auto=1/.test(hh)){go('pantalla');PT.cfg=ptParse(hh.split('?')[1]);ptStart(PT.cfg,false);return;}
  go(META[h]?h:'muro');
}
document.addEventListener('visibilitychange',async()=>{if(document.hidden||!S.empresaId||$('modalBg').classList.contains('show'))return;try{await loadPubs();buildNav();if(cur!=='publicar'&&cur!=='pantalla'&&!$('visor').classList.contains('show'))go(cur);}catch(e){}});
init().catch(e=>{console.error(e);$('splash').innerHTML='<div style="padding:20px">No se pudo iniciar CONTROL DOCS: '+esc(errMsg(e))+'</div><a href="/portal.html" style="color:var(--gold)">← Volver al portal</a>';});
</script>
